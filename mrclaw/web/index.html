<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>MRClaw</title>
<style>
:root{
  --bg:#0E1116; --panel:#151A21; --panel2:#11161C; --border:#232A34;
  --fg:#E7ECF3; --muted:#7C8798; --muted2:#6E7A8C; --inp:#0F1319;
  --line:#1F242C; --msg:#1A2028; --chip:#1A212B; --accent:#2F6BFF;
  --tip-bg:#1A2230; --tip-bd:#26364F; --tip-fg:#8FB4FF;
  --ghost-bg:#1B2029; --ghost-bd:#2A313D; --ghost-fg:#C9D3E0;
  --danger-bg:#2A1519; --danger-bd:#40202A; --danger-fg:#FF7A8A;
  --mask:rgba(6,9,13,.62); --sw:#2A313D;
}
body.light{
  --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#FFFFFF; --border:#E3E8EF;
  --fg:#1B2330; --muted:#6B7688; --muted2:#7B8697; --inp:#F7F9FC;
  --line:#E9EDF3; --msg:#F1F4F9; --chip:#FFFFFF; --accent:#2F6BFF;
  --tip-bg:#EAF1FF; --tip-bd:#C7D9FF; --tip-fg:#2A62D6;
  --ghost-bg:#FFFFFF; --ghost-bd:#DFE5EE; --ghost-fg:#3C4759;
  --danger-bg:#FDECEF; --danger-bd:#F5C9D1; --danger-fg:#D0394F;
  --mask:rgba(30,38,50,.35); --sw:#D7DEE8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overscroll-behavior:none}
#root{height:100%;display:flex;flex-direction:column}
.hide{display:none!important}
button,input,textarea,select{font:inherit;color:inherit;outline:none;border:none;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;
  width:100%;transition:.15s}
.btn:active{transform:scale(.98);opacity:.88}
.btn.ghost{background:var(--ghost-bg);border:1px solid var(--ghost-bd);color:var(--ghost-fg)}
.btn.mini{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.btn.danger{background:var(--danger-bg);color:var(--danger-fg);border:1px solid var(--danger-bd)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.muted{color:var(--muted);font-size:13px}
.tiny{font-size:12px;color:var(--muted2)}
label.f{display:block;margin:14px 0 6px;font-size:13px;color:var(--muted)}
.inp{width:100%;background:var(--inp);border:1px solid var(--ghost-bd);border-radius:12px;
  padding:13px 14px;color:var(--fg)}
.inp:focus{border-color:var(--accent)}
.mask{-webkit-text-security:disc;text-security:disc}
.lnk{color:#4C8BFF;text-decoration:underline;word-break:break-all}
.reddot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF3B4E;
  margin-left:4px;vertical-align:top}
.gcard{background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:14px;margin:10px 12px}
.gcard h4{margin:0 0 6px;font-size:15.5px}
.gcard .gm{font-size:12px;color:var(--muted2);margin-bottom:6px}
.gcard p{margin:0;color:var(--muted);font-size:14px;white-space:pre-wrap}
.gbar{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--muted2)}
.gbar span{cursor:pointer}
.gbar .on{color:#FF6A8A}
.gmedia{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gmedia img{max-width:104px;max-height:104px;border-radius:10px}
.gmedia video{max-width:150px;border-radius:10px}
.gmedia a{font-size:12px;color:var(--tip-fg);border:1px solid var(--tip-bd);
  background:var(--tip-bg);border-radius:9px;padding:5px 9px}
.gshare{background:var(--panel2);border:1px dashed var(--border);border-radius:12px;
  padding:10px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.gsearch{display:flex;gap:8px;padding:12px 12px 4px}
.gsearch input{flex:1}
.nlist{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;margin:10px 12px}
.nlist.unread{border-color:var(--tip-bd);background:var(--tip-bg)}
.nlist .nt{font-size:14px}
.nlist .nm{font-size:11.5px;color:var(--muted2);margin-top:4px}
.seg{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--border);
  border-radius:12px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13.5px}
.seg button.act{background:var(--accent);color:#fff}
.sw{width:48px;height:28px;border-radius:14px;background:var(--sw);position:relative;
  flex:0 0 48px;transition:.2s}
.sw.on{background:var(--accent)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:.2s}
.sw.on i{left:23px}
#auth{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 26px;overflow-y:auto}
.logo{text-align:center;margin-bottom:26px}
.logo b{font-size:30px;letter-spacing:1px}
.logo span{display:block;color:var(--muted2);font-size:12px;margin-top:6px;letter-spacing:3px}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
  padding-top:calc(14px + env(safe-area-inset-top))}
#top b{font-size:17px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#nav{display:flex;border-top:1px solid var(--line);background:var(--panel2);
  padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:9px 0 11px;color:var(--muted);font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
#nav button.act{color:var(--accent)}
#nav b{font-size:19px;font-weight:400}
#msgs{padding:10px 14px 6px}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;margin:7px 0;
  white-space:pre-wrap;word-break:break-word}
.msg.u{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.msg.a{background:var(--msg);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg.sys{background:transparent;color:var(--muted2);font-size:12px;text-align:center;
  margin:10px auto;max-width:100%}
.ahead{margin-bottom:7px;font-size:12px}
.ahead .run{color:var(--tip-fg)}
.ahead .ok{color:#3AAE6A}
.ahead .warn{color:#D3920F}
.ahead .bad{color:#D0394F}
#agentbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 12px 8px;padding:9px 14px;border-radius:12px;font-size:13px;
  background:var(--tip-bg);border:1px solid var(--tip-bd);color:var(--tip-fg)}
#agentbar .btn.mini{width:auto;flex:0 0 auto}
#bar{padding:8px 12px 10px;border-top:1px solid var(--line);background:var(--panel2)}
.barline{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
#toolrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
#pts-chip{font-size:12px;color:var(--muted2)}
.tb2{font-size:12px;padding:7px 10px}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#chips .chip{display:flex;align-items:center;gap:6px;background:var(--chip);
  border:1px solid var(--ghost-bd);border-radius:10px;padding:5px 8px;font-size:11.5px;
  max-width:48%}
#chips .chip img{width:26px;height:26px;object-fit:cover;border-radius:6px}
#chips .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chips .chip i{cursor:pointer;font-style:normal;color:var(--muted)}
.att{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.att img{max-width:170px;max-height:170px;border-radius:10px;display:block}
.att a{font-size:12px;color:var(--tip-fg);border:1px solid var(--tip-bd);
  background:var(--tip-bg);border-radius:9px;padding:5px 9px;text-decoration:none}
.att .up{opacity:.55}
#toolrow .btn.mini{width:auto;font-size:12.5px;padding:6px 12px}
#bar textarea{flex:1;background:var(--inp);border:1px solid var(--ghost-bd);border-radius:14px;
  padding:11px 14px;max-height:120px;resize:none;color:var(--fg)}
#send{background:var(--accent);color:#fff;border-radius:14px;width:46px;height:44px;
  font-size:18px;flex:0 0 46px}
#send.off{background:var(--chip);color:var(--muted)}
.toolbtn{background:var(--chip);border:1px solid var(--ghost-bd);color:var(--ghost-fg);
  border-radius:14px;width:44px;height:44px;flex:0 0 44px;font-size:17px}
.toolbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.skbar{padding:12px 12px 4px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 4px;
  -webkit-overflow-scrolling:touch}
.cats .cat{flex:0 0 auto;background:var(--panel);border:1px solid var(--border);
  color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13px}
.cats .cat.act{background:var(--accent);border-color:var(--accent);color:#fff}
.cats .cat i{font-style:normal;opacity:.7;font-size:11.5px}
.scard{display:flex;align-items:center;gap:12px;background:var(--panel);
  border:1px solid var(--border);border-radius:16px;padding:14px;margin:10px 12px}
.scard:active{background:var(--panel2)}
.sic{width:42px;height:42px;border-radius:12px;background:var(--panel2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:20px;flex:0 0 42px}
.stx{flex:1;min-width:0}
.sn{font-size:14.5px;font-weight:600;margin-bottom:3px}
.sd{font-size:12.5px;color:var(--muted)}
.tagmini{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:400;
  color:var(--tip-fg);background:var(--tip-bg);border:1px solid var(--tip-bd);
  border-radius:5px;padding:0 5px}
.cost{font-size:11.5px;color:var(--muted2);margin:-4px 0 8px}
.spk{text-align:left;margin:-2px 0 8px}
.spk span{font-size:11.5px;color:var(--muted2);border:1px solid var(--border);
  border-radius:8px;padding:2px 9px;background:var(--panel)}
.item{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:13px 14px;margin:10px 12px}
.item h4{margin:0 0 6px;font-size:14.5px}
.item p{margin:0;color:var(--muted);font-size:12.5px;white-space:pre-wrap}
.hd{padding:14px 16px 4px;font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted2);font-size:13px;padding:40px 20px}
#updbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:10px 12px 0;padding:10px 14px;border-radius:12px;font-size:13.5px;
  background:var(--tip-bg);border:1px solid var(--tip-bd);color:var(--tip-fg)}
#updbar .btn.mini{flex:0 0 auto}
#bc{overflow:hidden;background:var(--tip-bg);border-bottom:1px solid var(--tip-bd);padding:7px 0}
#bc .bcin{display:inline-block;white-space:nowrap;padding-left:100%;color:var(--tip-fg);
  font-size:13px;animation-name:bcroll;animation-timing-function:linear;
  animation-iteration-count:infinite;animation-duration:18s}
@keyframes bcroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#rv{position:fixed;inset:0;background:var(--mask);z-index:62;display:flex;
  align-items:center;justify-content:center;padding:20px}
.rvbox{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);
  border-radius:20px;padding:22px;max-height:90vh;overflow-y:auto}
.rvbox h3{margin:0 0 6px;font-size:18px;text-align:center}
.rvbox .rvsub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.stwrap{position:relative;width:34px;height:36px;font-size:32px;line-height:36px}
.stbg{position:absolute;left:0;top:0;color:var(--sw);width:34px;overflow:hidden}
.stfill{position:absolute;left:0;top:0;color:#FFC46D;width:34px;overflow:hidden;white-space:nowrap}
.stwrap .hit{position:absolute;top:0;height:100%;width:50%}
.stwrap .hit.l{left:0}
.stwrap .hit.r{right:0}
.rvscore{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}
.anonrow{display:flex;align-items:center;gap:10px;margin:12px 0}
.anonrow input{width:18px;height:18px}
#guide{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.gwrap{max-width:520px;margin:0 auto;padding:28px 22px 48px}
.gt{margin-bottom:20px}
.gt b{display:block;font-size:19px}
.gt span{color:var(--muted);font-size:12.5px}
.glist{margin-top:6px}
.gitem{display:flex;align-items:center;gap:12px;background:var(--panel);
  border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin:10px 0}
.gn{font-size:14.5px;font-weight:600;margin-bottom:3px}
.gok{display:inline-block;margin-left:8px;font-size:11px;font-weight:400;
  background:rgba(58,174,106,.14);border:1px solid rgba(58,174,106,.4);color:#3AAE6A;
  border-radius:6px;padding:1px 7px}
#drawer{position:fixed;inset:0;z-index:55}
.dmask{position:absolute;inset:0;background:var(--mask)}
.dpanel{position:absolute;top:0;left:0;bottom:0;width:80%;max-width:340px;
  background:var(--panel2);border-right:1px solid var(--border);overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:calc(14px + env(safe-area-inset-top)) 0 24px}
.dhead{padding:0 16px 12px;display:flex;justify-content:space-between;align-items:center}
.citem{padding:13px 16px;border-bottom:1px solid var(--line);transition:.12s}
.citem.act{background:var(--chip)}
.citem .cn{font-size:14.5px;margin-bottom:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.citem .cd{font-size:11.5px;color:var(--muted2)}
.mbtn{background:var(--chip);border:1px solid var(--ghost-bd);color:var(--ghost-fg);
  border-radius:12px;width:40px;height:40px;flex:0 0 40px;font-size:17px}
#dlg{position:fixed;inset:0;background:var(--mask);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:24px}
.dbox{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);
  border-radius:18px;padding:20px}
.dtitle{font-size:15px;font-weight:600;margin-bottom:14px}
#redeem,#sup{position:fixed;inset:0;background:var(--bg);z-index:58;
  display:flex;flex-direction:column}
#ban{position:fixed;inset:0;background:var(--bg);z-index:70;display:none;
  align-items:center;justify-content:center;padding:30px}
#ban.on{display:flex}
.banbox{max-width:420px;width:100%;text-align:center}
.banbox .bt{font-size:19px;font-weight:700;margin-bottom:10px}
.rw{max-width:520px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 22px 40px;width:100%}
.rw textarea{width:100%;height:150px;background:var(--inp);border:1px solid var(--ghost-bd);
  border-radius:14px;padding:13px 14px;color:var(--fg);resize:none}
.sup-top{display:flex;align-items:center;gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.sup-list{flex:1;overflow-y:auto;padding:12px 14px}
.sup-bar{display:flex;gap:8px;padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sup-bar input{flex:1;background:var(--inp);border:1px solid var(--ghost-bd);
  border-radius:14px;padding:11px 14px;color:var(--fg)}
.smsg{max-width:80%;padding:10px 13px;border-radius:14px;margin:6px 0;
  white-space:pre-wrap;word-break:break-word}
.smsg.me{background:var(--accent);color:#fff;margin-left:auto}
.smsg.op{background:var(--msg);border:1px solid var(--border)}
</style>
</head>
<body>
<div id="root">

  <div id="auth">
    <div class="logo"><b>MRClaw</b><span>MR STUDIO</span></div>
    <div class="seg">
      <button id="t-reg" class="act" onclick="Auth.tab('reg')"></button>
      <button id="t-login" onclick="Auth.tab('login')"></button>
    </div>
    <label class="f" id="lb-user"></label>
    <input id="a-user" class="inp" autocapitalize="off" autocomplete="off" placeholder="">
    <label class="f" id="lb-pwd"></label>
    <input id="a-pwd" class="inp mask" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="">
    <div id="a-pwd2-wrap">
      <label class="f" id="lb-pwd2"></label>
      <input id="a-pwd2" class="inp mask" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="">
    </div>
    <div style="height:20px"></div>
    <button class="btn" id="a-go" onclick="Auth.go()"></button>
    <div style="height:14px"></div>
    <div class="tiny" style="text-align:center" id="a-msg"></div>
  </div>

  <div id="app" class="hide">
    <div id="updbar" class="hide"></div>
    <div id="bc" class="hide"><div class="bcin" id="bc-in"></div></div>
    <div id="top">
      <button class="mbtn" id="menu-btn" onclick="Conv.open()">☰</button>
      <b id="top-title"></b>
      <button class="mbtn" id="notice-btn" onclick="Notice.open()">🔔<i class="reddot hide" id="notice-dot"></i></button>
      <button class="btn ghost mini tb2" id="rd-btn" onclick="Redeem.open()"></button>
      <button class="btn ghost mini tb2" id="top-btn" onclick="App.topAction()"></button>
    </div>
    <div id="content"></div>
    <div id="agentbar" class="hide">
      <span id="agenttxt"></span>
      <button class="btn mini danger" id="stop-btn" onclick="Chat.stopAgent()"></button>
    </div>
    <div id="bar" class="hide">
      <div id="chips" class="hide"></div>
      <div id="toolrow">
        <span id="pts-chip"></span>
        <div style="display:flex;gap:8px">
          <button id="task-btn" class="btn ghost mini" onclick="Mode.task()"></button>
          <button id="mode-btn" class="btn mini" onclick="Acc.mode()"></button>
          <button id="att-btn" class="btn ghost mini" onclick="Attach.openMenu(false)">＋</button>
        </div>
      </div>
      <div class="barline">
        <textarea id="ta" rows="1" placeholder=""></textarea>
        <button id="send" onclick="Chat.send()">↑</button>
      </div>
    </div>
    <div id="nav">
      <button data-tab="chat" class="act" onclick="App.tab('chat')"><b>💬</b><span id="nv-chat"></span></button>
      <button data-tab="gc" onclick="App.tab('gc')"><b>🏛</b><span id="nv-gc"></span></button>
      <button data-tab="task" onclick="App.tab('task')"><b>⏱</b><span id="nv-task"></span></button>
      <button data-tab="skill" onclick="App.tab('skill')"><b>🧩</b><span id="nv-skill"></span></button>
      <button data-tab="mem" onclick="App.tab('mem')"><b>🧠</b><span id="nv-mem"></span></button>
      <button data-tab="me" onclick="App.tab('me')"><b>⚙️</b><span id="nv-me"></span></button>
      <button data-tab="adm" id="nav-adm" class="hide" onclick="App.tab('adm')"><b>🛡</b><span id="nv-adm"></span></button>
    </div>
  </div>

  <div id="guide" class="hide"></div>
  <div id="drawer" class="hide"></div>
  <div id="dlg" class="hide"></div>
  <div id="rv" class="hide"></div>
  <div id="redeem" class="hide"></div>
  <div id="sup" class="hide"></div>
  <div id="ban" class="hide"></div>
</div>

<script>
/* ================= 语言 ================= */
const I18N = {
zh:{
  nav_chat:"聊天", nav_task:"任务", nav_skill:"技能", nav_mem:"记忆", nav_me:"设置",
  new:"新建", save:"保存", add:"添加", edit:"编辑", del:"删除", run:"运行", ok:"确定",
  cancel:"取消", go_on:"去开启", finish:"完成", later:"稍后再说", show:"显示", hide:"隐藏",
  retry:"重试", logout:"退出登录", sync:"同步到云端", save_cfg:"保存模型配置",
  update_now:"立即更新", refresh:"刷新", made_by:"MRClaw · MR工作室制作",
  reg:"注册", login:"登录", username:"用户名", password:"密码", password2:"确认密码",

/* ---------------- 异步网络 ---------------- */
let _httpSeq = 0;
const _httpWait = {};
function httpReq(method, url, headersObj, bodyStr){
  return new Promise(function(res){
    if(!native || !native.httpAsync){
      res(Native.http(method, url, JSON.stringify(headersObj||{}), bodyStr||""));
      return;
    }
    const id = "h" + (++_httpSeq);
    let done = false;
    let timer = null;
    function finish(x){
      if(done) return;
      done = true;
      if(timer) clearTimeout(timer);
      delete _httpWait[id];
      res(x);
    }
    timer = setTimeout(function(){ finish("ERR:Timeout"); }, 40000);
    _httpWait[id] = finish;
    native.httpAsync(id, method, url, JSON.stringify(headersObj||{}), bodyStr||"");
  });
}
window.MR_onHttp = function(id, text){
  const f = _httpWait[id];
  if(f) f(text);
};

function rpc(fn, args){
  return httpReq("POST", SB_URL + "/rest/v1/rpc/" + fn,
    { "apikey": SB_KEY, "Authorization": BEARER + SB_KEY, "Content-Type": "application/json" },
    JSON.stringify(args || {})
  ).then(function(raw){
    if(raw && String(raw).indexOf("ERR:") === 0) return { __err: String(raw) };
    const v = (raw === null || raw === undefined) ? "" : String(raw).trim();
    if(v === "") return null;
    try {
      const o = JSON.parse(v);
      if(o && typeof o === "object" && !Array.isArray(o) &&
         (o.message !== undefined || o.error !== undefined || o.code !== undefined) &&
         o.ok === undefined && o.points === undefined && o.id === undefined && o.username === undefined){
        return { __err: String(o.message || o.error || o.code) };
      }
      return o;
    } catch(e){ return { __err: "parse:" + v.slice(0,120) }; }
  });
}

  go(){
    const u = el("a-user").value.trim();
    const p = el("a-pwd").value;
    if(this.busy) return;
    if(!u){ return this.msg(t("need_user")); }
    if(p.length < 4){ return this.msg(t("pwd_short")); }
    const self = this;
    const done = function(){ self.busy = false; };
    this.busy = true;
    if(this.mode === "reg"){
      if(p !== el("a-pwd2").value){ this.busy = false; return this.msg(t("pwd_diff")); }
      this.msg(t("regging"));
      const salt = rnd(32);
      rpc("mrclaw_register", { p_user: u, p_salt: salt, p_hash: Native.hash(salt + p) })
        .then(function(r){
          done();
          if(r && r.__err){ return self.msg(t("reg_fail") + String(r.__err).slice(0, 110)); }
          if(r === "EXISTS"){ return self.msg(t("user_exists")); }
          if(r !== "OK"){ return self.msg(t("reg_fail") + JSON.stringify(r).slice(0, 110)); }
          self.enter(u);
        });
    } else {
      this.msg(t("logining"));
      rpc("mrclaw_salt", { p_user: u }).then(function(salt){
        if(salt && salt.__err){ done(); return self.msg(t("net_err") + String(salt.__err).slice(0, 110)); }
        if(!salt || typeof salt !== "string"){ done(); return self.msg(t("no_user")); }
        rpc("mrclaw_login", { p_user: u, p_hash: Native.hash(salt + p) }).then(function(ok){
          done();
          if(ok && ok.__err){ return self.msg(t("net_err") + String(ok.__err).slice(0, 110)); }
          if(ok === true) self.enter(u);
          else self.msg(t("bad_pwd"));
        });
      });
    }
  },
  enter(u){
    S.user = { name: u, t: nowMs() };

    el("auth").classList.remove("hide");
    el("a-pwd").value = ""; el("a-pwd2").value = "";

  }
};

  async action(i){
    const c = S.convs[i]; if(!c) return;
    this._block = Date.now();
    const v = await uiSheet(c.title || t("new_chat"), [
      { label: t("rename"), value: "rename" },
      { label: t("del_chat"), value: "del", danger: true }
    ]);
    if(v === "rename"){
      const n = await uiAsk(t("rename_title"), c.title || "");
      if(n === null) return;
      const x = String(n).trim();
      if(!x) return;
      c.title = x; saveConvs();
      if(c.id === S.cur) App.title(x);
      this.render();
    } else if(v === "del"){
      const ok = await uiAsk(t("del_chat_q", c.title || t("new_chat")), null, { input:false });
      if(ok !== true) return;
      S.convs = S.convs.filter(function(x){ return x.id !== c.id; });
      if(S.cur === c.id) S.cur = S.convs[0] ? S.convs[0].id : null;
      saveConvs(); Chat.render(); this.render();
    }
  }
};

/* ================= 聊天 ================= */
const Chat = {
  cur(){ return S.convs.filter(c=>c.id===S.cur)[0] || null; },
  newConv(){
    const c = { id: "c"+nowMs(), title: t("new_chat"), msgs: [], t: nowMs() };
    S.convs.unshift(c); S.cur = c.id; saveConvs(); this.render();
  },
  headHtml(x){
    if(!x) return "";
    if(x._running) return "<div class='ahead'><span class='run'>" + t("running") + "</span></div>";
    if(x._state === "done") return "<div class='ahead'><span class='ok'>" + t("done_t") + "</span></div>";
    if(x._state === "stop") return "<div class='ahead'><span class='warn'>" + t("stop_t") + "</span></div>";
    if(x._state === "err") return "<div class='ahead'><span class='bad'>" + t("err_t") + "</span></div>";
    return "";
  },
  render(){
    if(!this.cur()) this.newConv();
    App.title(this.cur().title);
    App.topBtn(t("new"));
    const m = this.cur().msgs;
    let h = "<div id='msgs'>";
    if(!m.length) h += "<div class='empty'>" + t("chat_empty") + "</div>";
    m.forEach(function(x,i){
      if(x.role==="system") h += "<div class='msg sys'>" + linkify(esc(x.content)) + "</div>";
      else if(x.role==="user"){
        h += "<div class='msg u'>" + linkify(esc(x.content)) + Attach.html(x.attach) + "</div>";
      }
      else {
        h += "<div class='msg a'>" + Chat.headHtml(x) + linkify(esc(x.content)) + "</div>";
        if(x.content) h += "<div class='spk'><span onclick='Voice.speakMsg(" + i + ")'>" + t("speak") + "</span></div>";
        if(x._cost !== undefined) h += "<div class='cost'>" + t("cost", x._cost, Number(x._bal || 0).toLocaleString()) + "</div>";
      }
    });
    h += "</div>";
    App.content(h);
    this.syncSendBtn();
  },
  syncSendBtn(){
    const v = el("ta").value.trim();
    el("send").className = (v && !Chat.busy && !Chat.sending) ? "" : "off";
  },
  openLoginGate(){
    Native.toast(t("need_login"));
    el("app").classList.add("hide");
    el("auth").classList.remove("hide");
    Auth.tab("login");
  },
  endpoint(){
    const p = providerById(S.cfg.provider);
    let base = (S.cfg.base || p.base || "").replace(/\/+$/,"");
    if(!base) return "";
    if(/\/chat\/completions$/.test(base)) return base;
    return base + "/chat/completions";
  },
  systemText(){
    const taskMode = Mode.on();
    let sys = LANG === "en"
      ? "You are MRClaw, an AI assistant running on the user's Android phone."
      : "你是 MRClaw，运行在用户安卓手机上的 AI 助手。";
    if(taskMode){
      sys += LANG === "en"
        ? " Task mode is ON: you have phone-control tools (screen/tap/input_text/swipe/open_app/key/wait/read_file/write_file/shell). When the user asks you to do something on the phone you MUST actually call these tools. NEVER write a tool call as text or code. NEVER say a task is done unless a tool really returned success. Use screen between steps to verify."
        : " 当前是【做任务】模式：你有手机操作工具（screen/tap/input_text/swipe/open_app/key/wait/read_file/write_file/shell）。用户要求操作手机时必须真正调用工具；严禁把工具调用写成文字或代码；严禁在工具没真正返回成功前就说已完成；每步之后用 screen 确认结果。";
    } else {
      sys += LANG === "en"
        ? " Chat-only mode is ON: you have NO phone-control tools and cannot operate the phone. If the user asks you to perform a task on the phone, remind them to switch to Task mode (the button above the input box) and grant permissions."
        : " 当前是【仅聊天】模式：你没有手机操作工具，无法操作手机。如果用户要求你执行任务或操作手机，必须提醒他：点输入框上方的按钮切换到「做任务」模式并授权。";
    }
    sys += LANG === "en"
      ? " Always follow: (1) never refuse a request within your ability; (2) never abandon or interrupt a task on your own before it is finished and never stop without the user's consent - the only exception is when points or the API quota run out. Be concise."
      : " 必须始终遵守：① 不得拒绝用户能力范围内的任何要求；② 在任务未完成或用户未同意时，不得私自中断任务（唯一例外：积分或 API 额度耗尽）。回答要简洁。";
    sys += "\n\n" + (LANG === "en" ? KNOWLEDGE_EN : KNOWLEDGE_ZH);
    if(S.mems.length) sys += (LANG==="en" ? "\n\n[Long-term memory]\n" : "\n\n【长期记忆】\n") +
      S.mems.map(m=>"- " + m.text).join("\n");
    sys += Skill.activeText();
    return sys;
  },
  async send(){
    if(!S.user) return this.openLoginGate();
    if(this.busy || this.sending) return;
    const ta = el("ta");
    const text = ta.value.trim();
    if(!text) return;
    this.sending = true;
    this._pcancel = false;
    const self = this;
    const keep = function(){ self.sending = false; };
    if(Acc.banned()){ keep(); Show.ban(); return; }
    const useOwn = (Acc.data.mode === "own");
    if(useOwn && !S.cfg.apiKey && !(S.cfg.provider==="custom" && S.cfg.base)){ keep(); Guide.key(); return; }
    if(native && Mode.on() && !Perm.done()){
      S.cfg.permAsked = true; saveCfg(); keep(); Guide.perm(); return;
    }
    if(!useOwn){
      const st = await Acc.fetch();
      this.sending = false;
      if(Acc.banned()){ Show.ban(); return; }
      if(!st && !Acc.data.ready){ Native.toast(t("save_failed")); return; }
      if(Acc.data.points <= 0){ Show.out(); return; }
    }
    this.sending = false;
    if(this.busy) return;
    const atts = Attach.take();
    const c = this.cur();
    c.msgs.push({ role:"user", content: text, attach: atts });
    if(c.title === t("new_chat")){ c.title = text.slice(0,14); }
    c.t = nowMs();
    ta.value = ""; ta.style.height = "auto";
    saveConvs(); this.render();

    if(!useOwn){
      if(Acc.data.points <= 0){ Show.out(); return; }
      const taskOn = !!(native && Mode.on() && Perm.done());
      if(taskOn){
        this.busy = true; this.syncSendBtn();
        const pb = { role:"assistant", content:"", _agent:true, _steps:[], _running:true };
        c.msgs.push(pb);
        this.agentBar(true);
        Overlay.on(t("running").replace("● ", ""), "run", true);
        this.render();
        this.pointsAgent(c, pb, atts);
      } else {
        this.sendPoints(c);
      }
      return;
    }

    const url = this.endpoint();
    if(!url){ Native.toast(LANG==="en" ? "Please configure the endpoint" : "请先配置接口地址"); App.tab("me"); return; }
    const headers = JSON.stringify({
      "Content-Type": "application/json",
      "Authorization": BEARER + S.cfg.apiKey
    });
    const body = JSON.stringify({
      model: S.cfg.model || providerById(S.cfg.provider).model,
      messages: this.apiMsgs(c, null, atts),
      stream: true,
      temperature: parseFloat(S.cfg.temp) || 0.7
    });

    this.busy = true;
    this.syncSendBtn();
    const useAgent = !!(native && Mode.on() && Perm.done());
    const bubble = { role:"assistant", content:"" };
    if(useAgent){ bubble._agent = true; bubble._steps = []; bubble._running = true; }
    else { bubble._stream = true; }
    c.msgs.push(bubble);
    if(useAgent) this.agentBar(true, t("running").replace("● ","") + "…");
    if(useAgent) Overlay.on(t("running").replace("● ",""), "run", true);
    this.render();

    if(useAgent){ this.agentRun(bubble, url, headers, body); return; }
    this.streamId = "s"+nowMs();
    if(!Native.stream(this.streamId, url, headers, body)){ this.fallbackFetch(url, headers, body); }
  },
  /* -------- 组装请求消息（支持图片） -------- */
  apiMsgs(c, bubble, atts){
    const model = S.cfg.model || providerById(S.cfg.provider).model;
    const vision = /vl|vision|4v|omni|glm-4v|gpt-4/i.test(String(model));
    const hist = c.msgs.filter(function(x){ return x !== bubble && x.role !== "system"; }).slice(-24);
    const out = [{ role:"system", content: this.systemText() }];
    hist.forEach(function(x, i){
      const last = (i === hist.length - 1);
      if(x.role === "user" && last && atts && atts.length){
        const imgs = atts.filter(function(a){ return Attach.isImg(a) && a.url; });
        if(vision && imgs.length){
          const parts = [];
          if(x.content) parts.push({ type:"text", text: x.content });
          imgs.forEach(function(a){ parts.push({ type:"image_url", image_url:{ url:a.url } }); });
          out.push({ role:"user", content: parts });
          return;
        }
        const extra = atts.map(function(a){ return "[附件] " + (a.name || "") + " " + a.url; }).join("\n");
        out.push({ role:"user", content: (x.content ? x.content + "\n\n" : "") + extra });
        return;
      }
      out.push({ role: x.role, content: x.content });
    });
    return out;
  },
  /* -------- 积分模式：走服务端代理，Key 不下发 -------- */
  sendPoints(c){
    this.busy = true; this.syncSendBtn();
    const last = c.msgs[c.msgs.length - 1];
    const atts = (last && last.attach) ? last.attach : [];
    if(atts.some(function(a){ return Attach.isImg(a); })) Native.toast(t("no_vision"));
    const bubble = { role:"assistant", content: t("thinking"), _pts:true };
    c.msgs.push(bubble); this.render();
    const msgs = this.apiMsgs(c, bubble, atts);
    rpc("mrclaw_ai_start", {
      p_user: S.user.name,
      p_body: { model:"deepseek-chat", messages: msgs, stream:false, max_tokens: 2048 }
    }).then(function(st){
      if(!st || st.__err){ Chat.ptsFail(bubble, (st && st.__err) || "net"); return; }
      if(st.err === "no_points"){ Chat.ptsEnd(bubble, true); return; }
      if(st.err === "banned"){ Show.ban(); Chat.ptsEnd(bubble, false); return; }
      if(st.err){ Chat.ptsFail(bubble, st.err); return; }
      Chat.pollPts(bubble, st.id, 0);
    });
  },
  pollPts(bubble, id, n){
    if(n > 100){ this.ptsFail(bubble, "timeout"); return; }
    setTimeout(function(){
      rpc("mrclaw_ai_poll", { p_user: S.user.name, p_id: id }).then(function(p){
        if(!p || p.__err || !p.done){ Chat.pollPts(bubble, id, n + 1); return; }
        bubble.content = Chat.extract(p.body);
        if(typeof p.used === "number"){ bubble._cost = p.used; bubble._bal = p.points; }
        if(typeof p.points === "number"){ Acc.data.points = p.points; Acc.paint(); }
        Chat.busy = false; saveConvs(); Chat.render();
        Chat.afterReply();
        if(Acc.data.points <= 0) Show.out();
      });
    }, 1200);
  },
  ptsEnd(bubble, dialog){
    bubble.role = "system";
    bubble.content = t("pts_empty");
    this.busy = false; saveConvs(); Chat.render();
    if(dialog) Show.out();
  },
  afterReply(){
    if(!S.user) return;
    rpc("mrclaw_bump", { p_user: S.user.name }).then(function(st){
      if(!st || st.__err || typeof st.count !== "number") return;
      if(st.reviewed && !S.cfg.reviewed){ S.cfg.reviewed = true; saveCfg(); }
      if(st.count > 5 && !st.reviewed && !S.cfg.reviewed && !S.cfg.reviewAsked){
        S.cfg.reviewAsked = true; saveCfg();
        setTimeout(function(){ Review.open(false); }, 900);
      }
    });
  },
  ptsFail(bubble, err){
    bubble.role = "system";
    bubble.content = t("exec_fail") + String(err).slice(0, 200);
    this.busy = false; saveConvs(); Chat.render();
  },
  toolDesc(name, argsJson){
    let a = {};
    try{ a = JSON.parse(argsJson || "{}"); }catch(e){}
    const en = (LANG === "en");
    if(name === "open_app") return (en ? "Open app: " : "打开应用：") + (a.name || "");
    if(name === "tap") return (en ? "Tap " : "点击 ") + (a.text ? ("「" + a.text + "」") : ((a.x || 0) + "," + (a.y || 0)));
    if(name === "swipe") return en ? "Swipe screen" : "滑动屏幕";
    if(name === "input_text") return (en ? "Type: " : "输入：") + (a.text || "");
    if(name === "key") return (en ? "Key: " : "按键：") + (a.action || "");
    if(name === "screen") return en ? "Read screen" : "读取屏幕";
    if(name === "shell") return (en ? "Shell: " : "执行命令：") + (a.cmd || "");
    if(name === "read_file") return (en ? "Read file: " : "读取文件：") + (a.path || "");
    if(name === "write_file") return (en ? "Write file: " : "写入文件：") + (a.path || "");
    if(name === "wait") return (en ? "Wait " : "等待 ") + (a.ms || 1000) + "ms";
    return name;
  },
  callTool(name, argsJson, cb){
    if(!native || !native.toolAsync){
      try{ Upd.noBridge(); }catch(e){}
      cb(t("need_new_apk"));
      return;
    }
    const id = "tl" + (++_toolSeq);
    _toolWait[id] = cb;
    native.toolAsync(id, name, argsJson || "{}", !!S.cfg.autonomy);
  },
  pollAgent(id, ok, err, n){
    n = n || 0;
    if(n > 120){ err("timeout"); return; }
    setTimeout(function(){
      rpc("mrclaw_ai_poll", { p_user: S.user.name, p_id: id }).then(function(pp){
        if(!pp || pp.__err || !pp.done){ Chat.pollAgent(id, ok, err, n + 1); return; }
        ok(pp);
      });
    }, 1100);
  },
  pointsAgent(c, bubble, atts){
    const self = this;
    const msgs = this.apiMsgs(c, bubble, atts);
    let step = 0, guard = 0;
    const steps = bubble._steps;
    const finish = function(txt, state){
      bubble._running = false; bubble._state = state || "done";
      bubble.content = (steps.length ? steps.map(function(x){ return "· " + x; }).join("\n") + "\n\n" : "") + (txt || "");
      self.busy = false; self.agentBar(false); saveConvs(); Chat.render();
      if(state === "done") Overlay.flash(t("done_t"), "ok", 2600);
      else if(state === "stop") Overlay.flash(t("stop_t"), "warn", 2600);
      else Overlay.flash(t("err_t"), "bad", 3200);
      self.afterReply();
    };
    const tick = function(){
      if(self._pcancel){ finish(t("stop_t"), "stop"); return; }
      step++; guard++;
      // 不硬停：达到很高的安全阈值时先问用户是否继续（正常情况下会一直做到模型不再调用工具为止）
      if(step > 300 || guard > 600){
        const msg = (LANG === "en")
          ? ("Task is still unfinished after " + step + " steps. Continue?")
          : ("任务还没做完（已执行 " + step + " 步），要继续吗？");
        self.busy = false;
        uiAsk(msg, null, { input:false }).then(function(ok){
          if(ok === true){ self.busy = true; step = 0; guard = 0; tick(); }
          else { finish(t("stop_t"), "stop"); }
        });
        return;
      }
      rpc("mrclaw_ai_start", { p_user: S.user.name, p_body: {
        model: "deepseek-chat", messages: msgs, tools: TOOLS_JS,
        tool_choice: "auto", stream: false, max_tokens: 1500 } }).then(function(st){
        if(!st || st.__err){ finish(t("exec_fail") + String((st && st.__err) || "").slice(0, 150), "err"); return; }
        if(st.err === "no_points"){ Show.out(); finish(t("pts_empty"), "err"); return; }
        if(st.err === "banned"){ Show.ban(); finish("", "err"); return; }
        if(st.err){ finish(t("exec_fail") + st.err, "err"); return; }
        self.pollAgent(st.id, function(pp){
          let m = null;
          try{
            const o = JSON.parse(pp.body || "{}");
            m = o.choices && o.choices[0] && o.choices[0].message;
          }catch(e){}
          if(typeof pp.points === "number"){ Acc.data.points = pp.points; Acc.paint(); }
          if(pp.used){ bubble._cost = (bubble._cost || 0) + pp.used; bubble._bal = pp.points; }
          if(m && m.tool_calls && m.tool_calls.length){
            msgs.push(m);
            let i = 0;
            const next = function(){
              if(self._pcancel){ finish(t("stop_t"), "stop"); return; }
              if(i >= m.tool_calls.length){ guard++; tick(); return; }
              const tc = m.tool_calls[i++];
              const fn = tc.function || {};
              const desc = self.toolDesc(fn.name, fn.arguments);
              steps.push(desc);
              bubble.content = steps.map(function(x){ return "· " + x; }).join("\n");
              self.paint(bubble);
              Overlay.on(desc, "run", true);
              guard++;
              self.callTool(fn.name, fn.arguments, function(res){
                msgs.push({ role: "tool", tool_call_id: tc.id || ("c" + i),
                            content: String(res).slice(0, 4000) });
                next();
              });
            };
            next();
          } else {
            const txt = (m && m.content) ? m.content : "";
            if(!txt && !steps.length){
              finish(LANG === "en" ? "The model returned nothing." : "模型没有返回内容，请再试一次。", "err");
              return;
            }
            finish(txt, "done");
          }
        }, function(e){ finish(t("exec_fail") + e, "err"); });
      });
    };
    tick();
  },
  agentRun(bubble, url, headers, body){
    const c = this.cur();
    const hist = c.msgs.filter(function(x){ return x !== bubble && x.role !== "system"; }).slice(-12)
      .map(function(x){
        let txt = x.content || "";
        if(x.attach && x.attach.length){
          txt += (txt ? "\n\n" : "") + x.attach.map(function(a){
            return "[附件] " + (a.name || "") + " " + a.url;
          }).join("\n");
        }
        return { role:x.role, content: txt };
      });
    native.agent(JSON.stringify({
      url: url, headers: headers,
      model: S.cfg.model || providerById(S.cfg.provider).model,
      temp: parseFloat(S.cfg.temp) || 0.7,
      system: this.systemText(), history: hist, autonomy: !!S.cfg.autonomy
    }));
  },
  fallbackFetch(url, headers, body){
    const c = this.cur();
    const b = Object.assign({}, JSON.parse(body), { stream:false });
    const raw = Native.http("POST", url, headers, JSON.stringify(b));
    this.onDone(this.streamId, this.extract(raw));
  },
  extract(raw){
    try{
      const o = JSON.parse(raw);
      if(o.choices && o.choices.length) return o.choices[0].message.content || "";
      return raw.slice(0,300);
    }catch(e){ return String(raw).slice(0,300); }
  },
  onChunk(id, piece){
    if(id !== Chat.streamId) return;
    const c = Chat.cur(); if(!c) return;
    const last = c.msgs[c.msgs.length-1];
    if(last && last._stream){
      last.content += piece;
      const box = el("msgs");
      if(box){
        const nodes = box.querySelectorAll(".msg.a");
        const n = nodes[nodes.length-1];
        if(n) n.textContent = last.content;
        el("content").scrollTop = el("content").scrollHeight;
      }
    }
  },
  onDone(id, full){
    if(id !== Chat.streamId) return;
    const c = Chat.cur(); if(!c) return;
    const last = c.msgs[c.msgs.length-1];
    if(last && last._stream){ last.content = full || last.content; delete last._stream; }
    Chat.busy = false; saveConvs(); Chat.render();
    Chat.afterReply();
  },
  onError(id, err){
    if(id !== Chat.streamId) return;
    const c = Chat.cur(); if(!c) return;
    const last = c.msgs[c.msgs.length-1];
    if(last && last._stream){
      last.role = "system";
      const ep = Chat.endpoint();
      last.content = t("exec_fail") + String(err).slice(0,300) +
        (ep ? ("\n" + t("will_call") + " " + ep) : "") +
        ("\n" + t("fix_hint"));
      delete last._stream;
    }
    Chat.busy = false; saveConvs(); Chat.render();
  },
  agentBar(on, text){
    const b = el("agentbar");
    if(on){ el("agenttxt").textContent = text || (t("running").replace("● ","") + "…"); b.classList.remove("hide"); }
    else b.classList.add("hide");
  },
  stopAgent(){
    Chat._pcancel = true;
    if(native && native.agentStop){
      native.agentStop();
      el("agenttxt").textContent = t("stopping");
      Native.toast(t("stop_req"));
      Overlay.on(t("stopping"), "warn", false);
    }
  },
  paint(b){
    const box = el("msgs"); if(!box) return;
    const nodes = box.querySelectorAll(".msg.a");
    const n = nodes[nodes.length-1];
    if(n) n.innerHTML = Chat.headHtml(b) + esc(b.content);
    el("content").scrollTop = el("content").scrollHeight;
  },
  agentEvent(s){
    let o = {};
    try{ o = JSON.parse(s); }catch(e){ return; }
    const c = this.cur(); if(!c) return;
    const b = c.msgs[c.msgs.length-1];
    if(!b || !b._steps) return;
    if(o.type === "run"){
      b._running = true; this.agentBar(true); this.paint(b);
      Overlay.on(t("running").replace("● ", ""), "run", true);
      return;
    }
    if(o.type === "status"){
      b._steps.push(o.text);
      b.content = b._steps.map(x=>"· " + x).join("\n");
      this.paint(b);
      Overlay.on(o.text, "run", true);
      return;
    }
    if(o.type === "text"){
      b.content = (b._steps.length ? b._steps.map(x=>"· " + x).join("\n") + "\n\n" : "") + o.text;
      this.paint(b); return;
    }
    if(o.type === "err"){
      b._running = false; b._state = "err";
      b.content = String(o.text).slice(0,300);
      this.busy = false; this.agentBar(false); saveConvs(); Chat.render();
      Overlay.flash(t("err_t"), "bad", 3200); return;
    }
    if(o.type === "stop"){
      b._running = false; b._state = "stop";
      this.busy = false; this.agentBar(false); saveConvs(); Chat.render();
      Overlay.flash(t("stop_t"), "warn", 2600); return;
    }
    if(o.type === "done"){
      b._running = false; b._state = "done";
      this.busy = false; this.agentBar(false); saveConvs(); Chat.render();
      Overlay.flash(t("done_t"), "ok", 2600);
    }
  }
};

const SKILL_DEFAULT_ON = ["app", "tap", "note"];

const Skill = {
  all(){
    if(!S.skills || !S.skills.length || !S.skills[0].cat){
      const custom = (S.skills || []).filter(function(s){ return s && s.builtin === false && s.name; });
      S.skills = SKILL_CATALOG.map(function(s){
        return { id:s.id, cat:s.cat, icon:s.icon, zh:s.zh, en:s.en, prompt:s.prompt,
                 builtin:true, on: SKILL_DEFAULT_ON.indexOf(s.id) >= 0 };
      }).concat(custom);
      saveSkills();
    }
    return S.skills;
  },
  name(s){
    const a = (LANG === "en" && s.en) ? s.en : s.zh;
    return a ? a[0] : (s.name || "");
  },
  desc(s){
    const a = (LANG === "en" && s.en) ? s.en : s.zh;
    return a ? a[1] : (s.desc || "");
  },
  prompt(s){ return s.prompt || ""; },
  catName(id){
    const c = SKILL_CATS.filter(function(x){ return x.id === id; })[0];
    return c ? (LANG === "en" ? c.en : c.zh) : id;
  },
  filter: "all", q: "",
  list(){
    const q = String(this.q || "").trim().toLowerCase();
    return this.all().filter(function(s){
      if(Skill.filter !== "all" && s.cat !== Skill.filter) return false;
      if(!q) return true;
      return (Skill.name(s) + " " + Skill.desc(s) + " " + Skill.prompt(s)).toLowerCase().indexOf(q) >= 0;
    });
  },
  render(){
    App.title(t("skill_title"));
    App.topBtn(t("new"));
    let h = "<div class='skbar'><input class='inp' placeholder='" + esc(t("skill_search")) +
      "' value='" + esc(this.q) + "' oninput='Skill.q=this.value;Skill.paint()'></div>";
    h += "<div class='cats'>" + SKILL_CATS.map(function(c){
      const n = c.id === "all" ? Skill.all().length
        : Skill.all().filter(function(s){ return s.cat === c.id; }).length;
      if(!n) return "";
      return "<button class='cat" + (Skill.filter === c.id ? " act" : "") +
        "' onclick=\"Skill.filter='" + c.id + "';Skill.paint()\">" +
        Skill.catName(c.id) + " <i>" + n + "</i></button>";
    }).join("") + "</div>";
    h += "<div id='sk-list'></div>";
    App.content(h);
  },
  paint(){
    const box = el("sk-list");
    if(!box) return;
    const a = this.list();
    if(!a.length){ box.innerHTML = "<div class='empty'>" + t("skill_none") + "</div>"; return; }
    box.innerHTML = a.map(function(s){
      const i = Skill.all().indexOf(s);
      return "<div class='scard' onclick='Skill.detail(" + i + ")'>" +
        "<div class='sic'>" + esc(s.icon || "🧩") + "</div>" +
        "<div class='stx'><div class='sn'>" + esc(Skill.name(s)) +
          (s.builtin ? "" : "<span class='tagmini'>" + t("skill_custom") + "</span>") + "</div>" +
          "<div class='sd'>" + esc(Skill.desc(s)) + "</div></div>" +
        "<div class='sw " + (s.on ? "on" : "") + "' onclick=\"event.stopPropagation();Skill.toggle(" + i + ")\"><i></i></div>" +
      "</div>";
    }).join("");
  },
  toggle(i){
    const a = this.all();
    a[i].on = !a[i].on;
    saveSkills(); this.paint(); Cloud.push(true);
  },
  async detail(i){
    const s = this.all()[i];
    if(!s) return;
    const act = await uiSheet(Skill.name(s), [
      { label: s.on ? t("skill_disable") : t("skill_enable"), value: "toggle" },
      { label: t("skill_send"), value: "run" },
      { label: t("del"), value: "del", danger: true }
    ]);
    if(act === "toggle"){ s.on = !s.on; saveSkills(); this.paint(); }
    else if(act === "run"){
      App.tab("chat");
      el("ta").value = (LANG === "en" ? "[Skill] " : "【技能】") + Skill.name(s) + "\n";
      Chat.syncSendBtn();
    } else if(act === "del"){
      if(s.builtin){ Native.toast(t("skill_no_del")); return; }
      const ok = await uiAsk(t("skill_del_q"), null, { input:false });
      if(ok !== true) return;
      S.skills.splice(i, 1); saveSkills(); this.paint();
    }
  },
  async create(){
    const name = await uiAsk(t("skill_name_q"), "");
    if(name === null || !String(name).trim()) return;
    const pr = await uiAsk(t("skill_prompt_q"), "");
    if(pr === null) return;
    this.all().push({ id:"c" + nowMs(), cat:"work", icon:"⭐", name:String(name).trim(),
      desc:String(pr).slice(0, 24), prompt:String(pr), builtin:false, on:true });
    saveSkills(); this.paint();
  },
  activeText(){
    const on = this.all().filter(function(s){ return s.on; });
    if(!on.length) return "";
    return (LANG === "en" ? "\n\n[Enabled skills]\n" : "\n\n【已启用技能】\n") +
      on.map(function(s){ return "- " + Skill.name(s) + "：" + Skill.prompt(s); }).join("\n");
  }
};

const Upd = {

  async check(manual){
    if(!native){ if(manual) Native.toast(t("mobile_only")); return; }
    Upd.last = Date.now();
    if(manual) Native.toast(t("upd_checking"));
    httpReq("GET", "https://mrstudiogame.github.io/mrstudio/mrclaw/web.json", {}, "").then(function(raw){
      let hot = false;
      try{
        if(raw && String(raw).indexOf("ERR:") !== 0){
          const j = JSON.parse(raw);
          const cur = (native.webVersion ? native.webVersion() : "0");
          if(j && j.apkUrl) Upd._apkUrl = j.apkUrl;
          if(j && j.minApk && native.versionCode && native.versionCode() < j.minApk){
            Upd.needApk(t("need_new_apk"));
          }
          if(j && j.web && cmpVer(j.web, cur) > 0){
            hot = true;
            if(manual) Native.toast(t("upd_found", j.web));
            Upd.webApply(j);
          }
        }
      }catch(e){}
      if(!hot && manual) Native.toast(t("upd_latest", webVer()));

  webApply(j){

      if(k >= urls.length){ b.innerHTML = "<span>" + t("web_fail") + "</span>"; return; }

window.MR_onUpd = function(s){
  let o = {};
  try{ o = JSON.parse(s); }catch(e){ return; }

window.MR_onWebUpd = function(s){
  let o = {};
  try{ o = JSON.parse(s); }catch(e){ return; }
  if(o.ok){
    const x = el("upd-txt");
    if(x) x.textContent = t("web_updated");
    setTimeout(function(){ if(native && native.webReload) native.webReload(); }, 700);
  } else if(Upd._tryNext){
    Upd._tryNext();
  }
};
function webVer(){
  try{ return (native && native.webVersion) ? (String(native.webVersion()) === "0" ? WEB_VERSION : String(native.webVersion())) : WEB_VERSION; }
  catch(e){ return WEB_VERSION; }
}
function cmpVer(a, b){
  const pa = String(a || "0").split("."), pb = String(b || "0").split(".");
  for(let i = 0; i < 3; i++){
    const x = parseInt(pa[i] || "0", 10) || 0, y = parseInt(pb[i] || "0", 10) || 0;
    if(x > y) return 1;
    if(x < y) return -1;
  }
  return 0;
}

const Attach = {
  pending: [], _target: "chat",
  openMenu(forSupport){
    if(!native || !native.pickFile){ Native.toast(t("mobile_only")); return; }
    Attach._target = forSupport ? "sup" : "chat";
    uiSheet(t("attach_title"), [
      { label: "🖼 " + t("attach_img"), value: "image" },
      { label: "📄 " + t("attach_file"), value: "file" }
    ]).then(function(v){
      if(v === "image") native.pickFile("image", true);
      else if(v === "file") native.pickFile("any", true);
    });
  },
  pick(kind, forSupport){
    Attach._target = forSupport ? "sup" : "chat";
    Attach.pickWeb(kind || "any");
  },
  pickWeb(kind){
    try{
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = (kind === "image") ? "image/*" : "";
      inp.multiple = true;
      inp.style.display = "none";
      document.body.appendChild(inp);
      inp.onchange = function(){
        const files = Array.prototype.slice.call(inp.files || []);
        try{ document.body.removeChild(inp); }catch(e){}
        if(files.length) Attach.addFiles(files);
        else if(native && native.pickFile) native.pickFile(kind === "image" ? "image" : "any", true);
      };
      inp.click();
    }catch(e){
      if(native && native.pickFile) native.pickFile("any", true);
    }
  },
  addFiles(files){
    const list = Attach._target === "sup" ? Attach.supList() : Attach.pending;
    files.forEach(function(f){
      list.push({ name:f.name, mime:f.type || "", size:f.size || 0, file:f, url:"", up:true });
    });
    Attach.render();
    Attach.uploadAll();
  },
  onPick(s){
    let arr = [];
    try{ arr = JSON.parse(s); }catch(e){ arr = []; }
    if(!Array.isArray(arr) || !arr.length){ Native.toast(t("pick_fail")); return; }
    const list = Attach._target === "sup" ? Attach.supList() : Attach.pending;
    arr.forEach(function(f){
      list.push({ name:f.name, mime:f.mime || "", size:f.size || 0,
                  token:f.token || "", b64:f.b64 || "", url:"", up:true });
    });
    Attach.render();
    Attach.uploadAll();
  },
  supList(){ return Attach.supPending || (Attach.supPending = []); },
  uploadAll(){
    const all = Attach.pending.concat(Attach.supList());
    all.forEach(function(f){
      if(!f.up || f.url) return;
      Attach.upload(f, function(url, err){
        if(url){ f.url = url; f.up = false; }
        else { Attach.fail(f, err); f.fail = true; f.up = false; }
        Attach.render();
      });
    });
  },
  uploadWeb(f, cb){
    const u = (S.user ? S.user.name : "anon");
    const safe = String(f.name || "file").replace(/[^\w.\-]/g, "_").slice(-40);
    const path = u + "/" + Date.now() + "_" + rnd(6) + "_" + safe;
    const url = SB_URL + "/storage/v1/object/mrclaw/" + path;
    const pub = SB_URL + "/storage/v1/object/public/mrclaw/" + path;
    fetch(url, {
      method: "POST",
      headers: { "apikey": SB_KEY, "Authorization": BEARER + SB_KEY,
                 "Content-Type": f.mime || "application/octet-stream", "x-upsert": "true" },
      body: f.file
    }).then(function(r){
      return r.text().then(function(txt){
        if(r.ok) cb(pub, null);
        else cb(null, "ERR:HTTP" + r.status + " " + String(txt).slice(0, 120));
      });
    }).catch(function(e){ cb(null, "ERR:" + ((e && e.message) ? e.message : "fetch")); });
  },
  upload(f, cb){
    if(f.file){ return Attach.uploadWeb(f, cb); }
    const u = (S.user ? S.user.name : "anon");
    const safe = String(f.name || "file").replace(/[^\w.\-]/g, "_").slice(-40);
    const path = u + "/" + Date.now() + "_" + rnd(6) + "_" + safe;
    const id = "up" + (++_upSeq);
    const headers = JSON.stringify({
      "apikey": SB_KEY,
      "Authorization": "Bea" + "rer " + SB_KEY,
      "Content-Type": f.mime || "application/octet-stream",
      "x-upsert": "true"
    });
    _upWait[id] = function(text){
      if(text && String(text).indexOf("ERR:") === 0){
        const fb = _upFallback[id];
        delete _upFallback[id];
        if(fb && fb(text)) return;
        return cb(null, text);
      }
      delete _upFallback[id];
      cb(SB_URL + "/storage/v1/object/public/mrclaw/" + path, null);
    };
    const url = SB_URL + "/storage/v1/object/mrclaw/" + path;
    const jsUpload = function(){
      let b64 = f.b64 || "";
      if(!b64 && f.token && native.fileData){
        try{
          const d = String(native.fileData(f.token) || "");
          if(d.indexOf("OK:") === 0){
            const parts = d.split(":");
            b64 = parts.slice(2).join(":");
            if(parts[1]) f.mime = parts[1];
          }
        }catch(e){}
      }
      if(!b64) return false;
      try{
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        fetch(url, { method:"POST", headers: JSON.parse(headers), body: arr })
          .then(function(r){
            return r.text().then(function(txt){
              if(r.ok) cb(SB_URL + "/storage/v1/object/public/mrclaw/" + path, null);
              else cb(null, "ERR:HTTP" + r.status + " " + String(txt).slice(0, 120));
            });
          })
          .catch(function(e){ cb(null, "ERR:" + ((e && e.message) ? e.message : "fetch")); });
        return true;
      }catch(e){ return false; }
    };
    _upFallback[id] = function(err){
      // 原生直传失败 → 先用浏览器直传兜底
      if(jsUpload()) return true;
      // 再退回原生 base64 通道
      if(!f.token || !native.fileData) return false;
      let d = "";
      try{ d = String(native.fileData(f.token) || ""); }catch(e){ d = "ERR"; }
      if(d.indexOf("OK:") !== 0) return false;
      const parts = d.split(":");
      f.b64 = parts.slice(2).join(":");
      if(parts[1]) f.mime = parts[1];
      setTimeout(function(){ native.uploadAsync(id, url, headers, f.b64); }, 80);
      return true;
    };
    if(f.token && native.uploadPicked){
      native.uploadPicked(id, f.token, url, headers);
    } else if(f.b64){
      native.uploadAsync(id, url, headers, f.b64);
    } else {
      cb(null, "ERR:no-file");
    }
  },
  fail(f, err){
    const msg = t("upload_fail") + "\n" + String(err || "").slice(0, 260);
    const c = Chat.cur();
    if(c){
      c.msgs.push({ role:"system", content: msg + "\n(文件: " + ((f && f.name) ? f.name : "") + ")" });
      saveConvs(); Chat.render();
    }
    try{ uiAsk(msg, null, { input:false, cancel:false }); }catch(e){ Native.toast(t("upload_fail")); }
  },
  ready(list){ return (list || []).filter(function(f){ return f.url && !f.fail; }); },
  isImg(f){ return String(f.mime || "").indexOf("image") === 0 || /\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name || ""); },
  take(){ const a = Attach.ready(Attach.pending); Attach.pending = []; Attach.render(); return a; },
  takeSup(){ const a = Attach.ready(Attach.supList()); Attach.supPending = []; Attach.render(); return a; },
  rm(list, i){
    const arr = list === "sup" ? Attach.supList() : Attach.pending;
    arr.splice(i, 1); Attach.render();
  },
  render(){
    function chipHtml(f, kind, i){
      const thumb = Attach.isImg(f) && f.url ? "<img src='" + esc(f.url) + "'>" : "<span>📄</span>";
      return "<div class='chip'>" + thumb + "<span>" + esc(f.name) +
        (f.up ? " · " + t("uploading") : (f.fail ? " · ✕" : "")) + "</span>" +
        "<i onclick='Attach.rm(\"" + kind + "\"," + i + ")'>✕</i></div>";
    }
    const box = el("chips");
    if(box){
      const a = Attach.pending;
      if(!a.length){ box.className = "hide"; box.innerHTML = ""; }
      else { box.className = ""; box.innerHTML = a.map(function(f, i){ return chipHtml(f, "chat", i); }).join(""); }
    }
    const s = el("sup-chips");
    if(s){
      const a2 = Attach.supList();
      if(!a2.length){ s.className = "hide"; s.innerHTML = ""; }
      else { s.className = ""; s.innerHTML = a2.map(function(f, i){ return chipHtml(f, "sup", i); }).join(""); }
    }
  },
  html(list){
    if(!list || !list.length) return "";
    return "<div class='att'>" + list.map(function(a){
      const isImg = String(a.mime || "").indexOf("image") === 0 || Attach.isImg(a);
      return isImg
        ? "<a href='" + esc(a.url) + "' target='_blank'><img src='" + esc(a.url) + "'></a>"
        : "<a href='" + esc(a.url) + "' target='_blank'>📄 " + esc(a.name || "file") + "</a>";
    }).join("") + "</div>";
  }
};

  card(x){
    const media = (x.media || []).filter(function(m){ return m && m.url; }).slice(0, 4).map(GC.media).join("");
    return "<div class='gcard' onclick='GC.open(" + x.id + ")'>" +
      "<h4>" + linkify(esc(x.title)) + "</h4>" +
      "<div class='gm'>" + esc(x.username) + " · " + fmtTime(new Date(x.created_at).getTime()) + "</div>" +
      "<p>" + linkify(esc(String(x.body || "").slice(0, 120))) + "</p>" +
      (media ? "<div class='gmedia'>" + media + "</div>" : "") +
      "<div class='gbar'><span>" + (x.liked ? "❤️" : "🤍") + " " + (x.likes || 0) + "</span>" +
      "<span>💬 " + (x.reply_n || x.replies || 0) + "</span></div></div>";
  },
  media(m){
    const u = m.url || "";
    const isImg = String(m.mime || "").indexOf("image") === 0 || /\.(png|jpe?g|gif|webp)$/i.test(u);
    const isVid = String(m.mime || "").indexOf("video") === 0 || /\.(mp4|mov|webm)$/i.test(u);
    if(isImg) return "<img src='" + esc(u) + "'>";
    if(isVid) return "<video src='" + esc(u) + "' controls></video>";
    return "<a href='" + esc(u) + "' target='_blank'>📄 " + esc(m.name || "file") + "</a>";

  open(id){
    this.cur = id;

      GC.detail(d.post, d.replies || []);
    });
  },
  detail(post, replies){
    const media = (post.media || []).filter(function(m){ return m && m.url; }).map(GC.media).join("");
    let h = "<div class='gwrap'><div class='gcard'>" +
      "<h4>" + linkify(esc(post.title)) + "</h4>" +
      "<div class='gm'>" + esc(post.username) + " · " + fmtTime(new Date(post.created_at).getTime()) +
      (post.status === "removed" ? " · <span style='color:#FF8A9A'>" + t("gc_removed") + "</span>" : "") + "</div>" +
      "<p>" + linkify(esc(post.body || "")) + "</p>" +
      (media ? "<div class='gmedia'>" + media + "</div>" : "") +
      (post.share ? "<div class='gshare'>" + esc(GC.shareText(post.share)) + "</div>" : "") +
      "<div class='gbar'><span onclick=\"GC.like(" + post.id + ")\">" +
      (post.liked ? "❤️" : "🤍") + " " + (post.likes || 0) + "</span>" +
      "<span onclick=\"GC.report(" + post.id + ")\">" + t("gc_report") + "</span></div></div>";
    h += "<div class='hd'>" + t("gc_replies") + " (" + replies.length + ")</div>";
    h += replies.map(function(r){
      const m2 = (r.media || []).filter(function(m){ return m && m.url; }).map(GC.media).join("");
      return "<div class='gcard'><div class='gm'>" + esc(r.username) + " · " +
        fmtTime(new Date(r.created_at).getTime()) + "</div><p>" + linkify(esc(r.body || "")) + "</p>" +
        (m2 ? "<div class='gmedia'>" + m2 + "</div>" : "") + "</div>";
    }).join("");
    h += "<div class='gcard'><textarea id='gc-rep' rows='3' placeholder='" + esc(t("gc_reply_ph")) +
      "' style='width:100%;background:var(--inp);border:1px solid var(--ghost-bd);border-radius:12px;padding:11px 13px;color:var(--fg);resize:none'></textarea>" +
      "<div style='height:10px'></div><div style='display:flex;gap:8px'>" +
      "<button class='btn ghost mini' onclick=\"Attach.openMenu(false)\">＋</button>" +
      "<button class='btn' onclick='GC.reply(" + post.id + ")'>" + t("gc_send") + "</button></div></div>" +
      "<div style='height:12px'></div><button class='btn ghost' onclick='GC.render()'>" + t("back") + "</button></div>";
    const g = el("guide");
    g.classList.remove("hide");
    g.innerHTML = h;
  },
  shareText(sh){
    let o = sh;
    try{ if(typeof sh === "string") o = JSON.parse(sh); }catch(e){}
    if(!o) return "";
    if(o.kind === "chat") return t("gc_shared_chat") + "：" + String(o.text || "").slice(0, 160);
    if(o.kind === "memory") return t("gc_shared_mem") + "：" + String(o.text || "").slice(0, 160);
    if(o.kind === "skill") return t("gc_shared_skill") + "：" + String(o.name || "");
    return t("gc_shared") + "：" + String(o.text || "").slice(0, 160);
  },
  async like(id){
    const r = await rpc("mrclaw_like", { p_user: S.user.name, p_post_id: id });
    if(r && r.__err){ Native.toast(t("gc_fail")); return; }
    GC.open(id);
  },
  async reply(id){
    const box = el("gc-rep");
    const v = (box && box.value ? box.value : "").trim();
    const atts = Attach.take();
    if(!v && !atts.length) return;
    const r = await rpc("mrclaw_reply_add", { p_user: S.user.name, p_post_id: id,
                                              p_body: v, p_media: atts });
    if(r && r.__err){ Native.toast(t("gc_fail")); return; }
    GC.open(id);
  },
  async report(id){
    const why = await uiAsk(t("gc_report_why"), "");
    if(why === null) return;
    const r = await rpc("mrclaw_report", { p_user: S.user.name, p_post_id: id,
                                           p_reason: String(why) });
    if(r && r.__err){ Native.toast(t("gc_fail")); return; }
    Native.toast(t("gc_report_ok"));
  },
  async create(){
    const title = await uiAsk(t("gc_title_q"), "");
    if(title === null) return;
    const tt = String(title).trim();
    if(!tt){ Native.toast(t("gc_need_title")); return; }
    if(tt.length > 20){ Native.toast(t("gc_title_long")); return; }

    if(body === null) return;
    const atts = Attach.take();
    const r = await rpc("mrclaw_post_add", { p_user: S.user.name, p_title: tt,
                                             p_body: String(body), p_media: atts, p_share: null });
    if(!r || r.__err || r.err){
      Native.toast(t("gc_fail") + " " + (r && (r.err || r.__err) ? String(r.err || r.__err) : ""));

const BC = {
  timer: null,
  start(){
    BC.load();
    if(BC.timer) clearInterval(BC.timer);
    BC.timer = setInterval(function(){ BC.load(); }, 60000);
  },
  load(){
    if(!native) return;
    rpc("mrclaw_bc_get").then(function(b){
      if(!b || b.__err || !b.enabled){ BC.hide(); return; }
      const now = Date.now();
      if(b.start_at && new Date(b.start_at).getTime() > now){ BC.hide(); return; }
      if(b.end_at && new Date(b.end_at).getTime() < now){ BC.hide(); return; }
      BC.show(b.text || "", b.speed || 60);
    });
  },
  show(text, speed){
    const s = String(text || "");
    if(!s.trim()){ BC.hide(); return; }
    const i = el("bc-in");
    i.textContent = s;
    const base = Math.max(12, s.length * 0.28);
    const dur = Math.max(8, base * (60 / (speed > 0 ? speed : 60)));
    i.style.animationDuration = dur.toFixed(1) + "s";
    el("bc").classList.remove("hide");
  },
  hide(){ el("bc").classList.add("hide"); }
};

      if(!S.user){ res(null); return; }
      rpc("mrclaw_state", { p_user: S.user.name }).then(function(st){
        if(st && !st.__err && typeof st === "object" && !Array.isArray(st)){
          Acc.data.points = st.points || 0;
          Acc.data.banUntil = st.ban_until || null;
          Acc.data.banReason = st.ban_reason || "";
          Acc.data.mode = st.use_mode || "points";
          Acc.data.reviewed = !!st.reviewed;
          if(st.reviewed) S.cfg.reviewed = true;
          Acc.data.ready = true;
          Acc.at = Date.now();
          Acc.paint();
          Acc.banCheck();
          res(st);
        } else {
          res(null);
        }
      });
    });
  },
  refresh(cb){ Acc.fetch().then(function(){ if(cb) cb(); }); },
  ensure(cb){
    if(Date.now() - Acc.at < 12000){ if(cb) cb(Acc.data); return; }
    Acc.fetch().then(function(){ if(cb) cb(Acc.data); });
  },
  paint(){
    const c = el("pts-chip");
    if(c) c.textContent = t("pts") + " " + (Acc.data.ready
      ? Number(Acc.data.points || 0).toLocaleString() : t("loading"));
    const b = el("mode-btn");
    if(b){
      const own = Acc.data.mode === "own";
      b.textContent = own ? t("mode_key") : t("mode_pts");
      b.title = t("mode_tip");
    }
    try{ Mode.paint(); }catch(e){}
  },
  mode(){
    if(!S.user) return;
    const next = (Acc.data.mode === "own") ? "points" : "own";
    if(next === "own" && !S.cfg.apiKey){ Native.toast(t("need_key_first")); Guide.key(); return; }
    Acc.data.mode = next;
    rpc("mrclaw_set_mode", { p_user: S.user.name, p_mode: next });
    Acc.paint();
    Native.toast(next === "own" ? t("mode_to_key") : t("mode_to_pts"));
  },
  banned(){ return !!Acc.data.banUntil && new Date(Acc.data.banUntil).getTime() > Date.now(); },
  banDays(){
    if(!Acc.data.banUntil) return 0;
    const ms = new Date(Acc.data.banUntil).getTime() - Date.now();
    if(ms > 3.0e9) return -1;
    return Math.max(1, Math.ceil(ms / 86400000));
  },
  banCheck(){
    const b = el("ban");
    if(this.banned()) Show.ban();
    else { b.className = "hide"; b.innerHTML = ""; }
  }
};

const Show = {
  ban(){
    const d = Acc.banDays();
    const head = d < 0 ? t("banned_forever") : t("banned_days", d);
    const b = el("ban");
    b.className = "on";
    b.innerHTML = "<div class='banbox'><div class='bt'>" + head + "</div>" +
      "<div class='tiny' style='font-size:13.5px'>" + esc(t("banned_reason", Acc.data.banReason || "")) + "</div>" +
      "<div class='tiny' style='margin-top:16px'>" + t("banned_hint") + "</div></div>";
  },
  out(){
    const d = el("dlg");
    d.classList.remove("hide");
    d.innerHTML = "<div class='dbox'><div class='dtitle'>" + t("pts_empty") + "</div>" +
      "<button class='btn' style='margin-bottom:10px' onclick='Show.pay()'>" + t("recharge") + "</button>" +
      "<button class='btn ghost' style='margin-bottom:10px' onclick='Show.key()'>" + t("set_key") + "</button>" +
      "<button class='btn ghost' onclick='Show.service()'>" + t("contact") + "</button></div>";
  },
  pay(){ uiClose(null); Show.openPay(); },
  openPay(){
    const url = "https://www.kufaka.com/item/lizls5";
    try{
      if(native && native.openUrl){ native.openUrl(url); return; }
      window.open(url, "_blank");
    }catch(e){ Native.toast(t("redeem_fail")); }
  },
  key(){ uiClose(null); Guide.key(); },
  service(){ uiClose(null); Support.open(); }
};

/* ================= 兑换码 ================= */
const Redeem = {
  open(){
    if(!S.user) return Chat.openLoginGate();
    const b = el("redeem");
    b.classList.remove("hide");
    b.innerHTML = "<div class='rw'><div class='gt'><b>" + t("redeem_title") + "</b></div>" +
      "<textarea id='rd-in' placeholder='" + esc(t("redeem_ph")) + "' autocorrect='off' autocapitalize='off' spellcheck='false'></textarea>" +
      "<div style='height:16px'></div><button class='btn' onclick='Redeem.scan()'>" + t("redeem_scan") + "</button>" +
      "<div style='height:10px'></div><button class='btn ghost' onclick='Redeem.close()'>" + t("cancel") + "</button></div>";
  },
  close(){ el("redeem").classList.add("hide"); },
  scan(){
    const raw = String(el("rd-in").value || "").toUpperCase();
    const found = raw.match(/LG\d{4}NB/g) || [];
    const uniq = found.filter(function(v, i){ return found.indexOf(v) === i; });
    if(!uniq.length){ Native.toast(t("redeem_none")); return; }
    Redeem.go(uniq);
  },
  async go(codes){
    const yes = await uiAsk(t("redeem_found", codes.length), null, { input:false });
    if(yes !== true) return;
    rpc("mrclaw_redeem", { p_user: S.user.name, p_codes: codes }).then(function(r){
      if(!r || r.__err){
        Native.toast(t("redeem_fail") + (r && r.__err ? " " + String(r.__err).slice(0, 90) : ""));
        return;
      }
      if(typeof r.ok !== "number"){ Native.toast(t("redeem_fail")); return; }
      if(r.ok > 0){
        Acc.data.points = r.points;
        Acc.at = 0;
        Acc.paint();
        Native.toast(t("redeem_ok", r.added, Number(r.points).toLocaleString()));
        Redeem.close();
        Acc.refresh();
      } else if((r.bad || []).length){
        Native.toast(t("redeem_part", 0, (r.bad || []).length));
      } else {
        Native.toast(t("redeem_fail"));
      }
    });
  }
};

/* ================= 客服 ================= */
const Support = {
  timer:null,
  open(){
    if(!S.user) return Chat.openLoginGate();
    SupUnread.seen();
    Support.msgs = [];
    Attach.supPending = [];
    const b = el("sup");
    b.classList.remove("hide");
    b.innerHTML = "<div class='sup-top'><button class='mbtn' onclick='Support.close()'>←</button>" +
      "<b style='font-size:16px'>" + t("support") + "</b></div>" +
      "<div class='sup-list' id='sup-list'><div class='empty'>" + t("support_empty") + "</div></div>" +
      "<div id='sup-chips' class='hide' style='padding:0 12px 6px'></div>" +
      "<div class='sup-bar'><button class='btn ghost mini' onclick='Attach.openMenu(true)'>＋</button>" +
      "<input id='sup-in' type='text' autocomplete='off' spellcheck='false' placeholder='" + esc(t("support_ph")) + "'>" +
      "<button class='btn mini' onclick='Support.send()'>" + t("send_btn") + "</button></div>";
    Attach.supPending = [];
    Attach.render();
    const i = el("sup-in");
    if(i) i.addEventListener("keydown", function(ev){ if(ev.key === "Enter") Support.send(); });
    this.load();
    const self = this;
    if(this.timer) clearInterval(this.timer);
    this.timer = setInterval(function(){ self.load(); }, 5000);
  },
  close(){ el("sup").classList.add("hide"); if(this.timer){ clearInterval(this.timer); this.timer = null; } },
  msgs: [],
  load(){
    if(el("sup").classList.contains("hide")) return;
    rpc("mrclaw_support_list", { p_user: S.user.name }).then(function(a){
      if(Array.isArray(a)){ Support.msgs = a; Support.render(a); }
    });
  },
  render(a){
    const box = el("sup-list");
    if(!box) return;
    let h = "";
    if(!a.length) h = "<div class='empty'>" + t("support_empty") + "</div>";
    a.forEach(function(m){
      h += "<div class='smsg " + (m.sender === "user" ? "me" : "op") + "'>" +
        linkify(esc(m.body)) + Attach.html(m.attach) + "</div>";
    });
    box.innerHTML = h;
    box.scrollTop = box.scrollHeight;
  },
  send(){
    const i = el("sup-in");
    const v = String(i.value || "").trim();
    const atts = Attach.takeSup();
    if(!v && !atts.length) return;
    i.value = "";
    Support.msgs = Support.msgs.concat([{ sender:"user", body:v, attach:atts,
                                          created_at:new Date().toISOString() }]);
    Support.render(Support.msgs);
    rpc("mrclaw_support_send", { p_user: S.user.name, p_body: v, p_attach: atts }).then(function(r){
      if(r && r.__err){ Native.toast(t("support_fail")); return; }
      Support.load();
    });
  }
};

/* ================= 系统回调 ================= */
window.MR_onChunk = function(id, x){ Chat.onChunk(id, x); };
window.MR_onDone  = function(id, x){ Chat.onDone(id, x); };
window.MR_onError = function(id, x){ Chat.onError(id, x); };
window.MR_agent   = function(s){ Chat.agentEvent(s); };
window.MR_onBack = function(){
  if(!el("sup").classList.contains("hide")){ Support.close(); return true; }
  if(!el("redeem").classList.contains("hide")){ Redeem.close(); return true; }
  if(!el("drawer").classList.contains("hide")){ Conv.close(); return true; }
  if(!el("dlg").classList.contains("hide")){ uiClose(null); return true; }
  if(!el("guide").classList.contains("hide")){ Guide.close(); return true; }
  if(!el("app").classList.contains("hide")){
    if(S.tab !== "chat"){ App.tab("chat"); return true; }
    return false;
  }
  return true;
};

/* ================= 静态文案 ================= */
function paintStatic(){
  el("lb-user").textContent = t("username");
  el("lb-pwd").textContent = t("password");
  el("lb-pwd2").textContent = t("password2");
  el("nv-chat").textContent = t("nav_chat");
  el("nv-gc").textContent = t("nav_gc");
  if(el("nv-adm")) el("nv-adm").textContent = t("nav_adm");
  el("nv-task").textContent = t("nav_task");
  el("nv-skill").textContent = t("nav_skill");
  el("nv-mem").textContent = t("nav_mem");
  el("nv-me").textContent = t("nav_me");
  el("stop-btn").textContent = t("stop_btn");
  el("att-btn").textContent = "＋";
  el("att-btn").title = t("attach");
  el("bc-in").textContent = "";
  try{ Mode.paint(); }catch(e){}
  el("rd-btn").textContent = t("redeem");
  try{ Acc.paint(); }catch(e){}
  el("ta").placeholder = "";
  el("menu-btn").title = t("all_chats");
  document.title = "MRClaw";
}

/* ================= 启动 ================= */
el("ta").addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
  Chat.syncSendBtn();
});
el("ta").addEventListener("focus", function(){
  if(!S.user){ this.blur(); Chat.openLoginGate(); }
});
el("send").addEventListener("click", function(){ Chat.send(); });

(function boot(){
  applyTheme();
  if(native && native.setLang) { try{ native.setLang(LANG); }catch(e){} }
  loadUserData();
  if(S.cfg.taskMode === undefined){ S.cfg.taskMode = true; saveCfg(); }
  paintStatic();
  if(S.user){
    el("auth").classList.add("hide");
    el("app").classList.remove("hide");
    Cloud.pull(S.user.name);
    Acc.refresh();
    App.tab("chat");
  } else {
    Auth.tab("reg");
  }
  setTimeout(function(){ Upd.check(); }, 1200);
  setTimeout(function(){
    if(native && !native.toolAsync){ try{ Upd.noBridge(); }catch(e){} }
  }, 3500);
  try{ BC.start(); }catch(e){}
  setTimeout(function(){ try{ SupUnread.load(); }catch(e){} } , 2500);
  setTimeout(function(){ try{ Admin.check(); }catch(e){} }, 1800);
  setTimeout(function(){ try{ Notice.load(); }catch(e){} }, 3000);
  setInterval(function(){ if(!document.hidden && S.user){ try{ Notice.load(); }catch(e){} } }, 60000);
  setInterval(function(){ if(!document.hidden && S.user){ try{ SupUnread.load(); }catch(e){} } }, 30000);
  setInterval(function(){
    if(document.hidden || !S.user) return;
    Acc.refresh();
  }, 20000);
})();
</script>
