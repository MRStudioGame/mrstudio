<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>MRClaw</title>
<style>
:root{
  --bg:#0E1116; --panel:#151A21; --panel2:#11161C; --border:#232A34;
  --fg:#E7ECF3; --muted:#7C8798; --muted2:#6E7A8C; --inp:#0F1319;
  --line:#1F242C; --msg:#1A2028; --chip:#1A212B; --accent:#2F6BFF;
  --tip-bg:#1A2230; --tip-bd:#26364F; --tip-fg:#8FB4FF;
  --ghost-bg:#1B2029; --ghost-bd:#2A313D; --ghost-fg:#C9D3E0;
  --danger-bg:#2A1519; --danger-bd:#40202A; --danger-fg:#FF7A8A;
  --mask:rgba(6,9,13,.62); --sw:#2A313D;
}
body.light{
  --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#FFFFFF; --border:#E3E8EF;
  --fg:#1B2330; --muted:#6B7688; --muted2:#7B8697; --inp:#F7F9FC;
  --line:#E9EDF3; --msg:#F1F4F9; --chip:#FFFFFF; --accent:#2F6BFF;
  --tip-bg:#EAF1FF; --tip-bd:#C7D9FF; --tip-fg:#2A62D6;
  --ghost-bg:#FFFFFF; --ghost-bd:#DFE5EE; --ghost-fg:#3C4759;
  --danger-bg:#FDECEF; --danger-bd:#F5C9D1; --danger-fg:#D0394F;
  --mask:rgba(30,38,50,.35); --sw:#D7DEE8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overscroll-behavior:none}
#root{height:100%;display:flex;flex-direction:column}
.hide{display:none!important}
button,input,textarea,select{font:inherit;color:inherit;outline:none;border:none;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;
  width:100%;transition:.15s}
.btn:active{transform:scale(.98);opacity:.88}
.btn.ghost{background:var(--ghost-bg);border:1px solid var(--ghost-bd);color:var(--ghost-fg)}
.btn.mini{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.btn.danger{background:var(--danger-bg);color:var(--danger-fg);border:1px solid var(--danger-bd)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.muted{color:var(--muted);font-size:13px}
.tiny{font-size:12px;color:var(--muted2)}
label.f{display:block;margin:14px 0 6px;font-size:13px;color:var(--muted)}
.inp{width:100%;background:var(--inp);border:1px solid var(--ghost-bd);border-radius:12px;
  padding:13px 14px;color:var(--fg)}
.inp:focus{border-color:var(--accent)}
.mask{-webkit-text-security:disc;text-security:disc}
.seg{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--border);
  border-radius:12px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13.5px}
.seg button.act{background:var(--accent);color:#fff}
.sw{width:48px;height:28px;border-radius:14px;background:var(--sw);position:relative;
  flex:0 0 48px;transition:.2s}
.sw.on{background:var(--accent)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:.2s}
.sw.on i{left:23px}
#auth{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 26px;overflow-y:auto}
.logo{text-align:center;margin-bottom:26px}
.logo b{font-size:30px;letter-spacing:1px}
.logo span{display:block;color:var(--muted2);font-size:12px;margin-top:6px;letter-spacing:3px}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
  padding-top:calc(14px + env(safe-area-inset-top))}
#top b{font-size:17px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#nav{display:flex;border-top:1px solid var(--line);background:var(--panel2);
  padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:9px 0 11px;color:var(--muted);font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
#nav button.act{color:var(--accent)}
#nav b{font-size:19px;font-weight:400}
#msgs{padding:10px 14px 6px}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;margin:7px 0;
  white-space:pre-wrap;word-break:break-word}
.msg.u{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.msg.a{background:var(--msg);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg.sys{background:transparent;color:var(--muted2);font-size:12px;text-align:center;
  margin:10px auto;max-width:100%}
.ahead{margin-bottom:7px;font-size:12px}
.ahead .run{color:var(--tip-fg)}
.ahead .ok{color:#3AAE6A}
.ahead .warn{color:#D3920F}
.ahead .bad{color:#D0394F}
#agentbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 12px 8px;padding:9px 14px;border-radius:12px;font-size:13px;
  background:var(--tip-bg);border:1px solid var(--tip-bd);color:var(--tip-fg)}
#agentbar .btn.mini{width:auto;flex:0 0 auto}
#bar{padding:8px 12px 10px;border-top:1px solid var(--line);background:var(--panel2)}
.barline{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
#toolrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
#pts-chip{font-size:12px;color:var(--muted2)}
.tb2{font-size:12px;padding:7px 10px}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#chips .chip{display:flex;align-items:center;gap:6px;background:var(--chip);
  border:1px solid var(--ghost-bd);border-radius:10px;padding:5px 8px;font-size:11.5px;
  max-width:48%}
#chips .chip img{width:26px;height:26px;object-fit:cover;border-radius:6px}
#chips .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chips .chip i{cursor:pointer;font-style:normal;color:var(--muted)}
.att{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.att img{max-width:170px;max-height:170px;border-radius:10px;display:block}
.att a{font-size:12px;color:var(--tip-fg);border:1px solid var(--tip-bd);
  background:var(--tip-bg);border-radius:9px;padding:5px 9px;text-decoration:none}
.att .up{opacity:.55}
#toolrow .btn.mini{width:auto;font-size:12.5px;padding:6px 12px}
#bar textarea{flex:1;background:var(--inp);border:1px solid var(--ghost-bd);border-radius:14px;
  padding:11px 14px;max-height:120px;resize:none;color:var(--fg)}
#send{background:var(--accent);color:#fff;border-radius:14px;width:46px;height:44px;
  font-size:18px;flex:0 0 46px}
#send.off{background:var(--chip);color:var(--muted)}
.toolbtn{background:var(--chip);border:1px solid var(--ghost-bd);color:var(--ghost-fg);
  border-radius:14px;width:44px;height:44px;flex:0 0 44px;font-size:17px}
.toolbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.spk{text-align:left;margin:-2px 0 8px}
.spk span{font-size:11.5px;color:var(--muted2);border:1px solid var(--border);
  border-radius:8px;padding:2px 9px;background:var(--panel)}
.item{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:13px 14px;margin:10px 12px}
.item h4{margin:0 0 6px;font-size:14.5px}
.item p{margin:0;color:var(--muted);font-size:12.5px;white-space:pre-wrap}
.hd{padding:14px 16px 4px;font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted2);font-size:13px;padding:40px 20px}
#updbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:10px 12px 0;padding:10px 14px;border-radius:12px;font-size:13.5px;
  background:var(--tip-bg);border:1px solid var(--tip-bd);color:var(--tip-fg)}
#updbar .btn.mini{flex:0 0 auto}
#guide{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.gwrap{max-width:520px;margin:0 auto;padding:28px 22px 48px}
.gt{margin-bottom:20px}
.gt b{display:block;font-size:19px}
.gt span{color:var(--muted);font-size:12.5px}
.glist{margin-top:6px}
.gitem{display:flex;align-items:center;gap:12px;background:var(--panel);
  border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin:10px 0}
.gn{font-size:14.5px;font-weight:600;margin-bottom:3px}
.gok{display:inline-block;margin-left:8px;font-size:11px;font-weight:400;
  background:rgba(58,174,106,.14);border:1px solid rgba(58,174,106,.4);color:#3AAE6A;
  border-radius:6px;padding:1px 7px}
#drawer{position:fixed;inset:0;z-index:55}
.dmask{position:absolute;inset:0;background:var(--mask)}
.dpanel{position:absolute;top:0;left:0;bottom:0;width:80%;max-width:340px;
  background:var(--panel2);border-right:1px solid var(--border);overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:calc(14px + env(safe-area-inset-top)) 0 24px}
.dhead{padding:0 16px 12px;display:flex;justify-content:space-between;align-items:center}
.citem{padding:13px 16px;border-bottom:1px solid var(--line);transition:.12s}
.citem.act{background:var(--chip)}
.citem .cn{font-size:14.5px;margin-bottom:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.citem .cd{font-size:11.5px;color:var(--muted2)}
.mbtn{background:var(--chip);border:1px solid var(--ghost-bd);color:var(--ghost-fg);
  border-radius:12px;width:40px;height:40px;flex:0 0 40px;font-size:17px}
#dlg{position:fixed;inset:0;background:var(--mask);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:24px}
.dbox{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);
  border-radius:18px;padding:20px}
.dtitle{font-size:15px;font-weight:600;margin-bottom:14px}
#redeem,#sup{position:fixed;inset:0;background:var(--bg);z-index:58;
  display:flex;flex-direction:column}
#ban{position:fixed;inset:0;background:var(--bg);z-index:70;display:none;
  align-items:center;justify-content:center;padding:30px}
#ban.on{display:flex}
.banbox{max-width:420px;width:100%;text-align:center}
.banbox .bt{font-size:19px;font-weight:700;margin-bottom:10px}
.rw{max-width:520px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 22px 40px;width:100%}
.rw textarea{width:100%;height:150px;background:var(--inp);border:1px solid var(--ghost-bd);
  border-radius:14px;padding:13px 14px;color:var(--fg);resize:none}
.sup-top{display:flex;align-items:center;gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.sup-list{flex:1;overflow-y:auto;padding:12px 14px}
.sup-bar{display:flex;gap:8px;padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sup-bar input{flex:1;background:var(--inp);border:1px solid var(--ghost-bd);
  border-radius:14px;padding:11px 14px;color:var(--fg)}
.smsg{max-width:80%;padding:10px 13px;border-radius:14px;margin:6px 0;
  white-space:pre-wrap;word-break:break-word}
.smsg.me{background:var(--accent);color:#fff;margin-left:auto}
.smsg.op{background:var(--msg);border:1px solid var(--border)}
</style>
</head>
<body>
<div id="root">

  <div id="auth">
    <div class="logo"><b>MRClaw</b><span>MR STUDIO</span></div>
    <div class="seg">
      <button id="t-reg" class="act" onclick="Auth.tab('reg')"></button>
      <button id="t-login" onclick="Auth.tab('login')"></button>
    </div>
    <label class="f" id="lb-user"></label>
    <input id="a-user" class="inp" autocapitalize="off" autocomplete="off" placeholder="">
    <label class="f" id="lb-pwd"></label>
    <input id="a-pwd" class="inp mask" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="">
    <div id="a-pwd2-wrap">
      <label class="f" id="lb-pwd2"></label>
      <input id="a-pwd2" class="inp mask" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="">
    </div>
    <div style="height:20px"></div>
    <button class="btn" id="a-go" onclick="Auth.go()"></button>
    <div style="height:14px"></div>
    <div class="tiny" style="text-align:center" id="a-msg"></div>
  </div>

  <div id="app" class="hide">
    <div id="updbar" class="hide"></div>
    <div id="top">
      <button class="mbtn" id="menu-btn" onclick="Conv.open()">☰</button>
      <b id="top-title"></b>
      <button class="btn ghost mini tb2" id="rd-btn" onclick="Redeem.open()"></button>
      <button class="btn ghost mini tb2" id="top-btn" onclick="App.topAction()"></button>
    </div>
    <div id="content"></div>
    <div id="agentbar" class="hide">
      <span id="agenttxt"></span>
      <button class="btn mini danger" id="stop-btn" onclick="Chat.stopAgent()"></button>
    </div>
    <div id="bar" class="hide">
      <div id="chips" class="hide"></div>
      <div id="toolrow">
        <span id="pts-chip"></span>
        <div style="display:flex;gap:8px">
          <button id="att-btn" class="btn ghost mini" onclick="Attach.pick(false)"></button>
          <button id="mode-btn" class="btn ghost mini" onclick="Acc.mode()"></button>
        </div>
      </div>
      <div class="barline">
        <textarea id="ta" rows="1" placeholder=""></textarea>
        <button id="send" onclick="Chat.send()">↑</button>
      </div>
    </div>
    <div id="nav">
      <button data-tab="chat" class="act" onclick="App.tab('chat')"><b>💬</b><span id="nv-chat"></span></button>
      <button data-tab="task" onclick="App.tab('task')"><b>⏱</b><span id="nv-task"></span></button>
      <button data-tab="skill" onclick="App.tab('skill')"><b>🧩</b><span id="nv-skill"></span></button>
      <button data-tab="mem" onclick="App.tab('mem')"><b>🧠</b><span id="nv-mem"></span></button>
      <button data-tab="me" onclick="App.tab('me')"><b>⚙️</b><span id="nv-me"></span></button>
    </div>
  </div>

  <div id="guide" class="hide"></div>
  <div id="drawer" class="hide"></div>
  <div id="dlg" class="hide"></div>
  <div id="redeem" class="hide"></div>
  <div id="sup" class="hide"></div>
  <div id="ban" class="hide"></div>
</div>

/* ---------------- 异步网络 ---------------- */
let _httpSeq = 0;
const _httpWait = {};
function httpReq(method, url, headersObj, bodyStr){
  return new Promise(function(res){
    if(!native || !native.httpAsync){
      res(Native.http(method, url, JSON.stringify(headersObj||{}), bodyStr||""));
      return;
    }
    const id = "h" + (++_httpSeq);
    let done = false;
    let timer = null;
    function finish(x){
      if(done) return;
      done = true;
      if(timer) clearTimeout(timer);
      delete _httpWait[id];
      res(x);
    }
    timer = setTimeout(function(){ finish("ERR:Timeout"); }, 40000);
    _httpWait[id] = finish;
    native.httpAsync(id, method, url, JSON.stringify(headersObj||{}), bodyStr||"");
  });
}
window.MR_onHttp = function(id, text){
  const f = _httpWait[id];
  if(f) f(text);
};

function rpc(fn, args){
  return httpReq("POST", SB_URL + "/rest/v1/rpc/" + fn,
    { "apikey": SB_KEY, "Authorization": "***" + SB_KEY, "Content-Type": "application/json" },
    JSON.stringify(args || {})
  ).then(function(raw){
    if(raw && String(raw).indexOf("ERR:") === 0) return { __err: String(raw) };
    const v = (raw === null || raw === undefined) ? "" : String(raw).trim();
    if(v === "") return null;
    try {
      const o = JSON.parse(v);
      if(o && typeof o === "object" && !Array.isArray(o) &&
         (o.message !== undefined || o.error !== undefined || o.code !== undefined) &&
         o.ok === undefined && o.points === undefined && o.id === undefined && o.username === undefined){
        return { __err: String(o.message || o.error || o.code) };
      }
      return o;
    } catch(e){ return { __err: "parse:" + v.slice(0,120) }; }
  });
}

  if(!el("guide").classList.contains("hide") && Guide.step === "perm") Guide.perm();
  if(S.tab === "me" && !el("app").classList.contains("hide")) Me.render();
  if(S.user) Acc.refresh();
  if(Date.now() - (Upd.last || 0) > 300000) Upd.check();
});

/* ================= 语音 ================= */
const Voice = {
  listening:false,
  stt(){
    if(!native || !native.sttStart){ Native.toast(t("mobile_only")); return; }
    if(this.listening){ this.listening = false; el("mic").classList.remove("on"); native.sttStop(); return; }
    this.listening = true;
    el("mic").classList.add("on");
    Native.toast(t("stt_listen"));
    native.sttStart();
  },
  speak(x){
    if(!native || !native.speak){ Native.toast(t("mobile_only")); return; }
    const v = String(x || "").trim();
    if(!v) return;
    native.speak(v.slice(0, 800));
  },
  speakMsg(i){
    const c = Chat.cur(); if(!c) return;
    const m = c.msgs[i];
    if(m && m.content) this.speak(m.content.replace(/^[·\s]+/gm, ""));
  }
};
window.MR_onStt = function(s){
  let o = {};
  try{ o = JSON.parse(s); }catch(e){ return; }
  if(o.type === "start") return;
  if(o.type === "partial"){ el("ta").value = o.text || ""; Chat.syncSendBtn(); return; }
  if(o.type === "result"){
    Voice.listening = false; el("mic").classList.remove("on");
    el("ta").value = o.text || ""; Chat.syncSendBtn(); return;
  }
  if(o.type === "err"){
    Voice.listening = false; el("mic").classList.remove("on");
    Native.toast(o.text || t("stt_fail"));
  }
};

/* ================= 登录 / 注册 ================= */
const Auth = {
  mode:"reg",
  tab(m){
    this.mode = m;
    el("t-reg").textContent = t("reg");
    el("t-login").textContent = t("login");
    el("t-reg").className = m==="reg" ? "act" : "";
    el("t-login").className = m==="login" ? "act" : "";
    el("a-pwd2-wrap").className = m==="reg" ? "" : "hide";
    el("a-go").textContent = m==="reg" ? t("reg") : t("login");
    el("a-msg").textContent = "";
  },
  msg(x){ el("a-msg").textContent = x || ""; },
  busy:false,
  go(){
    const u = el("a-user").value.trim();
    const p = el("a-pwd").value;
    if(this.busy) return;
    if(!u){ return this.msg(t("need_user")); }
    if(p.length < 4){ return this.msg(t("pwd_short")); }
    const self = this;
    const done = function(){ self.busy = false; };
    this.busy = true;
    if(this.mode === "reg"){
      if(p !== el("a-pwd2").value){ this.busy = false; return this.msg(t("pwd_diff")); }
      this.msg(t("regging"));
      const salt = rnd(32);
      rpc("mrclaw_register", { p_user: u, p_salt: salt, p_hash: Native.hash(salt + p) })
        .then(function(r){
          done();
          if(r && r.__err){ return self.msg(t("reg_fail") + String(r.__err).slice(0, 110)); }
          if(r === "EXISTS"){ return self.msg(t("user_exists")); }
          if(r !== "OK"){ return self.msg(t("reg_fail") + JSON.stringify(r).slice(0, 110)); }
          self.enter(u);
        });
    } else {
      this.msg(t("logining"));
      rpc("mrclaw_salt", { p_user: u }).then(function(salt){
        if(salt && salt.__err){ done(); return self.msg(t("net_err") + String(salt.__err).slice(0, 110)); }
        if(!salt || typeof salt !== "string"){ done(); return self.msg(t("no_user")); }
        rpc("mrclaw_login", { p_user: u, p_hash: Native.hash(salt + p) }).then(function(ok){
          done();
          if(ok && ok.__err){ return self.msg(t("net_err") + String(ok.__err).slice(0, 110)); }
          if(ok === true) self.enter(u);
          else self.msg(t("bad_pwd"));
        });
      });
    }
  },
  enter(u){
    S.user = { name: u, t: nowMs() };
    LS.set("mrclaw_user", S.user);
    loadUserData();
    rpc("mrclaw_touch", { p_user: u });
    Cloud.pull(u);
    Acc.refresh();
    el("auth").classList.add("hide");
    el("app").classList.remove("hide");
    App.tab("chat");
  },
  logout(){
    S.user = null; LS.del("mrclaw_user");
    loadUserData();
    el("app").classList.add("hide");
    el("auth").classList.remove("hide");
    el("a-pwd").value = ""; el("a-pwd2").value = "";
    this.tab("login");
  }
};

const Cloud = {
  pull(u){
    rpc("mrclaw_get_config", { p_user: u }).then(function(c){
      if(c && !c.__err && typeof c === "object" && !Array.isArray(c)){
        S.cfg = {
          provider: c.provider || S.cfg.provider,
          apiKey: c.api_key || "",
          base: c.base_url || "",
          model: c.model || "",
          temp: c.temperature || "0.7",
          autonomy: !!c.autonomy,
          hasRoot: S.cfg.hasRoot
        };
        saveCfg();
        if(S.tab === "me") Me.render();
      }
    });
  },
  push(quiet){
    if(!S.user) return;
    rpc("mrclaw_save_config", {
      p_user: S.user.name, p_provider: S.cfg.provider, p_api_key: S.cfg.apiKey,
      p_base_url: S.cfg.base, p_model: S.cfg.model, p_temp: String(S.cfg.temp),
      p_autonomy: !!S.cfg.autonomy, p_device: Native.model(), p_ver: Native.version()
    }).then(function(r){
      if(r && r.__err){ Native.toast(t("save_failed")); return; }
      if(!quiet) Native.toast(LANG==="en" ? "Saved" : "已保存");
    });
  }
};

    S.tab = x;
    document.querySelectorAll("#nav button").forEach(function(b){
      b.className = (b.getAttribute("data-tab") === x) ? "act" : "";
    });
    el("bar").classList.toggle("hide", x !== "chat");
    el("menu-btn").style.display = (x === "chat") ? "" : "none";
    if(x==="chat") Chat.render();
    if(x==="task") Task.render();
    if(x==="skill") Skill.render();
    if(x==="mem") Mem.render();
    if(x==="me") Me.render();
  },
  topAction(){
    if(S.tab==="chat") Chat.newConv();
    else if(S.tab==="task") Task.create();
    else if(S.tab==="skill") Skill.create();
    else if(S.tab==="mem") Mem.create();
    else Cloud.push();
  },
  title(x){ el("top-title").textContent = x; },
  content(html){ el("content").innerHTML = html; el("content").scrollTop = el("content").scrollHeight; },
  topBtn(label){ el("top-btn").textContent = label; }
};

/* ================= 会话列表 ================= */
const Conv = {
  lp:null,
  open(){ this.render(); el("drawer").classList.remove("hide"); },
  close(){ el("drawer").classList.add("hide"); },
  render(){
    let h = "<div class='dmask' onclick='Conv.close()'></div><div class='dpanel'>" +
      "<div style='padding:0 16px 12px'><button class='btn' onclick='Conv.pay()'>" + t("recharge") + "</button></div>" +
      "<div class='dhead'><button class='btn mini ghost' onclick='Support.open();Conv.close()'>" + t("support") + "</button>" +
      "<button class='btn mini' onclick='Conv.add()'>" + t("new") + "</button></div>" +
      "<div style='padding:0 16px 12px'><b style='font-size:15px'>" + t("all_chats") + "</b></div>";
    if(!S.convs.length) h += "<div class='empty'>" + t("no_chats") + "</div>";
    S.convs.forEach(function(c,i){
      h += "<div class='citem " + (c.id===S.cur?"act":"") + "' data-i='" + i + "'" +
        " ontouchstart='Conv.press(event," + i + ")' ontouchend='Conv.up()' ontouchmove='Conv.up()'" +
        " onmousedown='Conv.press(event," + i + ")' onmouseup='Conv.up()' onmouseleave='Conv.up()'" +
        " onclick='Conv.tap(" + i + ")'>" +
        "<div class='cn'>" + esc(c.title || t("new_chat")) + "</div>" +
        "<div class='cd'>" + fmtTime(c.t) + " · " + (c.msgs ? c.msgs.length : 0) + "</div></div>";
    });
    h += "</div>";
    el("drawer").innerHTML = h;
  },
  press(e, i){
    this.up();
    const self = this;
    this.lp = setTimeout(function(){ self.lp = null; self.action(i); }, 550);
  },
  up(){ if(this.lp){ clearTimeout(this.lp); this.lp = null; this._block = Date.now(); } },
  tap(i){ if(this._block && Date.now() - this._block < 700) return; this.pick(i); },
  add(){ Chat.newConv(); this.close(); },
  pay(){ this.close(); Show.openPay(); },
  pick(i){ const c = S.convs[i]; if(!c) return; S.cur = c.id; saveConvs(); Chat.render(); this.close(); },
  async action(i){
    const c = S.convs[i]; if(!c) return;
    this._block = Date.now();
    const v = await uiSheet(c.title || t("new_chat"), [
      { label: t("rename"), value: "rename" },
      { label: t("del_chat"), value: "del", danger: true }
    ]);
    if(v === "rename"){
      const n = await uiAsk(t("rename_title"), c.title || "");
      if(n === null) return;
      const x = String(n).trim();
      if(!x) return;
      c.title = x; saveConvs();
      if(c.id === S.cur) App.title(x);
      this.render();
    } else if(v === "del"){
      const ok = await uiAsk(t("del_chat_q", c.title || t("new_chat")), null, { input:false });
      if(ok !== true) return;
      S.convs = S.convs.filter(function(x){ return x.id !== c.id; });
      if(S.cur === c.id) S.cur = S.convs[0] ? S.convs[0].id : null;
      saveConvs(); Chat.render(); this.render();
    }
  }
};

/* ================= 聊天 ================= */
const Chat = {
  cur(){ return S.convs.filter(c=>c.id===S.cur)[0] || null; },
  newConv(){
    const c = { id: "c"+nowMs(), title: t("new_chat"), msgs: [], t: nowMs() };
    S.convs.unshift(c); S.cur = c.id; saveConvs(); this.render();
  },
  headHtml(x){
    if(!x) return "";
    if(x._running) return "<div class='ahead'><span class='run'>" + t("running") + "</span></div>";
    if(x._state === "done") return "<div class='ahead'><span class='ok'>" + t("done_t") + "</span></div>";
    if(x._state === "stop") return "<div class='ahead'><span class='warn'>" + t("stop_t") + "</span></div>";
    if(x._state === "err") return "<div class='ahead'><span class='bad'>" + t("err_t") + "</span></div>";
    return "";
  },
  render(){
    if(!this.cur()) this.newConv();
    App.title(this.cur().title);
    App.topBtn(t("new"));
    const m = this.cur().msgs;
    let h = "<div id='msgs'>";
    if(!m.length) h += "<div class='empty'>" + t("chat_empty") + "</div>";
    m.forEach(function(x,i){
      if(x.role==="system") h += "<div class='msg sys'>" + esc(x.content) + "</div>";
      else if(x.role==="user"){
        h += "<div class='msg u'>" + esc(x.content) + Attach.html(x.attach) + "</div>";
      }
      else {
        h += "<div class='msg a'>" + Chat.headHtml(x) + esc(x.content) + "</div>";
        if(x.content) h += "<div class='spk'><span onclick='Voice.speakMsg(" + i + ")'>" + t("speak") + "</span></div>";
      }
    });
    h += "</div>";
    App.content(h);
    this.syncSendBtn();
  },
  syncSendBtn(){
    const v = el("ta").value.trim();
    el("send").className = (v && !Chat.busy) ? "" : "off";
  },
  openLoginGate(){
    Native.toast(t("need_login"));
    el("app").classList.add("hide");
    el("auth").classList.remove("hide");
    Auth.tab("login");
  },
  endpoint(){
    const p = providerById(S.cfg.provider);
    let base = (S.cfg.base || p.base || "").replace(/\/+$/,"");
    if(!base) return "";
    if(/\/chat\/completions$/.test(base)) return base;
    return base + "/chat/completions";
  },
  systemText(){
    let sys = LANG === "en"
      ? "You are MRClaw, an AI assistant running on the user's Android phone. When you need to operate the phone, first call screen to see the current UI, then use tap / input_text / swipe / open_app. If the user is not asking for phone control, just answer normally. Reply in English, concise."
      : "你是 MRClaw，运行在用户安卓手机上的 AI 助手。需要操作手机时，先调用 screen 看当前界面，再用 tap / input_text / swipe / open_app 等工具执行。用户没有要求操作手机时，就正常回答问题。用中文，简洁。";
    if(S.mems.length) sys += (LANG==="en" ? "\n\n[Long-term memory]\n" : "\n\n【长期记忆】\n") +
      S.mems.map(m=>"- " + m.text).join("\n");
    sys += Skill.activeText();
    return sys;
  },
  async send(){
    if(!S.user) return this.openLoginGate();
    if(Acc.banned()){ Show.ban(); return; }
    const ta = el("ta");
    const text = ta.value.trim();
    if(!text || this.busy) return;
    const useOwn = (Acc.data.mode === "own");
    if(useOwn && !S.cfg.apiKey && !(S.cfg.provider==="custom" && S.cfg.base)){ Guide.key(); return; }
    if(native && !Perm.done() && !S.cfg.permAsked){
      S.cfg.permAsked = true; saveCfg(); Guide.perm(); return;
    }
    if(!useOwn){
      const st = await Acc.fetch();
      if(Acc.banned()){ Show.ban(); return; }
      if(!st && !Acc.data.ready){ Native.toast(t("save_failed")); return; }
      if(Acc.data.points <= 0){ Show.out(); return; }
    }
    const atts = Attach.take();
    const c = this.cur();
    c.msgs.push({ role:"user", content: text, attach: atts });
    if(c.title === t("new_chat")){ c.title = text.slice(0,14); }
    c.t = nowMs();
    ta.value = ""; ta.style.height = "auto";
    saveConvs(); this.render();

    if(!useOwn){
      if(Acc.data.points <= 0){ Show.out(); return; }
      this.sendPoints(c);
      return;
    }

    const url = this.endpoint();
    if(!url){ Native.toast(LANG==="en" ? "Please configure the endpoint" : "请先配置接口地址"); App.tab("me"); return; }
    const headers = JSON.stringify({
      "Content-Type": "application/json",
      "Authorization": "***" + S.cfg.apiKey
    });
    const body = JSON.stringify({
      model: S.cfg.model || providerById(S.cfg.provider).model,
      messages: this.apiMsgs(c, null, atts),
      stream: true,
      temperature: parseFloat(S.cfg.temp) || 0.7
    });

    this.busy = true;
    this.syncSendBtn();
    const useAgent = !!(native && Perm.done());
    const bubble = { role:"assistant", content:"" };
    if(useAgent){ bubble._agent = true; bubble._steps = []; bubble._running = true; }
    else { bubble._stream = true; }
    c.msgs.push(bubble);
    if(useAgent) this.agentBar(true, t("running").replace("● ","") + "…");
    this.render();

    if(useAgent){ this.agentRun(bubble, url, headers, body); return; }
    this.streamId = "s"+nowMs();
    if(!Native.stream(this.streamId, url, headers, body)){ this.fallbackFetch(url, headers, body); }
  },
  /* -------- 组装请求消息（支持图片） -------- */
  apiMsgs(c, bubble, atts){
    const model = S.cfg.model || providerById(S.cfg.provider).model;
    const vision = /vl|vision|4v|omni|glm-4v|gpt-4/i.test(String(model));
    const hist = c.msgs.filter(function(x){ return x !== bubble && x.role !== "system"; }).slice(-24);
    const out = [{ role:"system", content: this.systemText() }];
    hist.forEach(function(x, i){
      const last = (i === hist.length - 1);
      if(x.role === "user" && last && atts && atts.length){
        const imgs = atts.filter(function(a){ return Attach.isImg(a) && a.url; });
        if(vision && imgs.length){
          const parts = [];
          if(x.content) parts.push({ type:"text", text: x.content });
          imgs.forEach(function(a){ parts.push({ type:"image_url", image_url:{ url:a.url } }); });
          out.push({ role:"user", content: parts });
          return;
        }
        const extra = atts.map(function(a){ return "[附件] " + (a.name || "") + " " + a.url; }).join("\n");
        out.push({ role:"user", content: (x.content ? x.content + "\n\n" : "") + extra });
        return;
      }
      out.push({ role: x.role, content: x.content });
    });
    return out;
  },
  /* -------- 积分模式：走服务端代理，Key 不下发 -------- */
  sendPoints(c){
    this.busy = true; this.syncSendBtn();
    const last = c.msgs[c.msgs.length - 1];
    const atts = (last && last.attach) ? last.attach : [];
    if(atts.some(function(a){ return Attach.isImg(a); })) Native.toast(t("no_vision"));
    const bubble = { role:"assistant", content: t("thinking"), _pts:true };
    c.msgs.push(bubble); this.render();
    const msgs = this.apiMsgs(c, bubble, atts);
    rpc("mrclaw_ai_start", {
      p_user: S.user.name,
      p_body: { model:"deepseek-chat", messages: msgs, stream:false, max_tokens: 2048 }
    }).then(function(st){
      if(!st || st.__err){ Chat.ptsFail(bubble, (st && st.__err) || "net"); return; }
      if(st.err === "no_points"){ Chat.ptsEnd(bubble, true); return; }
      if(st.err === "banned"){ Show.ban(); Chat.ptsEnd(bubble, false); return; }
      if(st.err){ Chat.ptsFail(bubble, st.err); return; }
      Chat.pollPts(bubble, st.id, 0);
    });
  },
  pollPts(bubble, id, n){
    if(n > 100){ this.ptsFail(bubble, "timeout"); return; }
    setTimeout(function(){
      rpc("mrclaw_ai_poll", { p_user: S.user.name, p_id: id }).then(function(p){
        if(!p || p.__err || !p.done){ Chat.pollPts(bubble, id, n + 1); return; }
        bubble.content = Chat.extract(p.body);
        if(typeof p.points === "number"){ Acc.data.points = p.points; Acc.paint(); }
        Chat.busy = false; saveConvs(); Chat.render();
        if(Acc.data.points <= 0) Show.out();
      });
    }, 1200);
  },
  ptsEnd(bubble, dialog){
    bubble.role = "system";
    bubble.content = t("pts_empty");
    this.busy = false; saveConvs(); Chat.render();
    if(dialog) Show.out();
  },
  ptsFail(bubble, err){
    bubble.role = "system";
    bubble.content = t("exec_fail") + String(err).slice(0, 200);
    this.busy = false; saveConvs(); Chat.render();
  },
  agentRun(bubble, url, headers, body){
    const c = this.cur();
    const hist = c.msgs.filter(function(x){ return x !== bubble && x.role !== "system"; }).slice(-12)
      .map(function(x){
        let txt = x.content || "";
        if(x.attach && x.attach.length){
          txt += (txt ? "\n\n" : "") + x.attach.map(function(a){
            return "[附件] " + (a.name || "") + " " + a.url;
          }).join("\n");
        }
        return { role:x.role, content: txt };
      });
    native.agent(JSON.stringify({
      url: url, headers: headers,
      model: S.cfg.model || providerById(S.cfg.provider).model,
      temp: parseFloat(S.cfg.temp) || 0.7,
      system: this.systemText(), history: hist, autonomy: !!S.cfg.autonomy
    }));
  },
  fallbackFetch(url, headers, body){
    const c = this.cur();
    const b = Object.assign({}, JSON.parse(body), { stream:false });
    const raw = Native.http("POST", url, headers, JSON.stringify(b));
    this.onDone(this.streamId, this.extract(raw));
  },
  extract(raw){
    try{
      const o = JSON.parse(raw);
      if(o.choices && o.choices.length) return o.choices[0].message.content || "";
      return raw.slice(0,300);
    }catch(e){ return String(raw).slice(0,300); }
  },
  onChunk(id, piece){
    if(id !== Chat.streamId) return;
    const c = Chat.cur(); if(!c) return;
    const last = c.msgs[c.msgs.length-1];
    if(last && last._stream){
      last.content += piece;
      const box = el("msgs");
      if(box){
        const nodes = box.querySelectorAll(".msg.a");
        const n = nodes[nodes.length-1];
        if(n) n.textContent = last.content;
        el("content").scrollTop = el("content").scrollHeight;
      }
    }
  },
  onDone(id, full){
    if(id !== Chat.streamId) return;
    const c = Chat.cur(); if(!c) return;
    const last = c.msgs[c.msgs.length-1];
    if(last && last._stream){ last.content = full || last.content; delete last._stream; }
    Chat.busy = false; saveConvs(); Chat.render();
  },
  onError(id, err){
    if(id !== Chat.streamId) return;
    const c = Chat.cur(); if(!c) return;
    const last = c.msgs[c.msgs.length-1];
    if(last && last._stream){
      last.role = "system";
      last.content = t("exec_fail") + String(err).slice(0,300);
      delete last._stream;
    }
    Chat.busy = false; saveConvs(); Chat.render();
  },
  agentBar(on, text){
    const b = el("agentbar");
    if(on){ el("agenttxt").textContent = text || (t("running").replace("● ","") + "…"); b.classList.remove("hide"); }
    else b.classList.add("hide");
  },
  stopAgent(){
    if(native && native.agentStop){
      native.agentStop();
      el("agenttxt").textContent = t("stopping");
      Native.toast(t("stop_req"));
    }
  },
  paint(b){
    const box = el("msgs"); if(!box) return;
    const nodes = box.querySelectorAll(".msg.a");
    const n = nodes[nodes.length-1];
    if(n) n.innerHTML = Chat.headHtml(b) + esc(b.content);
    el("content").scrollTop = el("content").scrollHeight;
  },
  agentEvent(s){
    let o = {};
    try{ o = JSON.parse(s); }catch(e){ return; }
    const c = this.cur(); if(!c) return;
    const b = c.msgs[c.msgs.length-1];
    if(!b || !b._steps) return;
    if(o.type === "run"){ b._running = true; this.agentBar(true); this.paint(b); return; }
    if(o.type === "status"){
      b._steps.push(o.text);
      b.content = b._steps.map(x=>"· " + x).join("\n");
      this.paint(b); return;
    }
    if(o.type === "text"){
      b.content = (b._steps.length ? b._steps.map(x=>"· " + x).join("\n") + "\n\n" : "") + o.text;
      this.paint(b); return;
    }
    if(o.type === "err"){
      b._running = false; b._state = "err";
      b.content = String(o.text).slice(0,300);
      this.busy = false; this.agentBar(false); saveConvs(); Chat.render(); return;
    }
    if(o.type === "stop"){
      b._running = false; b._state = "stop";
      this.busy = false; this.agentBar(false); saveConvs(); Chat.render(); return;
    }
    if(o.type === "done"){

/* ================= 更新 ================= */
const Upd = {
  info:null, list:[], i:0, _tryNext:null, last:0,
  check(manual){
    if(!native){ if(manual) Native.toast(t("mobile_only")); return; }
    Upd.last = Date.now();
    if(manual) Native.toast(t("upd_checking"));
    httpReq("GET", "https://mrstudiogame.github.io/mrstudio/mrclaw/web.json", {}, "").then(function(raw){
      let hot = false;
      try{
        if(raw && String(raw).indexOf("ERR:") !== 0){
          const j = JSON.parse(raw);
          const cur = (native.webVersion ? native.webVersion() : "0");
          if(j && j.web && cmpVer(j.web, cur) > 0){ hot = true; Upd.webApply(j); }
        }
      }catch(e){}
      if(!hot) Upd.checkApk(manual);
      else if(manual) Native.toast(t("upd_found", WEB_VERSION));
    });
  },
  webApply(j){
    const urls = [j.url].concat(j.mirrors || []).filter(Boolean);
    let k = 0;
    const b = el("updbar");
    b.classList.remove("hide");
    b.innerHTML = "<span id='upd-txt'>" + t("web_updating") + "</span>";
    this._tryNext = function(){
      if(k >= urls.length){ b.innerHTML = "<span>" + t("web_fail") + "</span>"; return; }
      const u = urls[k]; k++;
      native.webUpdate(u, j.web);
    };
    this._tryNext();
  },
  checkApk(manual){
    if(!native){ if(manual) Native.toast(t("mobile_only")); return; }
    const url = (native.updateUrl ? native.updateUrl() : "");
    if(!url){ if(manual) Native.toast(t("upd_check_fail")); return; }
    httpReq("GET", url, {}, "").then(function(raw){
      try{
        if(!raw || String(raw).indexOf("ERR:") === 0){ if(manual) Native.toast(t("upd_check_fail")); return; }
        const j = JSON.parse(raw);
        const cur = (native.versionCode ? native.versionCode() : 0);
        if(j && j.versionCode > cur){
          Upd.info = j;
          Upd.list = [j.url].concat(j.mirrors || []).filter(Boolean);
          Upd.i = 0;
          const b = el("updbar");
          b.classList.remove("hide");
          b.innerHTML = "<span>" + t("upd_found", esc(j.versionName)) + "</span>" +
            "<button class='btn mini' onclick='Upd.go()'>" + t("update_now") + "</button>";
          if(manual) Native.toast(t("upd_found", j.versionName));
        } else if(manual){
          Native.toast(t("upd_latest", Native.version()));
        }
      }catch(e){ if(manual) Native.toast(t("upd_check_fail")); }
    });
  },
  go(){
    if(!this.info) return;
    if(native.canInstall && !native.canInstall()){
      Native.toast(t("need_install_perm"));
      native.installSettings();
      return;
    }
    el("updbar").innerHTML = "<span id='upd-txt'>" + t("upd_downloading", 0) + "</span>";
    native.update(this.list[this.i], "MRClaw-v" + this.info.versionName + ".apk");
  },
  onUpd(s){
    let o = {};
    try{ o = JSON.parse(s); }catch(e){ return; }
    const b = el("updbar");
    if(o.p !== undefined){
      const x = el("upd-txt");
      if(x) x.textContent = o.p >= 100 ? t("upd_installing") : t("upd_downloading", o.p);
      return;
    }
    if(o.err){
      this.i++;
      if(this.i < this.list.length){
        b.innerHTML = "<span id='upd-txt'>" + t("upd_retry_line") + "</span>";
        native.update(this.list[this.i], "MRClaw-v" + this.info.versionName + ".apk");
        return;
      }
      b.innerHTML = "<span>" + t("upd_failed") + "</span><button class='btn mini' onclick='Upd.go()'>" + t("retry") + "</button>";
      return;
    }
    if(o.done) b.classList.add("hide");
  }
};
window.MR_onUpd = function(s){ Upd.onUpd(s); };
window.MR_onWebUpd = function(s){
  let o = {};
  try{ o = JSON.parse(s); }catch(e){ return; }
  if(o.ok){
    const x = el("upd-txt");
    if(x) x.textContent = t("web_updated");
    setTimeout(function(){ if(native && native.webReload) native.webReload(); }, 700);
  } else if(Upd._tryNext){
    Upd._tryNext();
  }
};
function webVer(){
  try{ return (native && native.webVersion) ? (String(native.webVersion()) === "0" ? WEB_VERSION : String(native.webVersion())) : WEB_VERSION; }
  catch(e){ return WEB_VERSION; }
}
function cmpVer(a, b){
  const pa = String(a || "0").split("."), pb = String(b || "0").split(".");
  for(let i = 0; i < 3; i++){
    const x = parseInt(pa[i] || "0", 10) || 0, y = parseInt(pb[i] || "0", 10) || 0;
    if(x > y) return 1;
    if(x < y) return -1;
  }
  return 0;
}

  uploadAll(){
    const all = Attach.pending.concat(Attach.supList());
    all.forEach(function(f){
      if(!f.up || f.url) return;
      Attach.upload(f, function(url, err){
        if(url){ f.url = url; f.up = false; }

    const path = u + "/" + Date.now() + "_" + rnd(6) + "_" + safe;

      if(text && String(text).indexOf("ERR:") === 0) return cb(null, text);
      cb(SB_URL + "/storage/v1/object/public/mrclaw/" + path, null);
    };
    native.uploadAsync(id, SB_URL + "/storage/v1/object/mrclaw/" + path,
      JSON.stringify({
        "apikey": SB_KEY,
        "Authorization": "Bea" + "rer " + SB_KEY,
        "Content-Type": f.mime || "application/octet-stream",
        "x-upsert": "true"
      }), f.b64);
  },
  ready(list){ return (list || []).filter(function(f){ return f.url && !f.fail; }); },
  isImg(f){ return String(f.mime || "").indexOf("image") === 0 || /\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name || ""); },
  take(){ const a = Attach.ready(Attach.pending); Attach.pending = []; Attach.render(); return a; },
  takeSup(){ const a = Attach.ready(Attach.supList()); Attach.supPending = []; Attach.render(); return a; },
  rm(list, i){
    const arr = list === "sup" ? Attach.supList() : Attach.pending;
    arr.splice(i, 1); Attach.render();

  render(){

      const thumb = Attach.isImg(f) && f.url ? "<img src='" + esc(f.url) + "'>" : "<span>📄</span>";
      return "<div class='chip'>" + thumb + "<span>" + esc(f.name) +

        "<i onclick='Attach.rm(\"" + kind + "\"," + i + ")'>✕</i></div>";

      const a = Attach.pending;

      else { box.className = ""; box.innerHTML = a.map(function(f, i){ return chipHtml(f, "chat", i); }).join(""); }

      const a2 = Attach.supList();
      if(!a2.length){ s.className = "hide"; s.innerHTML = ""; }

const WEB_VERSION = "1.0.15";
const Acc = {
  data:{ points:0, banUntil:null, banReason:"", mode:"points", ready:false },
  at:0,
  fetch(){
    return new Promise(function(res){
      if(!S.user){ res(null); return; }
      rpc("mrclaw_state", { p_user: S.user.name }).then(function(st){
        if(st && !st.__err && typeof st === "object" && !Array.isArray(st)){
          Acc.data.points = st.points || 0;
          Acc.data.banUntil = st.ban_until || null;
          Acc.data.banReason = st.ban_reason || "";
          Acc.data.mode = st.use_mode || "points";
          Acc.data.ready = true;
          Acc.at = Date.now();
          Acc.paint();
          Acc.banCheck();
          res(st);
        } else {
          res(null);
        }
      });
    });
  },
  refresh(cb){ Acc.fetch().then(function(){ if(cb) cb(); }); },
  ensure(cb){
    if(Date.now() - Acc.at < 12000){ if(cb) cb(Acc.data); return; }
    Acc.fetch().then(function(){ if(cb) cb(Acc.data); });
  },
  paint(){
    const c = el("pts-chip");
    if(c) c.textContent = t("pts") + " " + Number(Acc.data.points || 0).toLocaleString();
    const b = el("mode-btn");
    if(b){
      const own = Acc.data.mode === "own";
      b.textContent = own ? t("mode_key") : t("mode_pts");
      b.className = "btn mini " + (own ? "" : "ghost");
    }
  },
  mode(){
    if(!S.user) return;
    const next = (Acc.data.mode === "own") ? "points" : "own";
    if(next === "own" && !S.cfg.apiKey){ Native.toast(t("need_key_first")); Guide.key(); return; }
    Acc.data.mode = next;
    rpc("mrclaw_set_mode", { p_user: S.user.name, p_mode: next });
    Acc.paint();
    Native.toast(next === "own" ? t("mode_to_key") : t("mode_to_pts"));
  },
  banned(){ return !!Acc.data.banUntil && new Date(Acc.data.banUntil).getTime() > Date.now(); },
  banDays(){
    if(!Acc.data.banUntil) return 0;
    const ms = new Date(Acc.data.banUntil).getTime() - Date.now();
    if(ms > 3.0e9) return -1;
    return Math.max(1, Math.ceil(ms / 86400000));
  },
  banCheck(){
    const b = el("ban");
    if(this.banned()) Show.ban();
    else { b.className = "hide"; b.innerHTML = ""; }
  }
};

const Show = {
  ban(){
    const d = Acc.banDays();
    const head = d < 0 ? t("banned_forever") : t("banned_days", d);
    const b = el("ban");
    b.className = "on";
    b.innerHTML = "<div class='banbox'><div class='bt'>" + head + "</div>" +
      "<div class='tiny' style='font-size:13.5px'>" + esc(t("banned_reason", Acc.data.banReason || "")) + "</div>" +
      "<div class='tiny' style='margin-top:16px'>" + t("banned_hint") + "</div></div>";
  },
  out(){
    const d = el("dlg");
    d.classList.remove("hide");
    d.innerHTML = "<div class='dbox'><div class='dtitle'>" + t("pts_empty") + "</div>" +
      "<button class='btn' style='margin-bottom:10px' onclick='Show.pay()'>" + t("recharge") + "</button>" +
      "<button class='btn ghost' style='margin-bottom:10px' onclick='Show.key()'>" + t("set_key") + "</button>" +
      "<button class='btn ghost' onclick='Show.service()'>" + t("contact") + "</button></div>";
  },
  pay(){ uiClose(null); Show.openPay(); },
  openPay(){
    const url = "https://www.kufaka.com/item/lizls5";
    try{
      if(native && native.openUrl){ native.openUrl(url); return; }
      window.open(url, "_blank");
    }catch(e){ Native.toast(t("redeem_fail")); }
  },
  key(){ uiClose(null); Guide.key(); },
  service(){ uiClose(null); Support.open(); }
};

/* ================= 兑换码 ================= */
const Redeem = {
  open(){
    if(!S.user) return Chat.openLoginGate();
    const b = el("redeem");
    b.classList.remove("hide");
    b.innerHTML = "<div class='rw'><div class='gt'><b>" + t("redeem_title") + "</b></div>" +
      "<textarea id='rd-in' placeholder='" + esc(t("redeem_ph")) + "' autocorrect='off' autocapitalize='off' spellcheck='false'></textarea>" +
      "<div style='height:16px'></div><button class='btn' onclick='Redeem.scan()'>" + t("redeem_scan") + "</button>" +
      "<div style='height:10px'></div><button class='btn ghost' onclick='Redeem.close()'>" + t("cancel") + "</button></div>";
  },
  close(){ el("redeem").classList.add("hide"); },
  scan(){
    const raw = String(el("rd-in").value || "").toUpperCase();
    const found = raw.match(/LG\d{4}NB/g) || [];
    const uniq = found.filter(function(v, i){ return found.indexOf(v) === i; });
    if(!uniq.length){ Native.toast(t("redeem_none")); return; }
    Redeem.go(uniq);
  },
  async go(codes){
    const yes = await uiAsk(t("redeem_found", codes.length), null, { input:false });
    if(yes !== true) return;
    rpc("mrclaw_redeem", { p_user: S.user.name, p_codes: codes }).then(function(r){
      if(!r || r.__err){
        Native.toast(t("redeem_fail") + (r && r.__err ? " " + String(r.__err).slice(0, 90) : ""));
        return;
      }
      if(typeof r.ok !== "number"){ Native.toast(t("redeem_fail")); return; }
      if(r.ok > 0){
        Acc.data.points = r.points;
        Acc.at = 0;
        Acc.paint();
        Native.toast(t("redeem_ok", r.added, Number(r.points).toLocaleString()));
        Redeem.close();
        Acc.refresh();
      } else if((r.bad || []).length){
        Native.toast(t("redeem_part", 0, (r.bad || []).length));
      } else {
        Native.toast(t("redeem_fail"));
      }
    });
  }
};

/* ================= 客服 ================= */
const Support = {
  timer:null,
  open(){
    if(!S.user) return Chat.openLoginGate();
    Support.msgs = [];
    Attach.supPending = [];
    const b = el("sup");
    b.classList.remove("hide");
    b.innerHTML = "<div class='sup-top'><button class='mbtn' onclick='Support.close()'>←</button>" +
      "<b style='font-size:16px'>" + t("support") + "</b></div>" +
      "<div class='sup-list' id='sup-list'><div class='empty'>" + t("support_empty") + "</div></div>" +
      "<div id='sup-chips' class='hide' style='padding:0 12px 6px'></div>" +
      "<div class='sup-bar'><button class='btn ghost mini' onclick='Attach.pick(true)'>📎</button>" +
      "<input id='sup-in' type='text' autocomplete='off' spellcheck='false' placeholder='" + esc(t("support_ph")) + "'>" +
      "<button class='btn mini' onclick='Support.send()'>" + t("send_btn") + "</button></div>";
    Attach.supPending = [];
    Attach.render();
    const i = el("sup-in");
    if(i) i.addEventListener("keydown", function(ev){ if(ev.key === "Enter") Support.send(); });
    this.load();
    const self = this;
    if(this.timer) clearInterval(this.timer);
    this.timer = setInterval(function(){ self.load(); }, 5000);
  },
  close(){ el("sup").classList.add("hide"); if(this.timer){ clearInterval(this.timer); this.timer = null; } },
  msgs: [],
  load(){
    if(el("sup").classList.contains("hide")) return;
    rpc("mrclaw_support_list", { p_user: S.user.name }).then(function(a){
      if(Array.isArray(a)){ Support.msgs = a; Support.render(a); }
    });
  },
  render(a){
    const box = el("sup-list");
    if(!box) return;
    let h = "";
    if(!a.length) h = "<div class='empty'>" + t("support_empty") + "</div>";
    a.forEach(function(m){
      h += "<div class='smsg " + (m.sender === "user" ? "me" : "op") + "'>" +
        esc(m.body) + Attach.html(m.attach) + "</div>";
    });
    box.innerHTML = h;
    box.scrollTop = box.scrollHeight;
  },
  send(){
    const i = el("sup-in");
    const v = String(i.value || "").trim();
    const atts = Attach.takeSup();
    if(!v && !atts.length) return;
    i.value = "";
    Support.msgs = Support.msgs.concat([{ sender:"user", body:v, attach:atts,
                                          created_at:new Date().toISOString() }]);
    Support.render(Support.msgs);
    rpc("mrclaw_support_send", { p_user: S.user.name, p_body: v, p_attach: atts }).then(function(r){
      if(r && r.__err){ Native.toast(t("support_fail")); return; }
      Support.load();
    });
  }
};

/* ================= 系统回调 ================= */
window.MR_onChunk = function(id, x){ Chat.onChunk(id, x); };
window.MR_onDone  = function(id, x){ Chat.onDone(id, x); };
window.MR_onError = function(id, x){ Chat.onError(id, x); };
window.MR_agent   = function(s){ Chat.agentEvent(s); };
window.MR_onBack = function(){
  if(!el("sup").classList.contains("hide")){ Support.close(); return true; }
  if(!el("redeem").classList.contains("hide")){ Redeem.close(); return true; }
  if(!el("drawer").classList.contains("hide")){ Conv.close(); return true; }
  if(!el("dlg").classList.contains("hide")){ uiClose(null); return true; }
  if(!el("guide").classList.contains("hide")){ Guide.close(); return true; }
  if(!el("app").classList.contains("hide")){
    if(S.tab !== "chat"){ App.tab("chat"); return true; }
    return false;
  }
  return true;
};

/* ================= 静态文案 ================= */
function paintStatic(){
  el("lb-user").textContent = t("username");
  el("lb-pwd").textContent = t("password");
  el("lb-pwd2").textContent = t("password2");
  el("nv-chat").textContent = t("nav_chat");
  el("nv-task").textContent = t("nav_task");
  el("nv-skill").textContent = t("nav_skill");
  el("nv-mem").textContent = t("nav_mem");
  el("nv-me").textContent = t("nav_me");
  el("stop-btn").textContent = t("stop_btn");
  el("att-btn").textContent = "📎";
  el("att-btn").title = t("attach");
  el("rd-btn").textContent = t("redeem");
  try{ Acc.paint(); }catch(e){}
  el("ta").placeholder = "";
  el("menu-btn").title = t("all_chats");
  document.title = "MRClaw";
}

/* ================= 启动 ================= */
el("ta").addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
  Chat.syncSendBtn();
});
el("ta").addEventListener("focus", function(){
  if(!S.user){ this.blur(); Chat.openLoginGate(); }
});
el("send").addEventListener("click", function(){ Chat.send(); });

(function boot(){
  applyTheme();
  if(native && native.setLang) { try{ native.setLang(LANG); }catch(e){} }
  loadUserData();
  paintStatic();
  if(S.user){
    el("auth").classList.add("hide");
    el("app").classList.remove("hide");
    Cloud.pull(S.user.name);
    Acc.refresh();
    App.tab("chat");
  } else {
    Auth.tab("reg");
  }
  setTimeout(function(){ Upd.check(); }, 1200);
  setInterval(function(){
    if(document.hidden || !S.user) return;
    Acc.refresh();
  }, 20000);
})();
</script>
