const Attach = {
  pending: [], _target: "chat",
  /* Supabase Storage 不接受中文对象路径（InvalidKey→HTTP400），
     所以目录名一律转成 ASCII：字母数字保留，否则退化为 hash */
  uid(name){
    const raw = String(name || "anon");
    let s = raw.replace(/[^A-Za-z0-9_.-]/g, "");
    let hs = 2166136261;
    for(let i = 0; i < raw.length; i++){
      hs ^= raw.charCodeAt(i);
      hs = (hs * 16777619) >>> 0;
    }
    return (s ? s.slice(0, 24) : "u") + "-" + hs.toString(36);
  },
  openMenu(forSupport, target){
    Attach._target = target || (forSupport ? "sup" : "chat");
    if(!native || !native.pickFile){ Attach.pickWeb(Attach._target === "gc" ? "any" : "any"); return; }
    uiSheet(t("attach_title"), [
      { label: "🖼 " + t("attach_img"), value: "image" },
      { label: "📄 " + t("attach_file"), value: "file" }
    ]).then(function(v){
      if(v === "image") native.pickFile("image", true);
      else if(v === "file") native.pickFile("any", true);
    });
  },
  pick(kind, forSupport, target){
    Attach._target = target || (forSupport ? "sup" : "chat");
    Attach.pickWeb(kind || "any");
  },
  pickWeb(kind){
    try{
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = (kind === "image") ? "image/*" : "";
      inp.multiple = true;
      inp.style.display = "none";
      document.body.appendChild(inp);
      inp.onchange = function(){
        const files = Array.prototype.slice.call(inp.files || []);
        try{ document.body.removeChild(inp); }catch(e){}
        if(files.length) Attach.addFiles(files);
        else if(native && native.pickFile) native.pickFile(kind === "image" ? "image" : "any", true);
      };
      inp.click();
    }catch(e){
      if(native && native.pickFile) native.pickFile("any", true);
    }
  },
  addFiles(files){
    const list = Attach.pickList();
    files.forEach(function(f){
      list.push({ name:f.name, mime:f.type || "", size:f.size || 0, file:f, url:"", up:true });
    });
    Attach.render();
    Attach.uploadAll();
  },
  onPick(s){
    let arr = [];
    try{ arr = JSON.parse(s); }catch(e){ arr = []; }
    if(!Array.isArray(arr) || !arr.length){ Native.toast(t("pick_fail")); return; }
    const list = Attach.pickList();
    arr.forEach(function(f){
      list.push({ name:f.name, mime:f.mime || "", size:f.size || 0,
                  token:f.token || "", b64:f.b64 || "", url:"", up:true });
    });
    Attach.render();
    Attach.uploadAll();
  },
  supList(){ return Attach.supPending || (Attach.supPending = []); },
  gcList(){ return Attach.gcPending || (Attach.gcPending = []); },
  pickList(){
    if(Attach._target === "sup") return Attach.supList();
    if(Attach._target === "gc") return Attach.gcList();
    return Attach.pending;
  },
  uploadAll(){
    const all = Attach.pending.concat(Attach.supList(), Attach.gcList());
    all.forEach(function(f){
      if(!f.up || f.url) return;
      Attach.upload(f, function(url, err){
        if(url){ f.url = url; f.up = false; }
        else { Attach.fail(f, err); f.fail = true; f.up = false; }
        Attach.render();
      });
    });
  },
  uploadWeb(f, cb){
    const u = Attach.uid(S.user ? S.user.name : "anon");
    const safe = String(f.name || "file").replace(/[^\w.\-]/g, "_").slice(-40);
    const path = u + "/" + Date.now() + "_" + rnd(8) + "_" + safe;
    const url = SB_URL + "/storage/v1/object/mrclaw/" + path;
    const pub = SB_URL + "/storage/v1/object/public/mrclaw/" + path;
    fetch(url, {
      method: "POST",
      headers: { "apikey": SB_KEY, "Authorization": BEARER + SB_KEY,
                 "Content-Type": f.mime || "application/octet-stream", "x-upsert": "true" },
      body: f.file
    }).then(function(r){
      return r.text().then(function(txt){
        if(r.ok) cb(pub, null);
        else cb(null, "ERR:HTTP" + r.status + " " + String(txt).slice(0, 200));
      });
    }).catch(function(e){ cb(null, "ERR:" + ((e && e.message) ? e.message : "fetch")); });
  },
  upload(f, cb){
    if(f.file){ return Attach.uploadWeb(f, cb); }
    const u = Attach.uid(S.user ? S.user.name : "anon");
    const safe = String(f.name || "file").replace(/[^\w.\-]/g, "_").slice(-40);
    const path = u + "/" + Date.now() + "_" + rnd(8) + "_" + safe;
    const id = "up" + (++_upSeq);
    const headers = JSON.stringify({
      "apikey": SB_KEY,
      "Authorization": "Bea" + "rer " + SB_KEY,
      "Content-Type": f.mime || "application/octet-stream",
      "x-upsert": "true"
    });
    _upWait[id] = function(text){
      if(text && String(text).indexOf("ERR:") === 0){
        const fb = _upFallback[id];
        delete _upFallback[id];
        if(fb && fb(text)) return;
        return cb(null, text);
      }
      delete _upFallback[id];
      cb(SB_URL + "/storage/v1/object/public/mrclaw/" + path, null);
    };
    const url = SB_URL + "/storage/v1/object/mrclaw/" + path;
    const jsUpload = function(){
      let b64 = f.b64 || "";
      if(!b64 && f.token && native.fileData){
        try{
          const d = String(native.fileData(f.token) || "");
          if(d.indexOf("OK:") === 0){
            const parts = d.split(":");
            b64 = parts.slice(2).join(":");
            if(parts[1]) f.mime = parts[1];
          }
        }catch(e){}
      }
      if(!b64) return false;
      try{
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        fetch(url, { method:"POST", headers: JSON.parse(headers), body: arr })
          .then(function(r){
            return r.text().then(function(txt){
              if(r.ok) cb(SB_URL + "/storage/v1/object/public/mrclaw/" + path, null);
              else cb(null, "ERR:HTTP" + r.status + " " + String(txt).slice(0, 120));
            });
          })
          .catch(function(e){ cb(null, "ERR:" + ((e && e.message) ? e.message : "fetch")); });
        return true;
      }catch(e){ return false; }
    };
    _upFallback[id] = function(err){
      // 原生直传失败 → 先用浏览器直传兜底
      if(jsUpload()) return true;
      // 再退回原生 base64 通道
      if(!f.token || !native.fileData) return false;
      let d = "";
      try{ d = String(native.fileData(f.token) || ""); }catch(e){ d = "ERR"; }
      if(d.indexOf("OK:") !== 0) return false;
      const parts = d.split(":");
      f.b64 = parts.slice(2).join(":");
      if(parts[1]) f.mime = parts[1];
      setTimeout(function(){ native.uploadAsync(id, url, headers, f.b64); }, 80);
      return true;
    };
    if(f.token && native.uploadPicked){
      native.uploadPicked(id, f.token, url, headers);
    } else if(f.b64){
      native.uploadAsync(id, url, headers, f.b64);
    } else {
      cb(null, "ERR:no-file");
    }
  },
  fail(f, err){
    const msg = t("upload_fail") + "\n" + String(err || "").slice(0, 260);
    if(Attach._target === "gc"){
      Native.toast(t("upload_fail") + " " + String(err || "").slice(0, 70));
      return;
    }
    const c = Chat.cur();
    if(c){
      c.msgs.push({ role:"system", content: msg + "\n(文件: " + ((f && f.name) ? f.name : "") + ")" });
      saveConvs(); Chat.render();
    }
    try{ uiAsk(msg, null, { input:false, cancel:false }); }catch(e){ Native.toast(t("upload_fail")); }
  },
  ready(list){ return (list || []).filter(function(f){ return f.url && !f.fail; }); },
  isImg(f){ return String(f.mime || "").indexOf("image") === 0 || /\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name || ""); },
  take(){ const a = Attach.ready(Attach.pending); Attach.pending = []; Attach.render(); return a; },
  takeSup(){ const a = Attach.ready(Attach.supList()); Attach.supPending = []; Attach.render(); return a; },
  takeGc(){ const a = Attach.ready(Attach.gcList()); Attach.gcPending = []; Attach.render(); return a; },
  rm(list, i){
    const arr = list === "sup" ? Attach.supList() : (list === "gc" ? Attach.gcList() : Attach.pending);
    arr.splice(i, 1); Attach.render();
  },
  render(){
    function chipHtml(f, kind, i){
      const thumb = Attach.isImg(f) && f.url ? "<img src='" + esc(f.url) + "'>" : "<span>📄</span>";
      return "<div class='chip'>" + thumb + "<span>" + esc(f.name) +
        (f.up ? " · " + t("uploading") : (f.fail ? " · ✕" : "")) + "</span>" +
        "<i onclick='Attach.rm(\"" + kind + "\"," + i + ")'>✕</i></div>";
    }
    const box = el("chips");
    if(box){
      const a = Attach.pending;
      if(!a.length){ box.className = "hide"; box.innerHTML = ""; }
      else { box.className = ""; box.innerHTML = a.map(function(f, i){ return chipHtml(f, "chat", i); }).join(""); }
    }
    const s = el("sup-chips");
    if(s){
      const a2 = Attach.supList();
      if(!a2.length){ s.className = "hide"; s.innerHTML = ""; }
      else { s.className = ""; s.innerHTML = a2.map(function(f, i){ return chipHtml(f, "sup", i); }).join(""); }
    }
    const g2 = el("gc-chips");
    if(g2){
      const a3 = Attach.gcList();
      if(!a3.length){ g2.className = "chips hide"; g2.innerHTML = ""; }
      else { g2.className = "chips"; g2.innerHTML = a3.map(function(f, i){ return chipHtml(f, "gc", i); }).join(""); }
    }
  },
  html(list){
    if(!list || !list.length) return "";
    return "<div class='att'>" + list.map(function(a){
      const isImg = String(a.mime || "").indexOf("image") === 0 || Attach.isImg(a);
      return isImg
        ? "<a href='" + esc(a.url) + "' target='_blank'><img src='" + esc(a.url) + "'></a>"
        : "<a href='" + esc(a.url) + "' target='_blank'>📄 " + esc(a.name || "file") + "</a>";
    }).join("") + "</div>";
  }
};

  },
  card(x){

      ((x.status === "removed") ? "<span class='pinbadge' style='color:#FF8A9A'>" + t("gc_removed") + "</span>" : "") +
      (x.board ? "<span class='pinbadge'>" + esc(x.board) + "</span>" : "") +
      (x.place ? "<span class='pinbadge'>📍" + esc(x.place) + "</span>" : "");
    const lp = " ontouchstart='GC.ps(" + x.id + ")' ontouchend='GC.pe()' ontouchmove='GC.pe()'" +
               " onmousedown='GC.ps(" + x.id + ")' onmouseup='GC.pe()' onmouseleave='GC.pe()'";
    return "<div class='gcard" + (x.pinned ? " pin" : "") + "' onclick='GC.open(" + x.id + ")'" + lp + ">" +
      "<h4>" + badges + linkify(esc(x.title)) + "</h4>" +
      "<div class='gm'>" + nameBadge(x.username) + " · " + esc(fmtDT(x.created_at)) + "</div>" +
      "<p>" + linkify(esc(String(x.body || "").slice(0, 120))) + "</p>" +
      (media ? "<div class='gmedia'>" + media + "</div>" : "") +

      "<span>💬 " + (x.reply_n || x.replies || 0) + "</span></div></div>";
  },
  media(m){

  back(){ Guide.close(); GC.cur = null; GC.render(); },

  detail(post, replies){

      "<h4>" + linkify(esc(post.title)) + "</h4>" +
      "<div class='gm'>" + nameBadge(post.username) + " · " + esc(fmtDT(post.created_at)) +
      (post.board ? " · " + esc(post.board) : "") +
      (post.place ? " · 📍" + esc(post.place) : "") +
      (post.declared ? " · " + t("gc_declared_tag") : "") +
      (post.edited_at ? " · " + t("gc_edited") : "") +
      (post.status === "removed" ? " · <span style='color:#FF8A9A'>" + t("gc_removed") + "</span>" : "") + "</div>" +
      "<p>" + linkify(esc(post.body || "")) + "</p>" +
      (media ? "<div class='gmedia'>" + media + "</div>" : "") +

      "<div class='gbar'><span onclick=\"GC.like(" + post.id + ")\">" +

      "</div></div>";

      "' style='width:100%;background:var(--inp);border:1px solid var(--ghost-bd);border-radius:12px;padding:11px 13px;color:var(--fg);resize:none'></textarea>" +

        ? "<div class='cm-sec'>" + t("gc_keep_media") + "</div><div class='oldm' id='cm-oldm'>" +

        : "<div class='oldm hide' id='cm-oldm'></div>") +
      "<div id='gc-chips' class='chips hide'></div>" +
      "<div style='height:10px'></div><div style='display:flex;gap:8px'>" +
      "<button class='btn ghost mini' onclick=\"Attach.openMenu(false,'gc')\">＋</button>" +
      "<button class='btn' onclick='GC.reply(" + post.id + ")'>" + t("gc_send") + "</button></div></div>" +
      "<div style='height:12px'></div><button class='btn ghost' onclick='GC.back()'>" + t("back") + "</button></div>";
    const g = el("guide");
    g.classList.remove("hide");

  },
  editPost(id){
    const p = (GC.curPost && GC.curPost.id === id) ? GC.curPost : null;
    if(!p){ Native.toast(t("gc_fail")); return; }
    GC.compose(p);
  },
  async delPost(id){
    const sure = await uiAsk(t("gc_del_q"), null, { input:false });
    if(sure !== true) return;
    const r = await rpc("mrclaw_post_delete", { p_user: S.user.name, p_id: id });
    if(r && (r.__err || r.err)){ Native.toast(t("gc_fail")); return; }
    Native.toast(t("gc_deleted"));
    Guide.close();
    GC.render();
  },
  /* ---- 评论树 ---- */
  tree(list){
    const by = {}, roots = [];
    (list || []).forEach(function(r){ r.kids = []; by[r.id] = r; });
    (list || []).forEach(function(r){
      if(r.parent_id && by[r.parent_id]) by[r.parent_id].kids.push(r);
      else roots.push(r);
    });
    return roots;
  },
  rp(r, depth, toName){
    const kids = r.kids || [];
    const m2 = (r.media || []).filter(function(m){ return m && m.url; }).map(GC.media).join("");
    const to = r.parent_name || toName;
    const ind = Math.min(depth, 4) * 12;
    return "<div class='gcard" + (depth ? " rp" : "") + "' style='" + (ind ? "margin-left:" + ind + "px;" : "") + "'>" +
      "<div class='gm'>" + nameBadge(r.username) +
      (to ? " <span class='rto'>" + t("gc_to") + " " + esc(to) + "</span>" : "") +
      " · " + esc(fmtDT(r.created_at)) + "</div>" +
      "<p>" + linkify(esc(r.body || "")) + "</p>" +
      (m2 ? "<div class='gmedia'>" + m2 + "</div>" : "") +
      "<div class='gbar'>" +
      "<span onclick=\"GC.setTo(" + r.id + ",'" + esc(r.username) + "')\">" + t("gc_reply_btn") + "</span>" +
      (kids.length ? "<span class='kbtn' onclick='GC.kids(" + r.id + ",this)'>" + t("gc_kids") + " " + kids.length + "</span>" : "") +
      "</div>" +
      (kids.length ? "<div id='kids" + r.id + "' class='kids hide'>" +
        kids.map(function(k){ return GC.rp(k, depth + 1, r.username); }).join("") + "</div>" : "") +
      "</div>";
  },
  kids(id, node){
    const box = el("kids" + id);
    if(!box) return;
    const wasHidden = box.classList.contains("hide");
    box.classList.toggle("hide", !wasHidden);
    if(node) node.textContent = (wasHidden ? t("gc_kids_hide") : t("gc_kids")) + " " + (node.textContent.match(/\d+/) || [""])[0];
  },
  setTo(id, name){
    GC.parent = id;
    const b = el("gc-rto");
    if(b){
      b.className = "rtochip";
      b.innerHTML = "<span>" + t("gc_reply_to") + " <b>" + esc(name) + "</b></span>" +
        "<i onclick='GC.clearTo()'>✕</i>";
    }
    const ta = el("gc-rep");
    if(ta){ try{ ta.focus(); }catch(e){} }
  },
  clearTo(){
    GC.parent = null;
    const b = el("gc-rto");
    if(b){ b.className = "hide"; b.innerHTML = ""; }
  },
  shareText(sh){
    let o = sh;
    try{ if(typeof sh === "string") o = JSON.parse(sh); }catch(e){}
    if(!o) return "";
    if(o.kind === "chat") return t("gc_shared_chat") + "：" + String(o.text || "").slice(0, 160);
    if(o.kind === "memory") return t("gc_shared_mem") + "：" + String(o.text || "").slice(0, 160);
    if(o.kind === "skill") return t("gc_shared_skill") + "：" + String(o.name || "");
    return t("gc_shared") + "：" + String(o.text || "").slice(0, 160);
  },
  ps(id){
    this.pe();
    this._pid = id;
    const tid = id;
    this._t = setTimeout(function(){ GC._lp = true; GC.menu(tid); }, 600);
  },
  pe(){
    if(this._t){ clearTimeout(this._t); this._t = null; }
  },
  async menu(id){
    const d = await rpc("mrclaw_post_get", { p_id: id, p_user: S.user.name });
    if(!d || !d.post){ Native.toast(t("gc_fail")); return; }
    const post = d.post;
    GC.curPost = post;
    const acts = [];
    if(post.username === S.user.name){
      acts.push({ label: "✏️ " + t("gc_edit"), value: "edit" });
      acts.push({ label: "🗑 " + t("gc_del"), value: "delete", danger: true });
    }
    if(Admin.on()){
      acts.push({ label: post.pinned ? t("gc_unpin") : t("gc_pin"), value: "pin" });
      acts.push({ label: t("gc_takedown"), value: "remove", danger: true });
      acts.push({ label: t("adm_points") + " · " + post.username, value: "pts" });
      acts.push({ label: t("adm_ban") + " · " + post.username, value: "ban" });
    }
    if(!acts.length) return;
    const v = await uiSheet(t("gc_admin_menu") + "《" + String(post.title || "").slice(0, 12) + "》", acts);
    if(v === null) return;
    if(v === "edit"){
      GC.editPost(id);
    } else if(v === "delete"){
      GC.delPost(id);
    } else if(v === "pin"){
      await GC.act(id, post.pinned ? "unpin" : "pin", null);
    } else if(v === "remove"){
      const why = await uiAsk(t("adm_reason") + t("adm_del_note"), "");
      if(why === null) return;
      await GC.act(id, "remove", String(why));
    } else if(v === "pts"){
      try{ Adm.points(post.username); }catch(e){}
    } else if(v === "ban"){
      try{ Adm.ban(post.username, true); }catch(e){}

                 (action === "unpin" ? t("gc_unpinned_ok") :
                  (action === "remove" ? t("gc_removed_ok") : t("gc_restored_ok"))));

  async reply(id){

  setBoard(b){

  async pickPlace(){
    const v = await uiAsk(t("gc_place_q"), GC.cplace || "");
    if(v === null) return;
    GC.cplace = String(v).trim().slice(0, 24);
    const b = el("cm-place");
    if(b){
      b.className = GC.cplace ? "cm-tool on" : "cm-tool";
      b.textContent = GC.cplace ? ("📍 " + GC.cplace) : ("📍 " + t("gc_place"));

  toggleDeclare(){

    }
  },
  async attachShare(){

    const b = el("cm-share");
    if(b){ b.className = "cm-tool on"; b.textContent = "☑ " + t("gc_share_btn"); }
  },
  async publish(){
    if(!S.user){ Native.toast(t("login_first")); return; }
    const te = el("cm-title"), be = el("cm-body");
    const title = (te && te.value ? te.value : "").trim();
    const body = (be && be.value ? be.value : "");
    if(!title){ Native.toast(t("gc_need_title")); return; }
    if(title.length > 40){ Native.toast(t("gc_title_long")); return; }
    const list = Attach.gcList();
    if(list.some(function(f){ return f.up; })){ Native.toast(t("gc_uploading")); return; }
    if(list.some(function(f){ return f.fail; })){ Native.toast(t("gc_file_fail")); return; }
    const atts = Attach.takeGc();
    const media = (GC.editId ? GC.editMedia.slice() : []).concat(atts);
    const pub = el("cm-pub");
    if(pub){ pub.textContent = GC.editId ? t("gc_saving") : t("gc_publishing"); }
    const r = GC.editId
      ? await rpc("mrclaw_post_edit", { p_user: S.user.name, p_id: GC.editId, p_title: title,
          p_body: String(body), p_board: GC.cboard, p_place: GC.cplace, p_declared: GC.cdecl,
          p_media: media })
      : await rpc("mrclaw_post_add", { p_user: S.user.name, p_title: title,
          p_body: String(body), p_media: media, p_share: GC.cshare, p_board: GC.cboard,
          p_place: GC.cplace, p_declared: GC.cdecl });
    if(pub){ pub.textContent = GC.editId ? t("save") : t("gc_publish"); }
    if(!r || r.__err || r.err){
      Native.toast(t("gc_fail") + " " + (r && (r.err || r.__err) ? String(r.err || r.__err) : ""));
      return;
    }
    if(GC.editId){
      const eid = GC.editId;
      Native.toast(t("gc_saved"));
      GC.editId = null; GC.editMedia = [];
      Guide.close();
      GC.open(eid);
      return;
    }
    Native.toast(t("gc_posted"));
    GC.cplace = ""; GC.cdecl = false; GC.cshare = null;
    Guide.close();
    GC.mine = false; GC.board = ""; GC.render();
  }
};

const BC = {

    });

  show(text, speed){

    const i = el("bc-in");
    i.textContent = s;
    const base = Math.max(12, s.length * 0.28);
    const dur = Math.max(8, base * (60 / (speed > 0 ? speed : 60)));
    i.style.animationDuration = dur.toFixed(1) + "s";
    el("bc").classList.remove("hide");
  },
  hide(){ el("bc").classList.add("hide"); }
};

const WMO = {0:"晴",1:"晴间多云",2:"多云",3:"阴",45:"有雾",48:"雾凇",51:"小毛毛雨",53:"毛毛雨",
  55:"大毛毛雨",56:"冻毛毛雨",57:"强冻毛毛雨",61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"强冻雨",

  86:"大阵雪",95:"雷阵雨",96:"雷阵雨伴小冰雹",99:"雷阵雨伴大冰雹"};
const Save = {
  find(id){
    let f = null;
    try{ S.convs.some(function(c){ return (c.msgs || []).some(function(m){ if(m._file && m._file.id === id){ f = m._file; return true; } return false; }); }); }catch(e){}
    return f;
  },
  bytes(id){
    const f = Save.find(id); if(!f) return "";
    return String(f.url).split(",")[1] || "";
  },
  byId(id){
    const f = Save.find(id); if(!f) return;
    if(native && native.saveFile){
      let r = "";
      try{ r = String(native.saveFile(f.name, Save.bytes(id))); }catch(e){ r = "ERR:" + e; }
      if(r.indexOf("OK") === 0){ Native.toast((LANG === "en" ? "Saved to Downloads: " : "已存到手机「下载」目录：") + f.name); return; }
    }
    Save.copy(id);
  },
  open(id){
    const f = Save.find(id); if(!f) return;
    const mime = String(WebTools.mimeOf(f.name)).split(";")[0];
    if(native && native.saveFile){
      let r = "";
      try{ r = String(native.saveFile(f.name, Save.bytes(id))); }catch(e){ r = "ERR:" + e; }
      if(r.indexOf("OK:") === 0){
        const uri = r.slice(3);
        if(native.openFile){
          try{ native.openFile(uri, mime); Native.toast(LANG === "en" ? "Opening… (saved to Downloads)" : "正在打开…（已存到「下载」）"); return; }catch(e){}
        }
        Native.toast(LANG === "en" ? "Saved to Downloads" : "已存到「下载」目录");
        return;
      }
    }
    Save.copy(id);
  },
  copy(id){
    const b = Save.bytes(id); if(!b) return;
    try{
      const txt = decodeURIComponent(escape(atob(b)));
      const ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.left = "-9999px";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      Native.toast(LANG === "en" ? "Copied to clipboard" : "已复制到剪贴板，可粘贴到任意地方");
    }catch(e){ Native.toast(LANG === "en" ? "Copy failed" : "复制失败"); }
  }
};
const WebTools = {
  time(){
    const d = new Date();
    const p = x => (x < 10 ? "0" : "") + x;
    const wd = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
    return "当前时间：" + d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) +
           " " + p(d.getHours()) + ":" + p(d.getMinutes()) + " " + wd + "（北京时间 UTC+8，时区 " +
           (try0(function(){ return Intl.DateTimeFormat().resolvedOptions().timeZone; }) || "本地") + "）";
  },
  get(url, cb){
    httpReq("GET", url, { "Accept": "application/json,text/plain,text/html,*/*" }, "").then(function(raw){
      if(raw && String(raw).indexOf("ERR:") === 0){ cb(String(raw).slice(0, 160)); return; }
      cb(null, String(raw == null ? "" : raw));
    }).catch(function(e){ cb(String((e && e.message) || e).slice(0, 160)); });
  },
  strip(txt){
    return String(txt || "")
      .replace(/<script[\s\S]*?<\/script>/gi, " ").replace(/<style[\s\S]*?<\/style>/gi, " ")
      .replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, "\"")
      .replace(/[ \t\r]+/g, " ").replace(/\n{2,}/g, "\n").trim();
  },
  fetchUrl(url, max, cb){
    const u = String(url || "").trim();
    if(!/^https?:\/\//i.test(u)){ cb("网址必须以 http:// 或 https:// 开头"); return; }
    const lim = Math.max(200, Math.min(Number(max) || 3000, 8000));
    WebTools.get(u, function(err, raw){
      if(err){ cb("抓取失败：" + err); return; }
      const txt = WebTools.strip(raw);
      if(!txt){ cb("页面没有可读文本（可能是纯脚本页面）"); return; }
      cb(txt.slice(0, lim));
    });
  },
  mimeOf(nm){
    const n = String(nm || "").toLowerCase();
    if(n.endsWith(".csv")) return "text/csv;charset=utf-8";
    if(n.endsWith(".json")) return "application/json;charset=utf-8";
    if(n.endsWith(".html") || n.endsWith(".htm")) return "text/html;charset=utf-8";
    if(n.endsWith(".md")) return "text/markdown;charset=utf-8";
    if(n.endsWith(".svg")) return "image/svg+xml;charset=utf-8";
    if(n.endsWith(".xml")) return "application/xml;charset=utf-8";
    if(n.endsWith(".js")) return "text/javascript;charset=utf-8";
    if(n.endsWith(".css")) return "text/css;charset=utf-8";
    if(n.endsWith(".py")) return "text/x-python;charset=utf-8";
    return "text/plain;charset=utf-8";
  },
  makeFile(name, content, cb){
    try{
      let nm = String(name || "MRClaw-文件.txt").replace(/[\\/:*?"<>|]/g, "_").trim() || "MRClaw-文件.txt";
      let body = String(content == null ? "" : content);
      if(!body){ cb(LANG === "en" ? "Empty content." : "内容为空，没东西可写。"); return; }
      if(body.length > 200000){ cb(LANG === "en" ? "File too large for chat." : "文件太大（超 20 万字符），请改用 write_file 存到手机里。"); return; }
      if(!/\.[a-z0-9]{1,5}$/i.test(nm)) nm += ".txt";
      if(/\.csv$/i.test(nm) && body.charCodeAt(0) !== 0xFEFF) body = "\uFEFF" + body;
      const url = "data:" + WebTools.mimeOf(nm) + ";base64," + btoa(unescape(encodeURIComponent(body)));
      const c = Chat.cur();
      c.msgs.push({ role:"assistant", content:"", _file:{ id:"f" + Date.now() + Math.floor(Math.random()*1000), name:nm, url:url, size:body.length } });
      saveConvs(); Chat.render();
      cb((LANG === "en" ? "File ready: " : "文件已生成：") + nm + (LANG === "en" ? " (tap the button to download)" : "（点消息里的按钮下载）"));
    }catch(e){ cb((LANG === "en" ? "Failed: " : "生成文件失败：") + e); }
  },
  sendImage(src, caption, cb){
    let url = String(src || "").trim();
    if(!url){ cb(LANG === "en" ? "No image source." : "缺少图片地址（source）。"); return; }
    if(/^(screen|截图|当前屏幕)$/i.test(url)){
      if(!(native && native.screenshot)){ cb(LANG === "en" ? "(this version cannot capture the screen)" : "（当前版本不支持截图）"); return; }
      let b = "";
      try{ b = String(native.screenshot() || ""); }catch(e){ b = ""; }
      if(!b){ cb(LANG === "en" ? "(screenshot failed)" : "（截图失败）"); return; }
      url = "data:image/jpeg;base64," + b;
    }
    if(!/^(https?:\/\/|data:image\/)/i.test(url)){ cb(LANG === "en" ? "Image URL must start with http(s):// or data:image/" : "图片地址必须以 http(s):// 或 data:image/ 开头"); return; }
    const c = Chat.cur();
    c.msgs.push({ role:"assistant", content:String(caption || ""), _img:{ url:url } });
    saveConvs(); Chat.render();
    cb((LANG === "en" ? "Image sent" : "图片已发送") + (caption ? ("：" + caption) : ""));
  },
  weather(city, cb){
    const c = String(city || "").trim();
    if(!c){ cb("缺少城市名，请先告诉我要查哪个城市"); return; }
    const wttr = function(){
      WebTools.get("https://wttr.in/" + encodeURIComponent(c) + "?format=j1&lang=zh", function(err, raw){
        if(err){ cb("天气查询失败：" + err); return; }
        let j = null;
        try{ j = JSON.parse(raw); }catch(e){}
        if(!j || !j.current_condition){ cb("天气查询失败：没拿到数据（城市名可能无法识别）"); return; }
        const cc = j.current_condition[0];
        const ar = (j.nearest_area && j.nearest_area[0]) || {};
        const nm = (ar.areaName && ar.areaName[0] && ar.areaName[0].value) || c;
        const desc = (cc.lang_zh && cc.lang_zh[0] && cc.lang_zh[0].value) || (cc.weatherDesc && cc.weatherDesc[0] && cc.weatherDesc[0].value) || "";
        let d = "";
        (j.weather || []).slice(0, 2).forEach(function(w, i){
          const h = (w.hourly && w.hourly[4]) || {};
          const hd = (h.lang_zh && h.lang_zh[0] && h.lang_zh[0].value) ||
                     (h.weatherDesc && h.weatherDesc[0] && h.weatherDesc[0].value) || "";
          d += (i ? " / " : "") + (i ? "明天" : "今天") + "：" + hd + " " + w.mintempC + "~" + w.maxtempC + "℃";
        });
        cb(nm + "｜当前：" + desc + "，" + cc.temp_C + "℃（体感 " + cc.FeelsLikeC + "℃），湿度 " +
           cc.humidity + "%，风 " + (cc.windspeedKmph || "-") + "km/h\n" + d + "\n（数据来源 wttr.in）");
      });
    };
    WebTools.get("https://geocoding-api.open-meteo.com/v1/search?count=1&language=zh&format=json&name=" +
                 encodeURIComponent(c), function(err, raw){
      if(err){ wttr(); return; }
      let g = null;
      try{ g = JSON.parse(raw); }catch(e){}
      const r0 = g && g.results && g.results[0];
      if(!r0){ wttr(); return; }
      const url = "https://api.open-meteo.com/v1/forecast?latitude=" + r0.latitude + "&longitude=" + r0.longitude +
        "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
        "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
        "&timezone=Asia%2FShanghai&forecast_days=2";
      WebTools.get(url, function(e2, r2){
        if(e2){ wttr(); return; }
        let j = null;
        try{ j = JSON.parse(r2); }catch(e){}
        if(!j || !j.current){ wttr(); return; }
        const cur = j.current, dd = j.daily || {};
        const codes = dd.weather_code || [], lo = dd.temperature_2m_min || [],
              hi = dd.temperature_2m_max || [], pp = dd.precipitation_probability_max || [];
        let d = "";
        for(let i = 0; i < codes.length && i < 2; i++){
          d += (i ? " / " : "") + (i ? "明天" : "今天") + "：" + (WMO[codes[i]] || ("代码" + codes[i])) +
               " " + lo[i] + "~" + hi[i] + "℃·降水概率 " + (pp[i] == null ? "-" : pp[i]) + "%";
        }
        cb((r0.name || c) + (r0.admin1 ? "（" + r0.admin1 + "）" : "") + "｜当前：" +
           (WMO[cur.weather_code] || ("代码" + cur.weather_code)) + "，" + cur.temperature_2m +
           "℃（体感 " + cur.apparent_temperature + "℃），湿度 " + cur.relative_humidity_2m +
           "%，风速 " + cur.wind_speed_10m + "km/h\n" + d + "\n（数据来源 open-meteo）");
      });
    });
  }
};

  load(){
    if(el("sup").classList.contains("hide")) return;
    rpc("mrclaw_support_list", { p_user: S.user.name }).then(function(a){
      if(Array.isArray(a)){ Support.msgs = a; Support.render(a); }
    });
  },
  render(a){
    const box = el("sup-list");
    if(!box) return;
    let h = "";
    if(!a.length) h = "<div class='empty'>" + t("support_empty") + "</div>";
    a.forEach(function(m){
      const isAdm = (m.sender !== "user");
      h += "<div class='smsg " + (m.sender === "user" ? "me" : "op") + "'>" +
        (isAdm ? "<div class='snm'>" + nameBadge(ADMIN_NAME) + "</div>" : "") +
        linkify(esc(m.body)) + Attach.html(m.attach) +
        "<div class='stime'>" + esc(fmtDT(m.created_at)) + "</div></div>";
    });
    box.innerHTML = h;
    box.scrollTop = box.scrollHeight;
  },
  send(){
    const i = el("sup-in");
    const v = String(i.value || "").trim();
    const atts = Attach.takeSup();
    if(!v && !atts.length) return;
    i.value = "";
    Support.msgs = Support.msgs.concat([{ sender:"user", body:v, attach:atts,
                                          created_at:new Date().toISOString() }]);
    Support.render(Support.msgs);
    rpc("mrclaw_support_send", { p_user: S.user.name, p_body: v, p_attach: atts }).then(function(r){
      if(r && r.__err){ Native.toast(t("support_fail")); return; }
      Support.load();
    });
  }
};

/* ================= 系统回调 ================= */
window.MR_onChunk = function(id, x){ Chat.onChunk(id, x); };
window.MR_onDone  = function(id, x){ Chat.onDone(id, x); };
window.MR_onError = function(id, x){ Chat.onError(id, x); };
window.MR_agent   = function(s){ Chat.agentEvent(s); };
window.MR_onBack = function(){
  if(!el("sup").classList.contains("hide")){ Support.close(); return true; }
  if(!el("redeem").classList.contains("hide")){ Redeem.close(); return true; }
  if(!el("drawer").classList.contains("hide")){ Conv.close(); return true; }
  if(!el("dlg").classList.contains("hide")){ uiClose(null); return true; }
  if(!el("guide").classList.contains("hide")){ Guide.close(); return true; }
  if(!el("app").classList.contains("hide")){
    if(S.tab !== "chat"){ App.tab("chat"); return true; }
    return false;
  }
  return true;
};

  el("a-user").placeholder = tb("user_ph");

/* ================= 启动 ================= */
el("ta").addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
  Chat.syncSendBtn();
});
el("ta").addEventListener("focus", function(){
  if(!S.user){ this.blur(); Chat.openLoginGate(); }
});
el("send").addEventListener("click", function(){ Chat.send(); });

(function boot(){
  applyTheme();
  if(native && native.setLang) { try{ native.setLang(LANG); }catch(e){} }
  loadUserData();
  if(S.cfg.taskMode === undefined){ S.cfg.taskMode = true; saveCfg(); }
  paintStatic();
  if(S.user){
    el("auth").classList.add("hide");
    el("app").classList.remove("hide");
    Cloud.pull(S.user.name);
    Acc.refresh();
    App.tab("chat");
  } else {
    Auth.tab("reg");
  }
  setTimeout(function(){ Upd.check(); }, 1200);
  setTimeout(function(){
    if(!capOk()){ try{ Upd.noBridge(); }catch(e){} }
  }, 3500);
  try{ BC.start(); }catch(e){}
  setTimeout(function(){ try{ SupUnread.load(); }catch(e){} } , 2500);
  setTimeout(function(){ try{ Admin.check(); }catch(e){} }, 1800);
  setTimeout(function(){ try{ Notice.load(); }catch(e){} }, 3000);
  setInterval(function(){ if(!document.hidden && S.user){ try{ Notice.load(); }catch(e){} } }, 60000);
  setInterval(function(){ if(!document.hidden && S.user){ try{ SupUnread.load(); }catch(e){} } }, 30000);
  setInterval(function(){
    if(document.hidden || !S.user) return;
    Acc.refresh();
  }, 20000);
})();
</script>
