<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>MRClaw</title>
<style>
:root{
  --bg:#0E1116; --panel:#151A21; --panel2:#11161C; --border:#232A34;
  --fg:#E7ECF3; --muted:#7C8798; --muted2:#6E7A8C; --inp:#0F1319;
  --line:#1F242C; --msg:#1A2028; --chip:#1A212B; --accent:#2F6BFF;
  --tip-bg:#1A2230; --tip-bd:#26364F; --tip-fg:#8FB4FF;
  --ghost-bg:#1B2029; --ghost-bd:#2A313D; --ghost-fg:#C9D3E0;
  --danger-bg:#2A1519; --danger-bd:#40202A; --danger-fg:#FF7A8A;
  --mask:rgba(6,9,13,.62); --sw:#2A313D;
}
body.light{
  --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#FFFFFF; --border:#E3E8EF;
  --fg:#1B2330; --muted:#6B7688; --muted2:#7B8697; --inp:#F7F9FC;
  --line:#E9EDF3; --msg:#F1F4F9; --chip:#FFFFFF; --accent:#2F6BFF;
  --tip-bg:#EAF1FF; --tip-bd:#C7D9FF; --tip-fg:#2A62D6;
  --ghost-bg:#FFFFFF; --ghost-bd:#DFE5EE; --ghost-fg:#3C4759;
  --danger-bg:#FDECEF; --danger-bd:#F5C9D1; --danger-fg:#D0394F;
  --mask:rgba(30,38,50,.35); --sw:#D7DEE8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overscroll-behavior:none}
#root{height:100%;display:flex;flex-direction:column}
.hide{display:none!important}
button,input,textarea,select{font:inherit;color:inherit;outline:none;border:none;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;
  width:100%;transition:.15s}
.btn:active{transform:scale(.98);opacity:.88}
.btn.ghost{background:var(--ghost-bg);border:1px solid var(--ghost-bd);color:var(--ghost-fg)}
.btn.mini{min-height:38px;width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.btn.danger{background:var(--danger-bg);color:var(--danger-fg);border:1px solid var(--danger-bd)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.muted{color:var(--muted);font-size:13px}
.tiny{font-size:12px;color:var(--muted2)}
label.f{display:block;margin:14px 0 6px;font-size:13px;color:var(--muted)}
.inp{width:100%;background:var(--inp);border:1px solid var(--ghost-bd);border-radius:12px;
  padding:13px 14px;color:var(--fg)}
.inp:focus{border-color:var(--accent)}
.mask{-webkit-text-security:disc;text-security:disc}
.lnk{color:#4C8BFF;text-decoration:underline;word-break:break-all}
.reddot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF3B4E;
  margin-left:4px;vertical-align:top}
.gcard{background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:14px;margin:10px 12px}
.gcard h4{margin:0 0 6px;font-size:15.5px}
.gcard.pin{border-color:#4A3A12;background:linear-gradient(180deg,rgba(255,196,0,.07),transparent 60%)}
.offbadge{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
  margin-left:5px;border-radius:50%;vertical-align:-2px;flex:0 0 15px;
  background:linear-gradient(140deg,#4F8BFF 0%,#2F6BFF 45%,#12C2E9 100%);
  box-shadow:0 1px 4px rgba(47,107,255,.45),inset 0 1px 0 rgba(255,255,255,.45)}
.offbadge svg{width:10px;height:10px;display:block}
.offbadge svg path{fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.oldm{display:flex;gap:8px;flex-wrap:wrap;padding:2px 14px 8px}
.oldm .om{position:relative}
.oldm .om img{width:66px;height:66px;object-fit:cover;border-radius:10px;display:block}
.oldm .om i{position:absolute;top:-6px;right:-6px;background:var(--danger-bg);color:var(--danger-fg);
  border:1px solid var(--danger-bd);border-radius:50%;width:20px;height:20px;line-height:18px;
  text-align:center;font-size:11px;font-style:normal;cursor:pointer}
.rp{border-left:3px solid var(--bd2)}
.rp .gcard{border:0;background:transparent;padding:8px 0 2px}
.rto{color:var(--tip-fg);font-size:12px}
.kbtn{color:var(--tip-fg)}
.kids{margin-top:2px}
.rtochip{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--tip-bg);border:1px solid var(--tip-bd);color:var(--tip-fg);
  border-radius:10px;padding:7px 11px;font-size:12.5px;margin-bottom:9px}
.rtochip i{cursor:pointer;font-style:normal;opacity:.85;padding:0 3px}
.pinbadge{font-size:11px;padding:2px 7px;border-radius:8px;border:1px solid var(--tip-bd);
  background:var(--tip-bg);color:var(--tip-fg);margin-right:6px;white-space:nowrap}
.gcard .gm{font-size:12px;color:var(--muted2);margin-bottom:6px}
.gcard p{margin:0;color:var(--muted);font-size:14px;white-space:pre-wrap}
.gbar{display:flex;gap:6px;margin-top:8px;font-size:13px;color:var(--muted2);
  flex-wrap:wrap;align-items:center}
.gbar span{cursor:pointer;padding:9px 8px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--border);line-height:1.1}
.gbar .on{color:#FF6A8A}
.gmedia{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gmedia img{max-width:104px;max-height:104px;border-radius:10px}
.gmedia video{max-width:150px;border-radius:10px}
.gmedia a{font-size:12px;color:var(--tip-fg);border:1px solid var(--tip-bd);
  background:var(--tip-bg);border-radius:9px;padding:5px 9px}
.gshare{background:var(--panel2);border:1px dashed var(--border);border-radius:12px;
  padding:10px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.gsearch{display:flex;gap:8px;padding:12px 12px 4px}
.gsearch input{flex:1}
.cm{background:var(--bg);border-radius:0;padding:0 0 30px;min-height:100vh}
.cmbar{display:flex;align-items:center;justify-content:space-between;gap:9px;
  padding:12px 14px;border-bottom:1px solid var(--line)}
.cmbar b{font-size:16px}
.cm-hint{font-size:12.5px;color:var(--muted2);padding:12px 16px 2px}
.cm-title{width:100%;box-sizing:border-box;font-size:19px;font-weight:600;background:transparent;
  border:0;outline:none;color:var(--fg);padding:8px 16px}
.cm-title::placeholder{color:var(--muted2);font-weight:400}
.cm-body{width:100%;box-sizing:border-box;min-height:170px;background:transparent;border:0;
  outline:none;color:var(--fg);font-size:15px;line-height:1.65;padding:6px 16px;resize:none;font-family:inherit}
.cm-body::placeholder{color:var(--muted2)}
.cm-tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line)}
.cm-tool{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:9px 13px;color:var(--muted);font-size:13.5px}
.cm-tool.on{color:var(--tip-fg);border-color:var(--tip-bd);background:var(--tip-bg)}
.cm-sec{font-size:12.5px;color:var(--muted2);padding:14px 16px 6px}
.gbo{border:1px solid var(--border);background:var(--panel);color:var(--muted);
  border-radius:11px;padding:7px 12px;font-size:13px}
.gbo.act{color:var(--tip-fg);border-color:var(--tip-bd);background:var(--tip-bg)}
.nlist{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;margin:10px 12px}
.nlist.unread{border-color:var(--tip-bd);background:var(--tip-bg)}
.nlist .nt{font-size:14px}
.nlist .nm{font-size:11.5px;color:var(--muted2);margin-top:4px}
.seg{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--border);
  border-radius:12px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13.5px}
.seg button.act{background:var(--accent);color:#fff}
.sw{width:48px;height:28px;border-radius:14px;background:var(--sw);position:relative;
  flex:0 0 48px;transition:.2s}
.sw.on{background:var(--accent)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:.2s}
.sw.on i{left:23px}
#auth{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 26px;overflow-y:auto}
.logo{text-align:center;margin-bottom:26px}
.logo b{font-size:30px;letter-spacing:1px}
.logo span{display:block;color:var(--muted2);font-size:12px;margin-top:6px;letter-spacing:3px}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
  padding-top:calc(14px + env(safe-area-inset-top))}
#top b{font-size:17px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#nav{display:flex;border-top:1px solid var(--line);background:var(--panel2);
  padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:9px 0 11px;color:var(--muted);font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
#nav button.act{color:var(--accent)}
#nav b{font-size:19px;font-weight:400}
#msgs{padding:10px 14px 6px}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;margin:7px 0;
  white-space:pre-wrap;word-break:break-word}
.msg.u{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.msg.a{background:var(--msg);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg.sys{background:transparent;color:var(--muted2);font-size:12px;text-align:center;
  margin:10px auto;max-width:100%}
.ahead{margin-bottom:7px;font-size:12px}
.ahead .run{color:var(--tip-fg)}
.ahead .ok{color:#3AAE6A}
.ahead .warn{color:#D3920F}
.ahead .bad{color:#D0394F}
/* === 输出动效 & 质感增强（2026-10-07） === */
@keyframes dotPulse{0%,80%,100%{opacity:.22;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sheen{0%{background-position:-160% 0}100%{background-position:260% 0}}
.msg.a{background:linear-gradient(180deg,var(--msg),var(--panel2));box-shadow:0 6px 18px -14px rgba(0,0,0,.55)}
.msg.u{background:linear-gradient(135deg,#3B77FF,#2F6BFF 55%,#12A7E9);box-shadow:0 8px 20px -14px rgba(47,107,255,.9)}
.caret{display:inline-block;width:8px;height:1.05em;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--accent);animation:caretBlink 1s steps(1) infinite}
.dots{display:inline-flex;gap:4px;align-items:center;padding:2px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--tip-fg);animation:dotPulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
.msg.a.streaming{position:relative;overflow:hidden}
.msg.a.streaming::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 32%,rgba(90,140,255,.10) 50%,transparent 68%);background-size:220% 100%;animation:sheen 1.7s linear infinite}
/* === 聊天 UI 升级：头像 + 气泡 + 输入条（2026-10-07） === */
#msgs{padding:12px 12px 8px}
.mline{display:flex;align-items:flex-end;gap:8px;margin:11px 0}
.mline.u{flex-direction:row-reverse}
.mline.sys{display:block}
.av{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.5px;user-select:none}
.av.a{background:linear-gradient(140deg,#3B77FF,#12A7E9);color:#fff;box-shadow:0 4px 12px -6px rgba(47,107,255,.9)}
.av.u{background:var(--ghost-bg);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600}
.msg{max-width:76%;padding:10px 14px;border-radius:18px;margin:0;line-height:1.62}
.msg.u{border-bottom-right-radius:6px}
.msg.a{border-bottom-left-radius:6px}
.msg a{color:var(--tip-fg)}
.msg pre{background:var(--inp);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:6px 0;overflow:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--chip);border-radius:6px;padding:1px 5px;font-size:13px}
.mline .msg.a .ahead{margin-bottom:6px}
.mchip{display:inline-block;font-size:10px;line-height:1;padding:2px 6px;border-radius:6px;margin-right:6px;background:rgba(125,125,150,.18);color:#9aa4b2;vertical-align:middle}
.think{margin:2px 0 6px;font-size:12px;color:#9aa4b2}
.think summary{cursor:pointer;outline:none;opacity:.85}
.think .tk{white-space:pre-wrap;line-height:1.5;background:rgba(125,125,150,.10);border-radius:8px;padding:6px 8px;margin-top:4px;max-height:220px;overflow:auto}
.tstep{display:flex;gap:6px;align-items:flex-start;margin:3px 0;white-space:normal}
.tstep b{flex:0 0 auto;font-weight:600;color:#7db2ff;background:rgba(90,160,255,.14);border-radius:6px;padding:1px 6px;font-size:11px}
.tstep span{flex:1;color:#aab4c4}
.afile a{display:inline-block;padding:6px 10px;border-radius:8px;background:rgba(90,160,255,.16);color:#7db2ff;text-decoration:none}
.aimg img{max-width:100%;border-radius:8px;display:block;margin:2px 0}
.fbtn{display:inline-block;padding:5px 9px;border-radius:8px;background:rgba(125,125,150,.18);color:#cfd6e2;font-size:12px;margin-left:6px;cursor:pointer}
.fname{font-size:13px;color:#dfe5ee;margin-right:4px}
.qgrid{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px}
.qbtn{display:inline-block;padding:8px 12px;border-radius:10px;background:rgba(125,125,150,.16);color:#dfe5ee;font-size:13px;cursor:pointer}
.qclose{text-align:center;padding:8px;color:#9aa4b2;cursor:pointer}
.spk,.cost{margin-left:38px}
body{background:radial-gradient(1100px 520px at 50% -12%,rgba(47,107,255,.10),transparent 62%),var(--bg)}
#macro-panel{position:fixed;left:12px;right:12px;bottom:96px;z-index:70;max-height:62vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px 12px 6px;box-shadow:0 14px 44px rgba(0,0,0,.28)}
#quick-panel{position:fixed;left:12px;right:12px;bottom:96px;z-index:70;max-height:62vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:10px 12px 6px;box-shadow:0 14px 44px rgba(0,0,0,.28)}
#quick-panel.hide{display:none}
#macro-panel.hide{display:none}
.mp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mp-actions{display:flex;gap:8px;margin-bottom:8px}
.mp-actions .btn.mini,.mp-ops .btn.mini{width:auto}
.mp-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--line)}
.mp-row:first-child{border-top:0}
.mp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-ops{display:flex;gap:6px;flex:0 0 auto}
.mp-empty{padding:10px 2px}
#agentbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 12px 8px;padding:9px 14px;border-radius:12px;font-size:13px;
  background:var(--tip-bg);border:1px solid var(--tip-bd);color:var(--tip-fg)}
#agentbar .btn.mini{width:auto;flex:0 0 auto}
#bar{padding:8px 12px 10px;border-top:1px solid var(--line);background:var(--panel2)}
.barline{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
#toolrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
#pts-chip{font-size:12px;color:var(--muted2);padding:4px 9px;border-radius:9px;background:rgba(125,125,150,.13);white-space:nowrap}
.tb2{font-size:12px;padding:7px 10px}
#chips,.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--chip);
  border:1px solid var(--ghost-bd);border-radius:10px;padding:5px 8px;font-size:11.5px;
  max-width:48%}
.chip img{width:26px;height:26px;max-width:26px;max-height:26px;object-fit:cover;
  border-radius:6px;flex:0 0 26px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.chip i{cursor:pointer;font-style:normal;color:var(--muted)}
.att{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.att img{max-width:170px;max-height:170px;border-radius:10px;display:block}
.att img,.gmedia img,.chip img,.sup-list img{max-width:100%}
.att a{font-size:12px;color:var(--tip-fg);border:1px solid var(--tip-bd);
  background:var(--tip-bg);border-radius:9px;padding:5px 9px;text-decoration:none}
.att .up{opacity:.55}
#toolrow .btn.mini{width:auto;font-size:12px;padding:5px 10px;border-radius:9px;white-space:nowrap}
#bar textarea{flex:1;background:var(--inp);border:1px solid var(--ghost-bd);border-radius:22px;
  padding:12px 16px;max-height:130px;resize:none;color:var(--fg);transition:border-color .15s,box-shadow .15s}
#bar textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
#send{background:var(--accent);color:#fff;border-radius:22px;width:46px;height:44px;
  font-size:18px;flex:0 0 46px;box-shadow:0 6px 16px -9px rgba(47,107,255,.95)}
#send.off{background:var(--chip);color:var(--muted)}
.toolbtn{background:var(--chip);border:1px solid var(--ghost-bd);color:var(--ghost-fg);
  border-radius:14px;width:44px;height:44px;flex:0 0 44px;font-size:17px}
.toolbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.skbar{padding:12px 12px 4px}
.cats{display:flex;gap:8px;flex-wrap:wrap;overflow-x:auto;padding:8px 12px 4px;
  -webkit-overflow-scrolling:touch}
.cats .cat{flex:0 0 auto;background:var(--panel);border:1px solid var(--border);
  color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13px}
.cats .cat.act{background:var(--accent);border-color:var(--accent);color:#fff}
.cats .cat i{font-style:normal;opacity:.7;font-size:11.5px}
.scard{display:flex;align-items:center;gap:12px;background:var(--panel);
  border:1px solid var(--border);border-radius:16px;padding:14px;margin:10px 12px}
.scard:active{background:var(--panel2)}
.sic{width:42px;height:42px;border-radius:12px;background:var(--panel2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:20px;flex:0 0 42px}
.stx{flex:1;min-width:0}
.sn{font-size:14.5px;font-weight:600;margin-bottom:3px}
.sd{font-size:12.5px;color:var(--muted)}
.tagmini{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:400;
  color:var(--tip-fg);background:var(--tip-bg);border:1px solid var(--tip-bd);
  border-radius:5px;padding:0 5px}
.cost{font-size:11.5px;color:var(--muted2);margin:-4px 0 8px}
.spk{text-align:left;margin:-2px 0 8px}
.spk span{font-size:11.5px;color:var(--muted2);border:1px solid var(--border);
  border-radius:8px;padding:2px 9px;background:var(--panel)}
.item{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:13px 14px;margin:10px 12px}
.item h4{margin:0 0 6px;font-size:14.5px}
.item p{margin:0;color:var(--muted);font-size:12.5px;white-space:pre-wrap}
.hd{padding:14px 16px 4px;font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted2);font-size:13px;padding:40px 20px}
#updbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:10px 12px 0;padding:10px 14px;border-radius:12px;font-size:13.5px;
  background:var(--tip-bg);border:1px solid var(--tip-bd);color:var(--tip-fg)}
#updbar .btn.mini{flex:0 0 auto}
#bc{overflow:hidden;background:var(--tip-bg);border-bottom:1px solid var(--tip-bd);padding:7px 0}

@keyframes bcroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#rv{position:fixed;inset:0;background:var(--mask);z-index:62;display:flex;
  align-items:center;justify-content:center;padding:20px}
.rvbox{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);

.rvbox .rvsub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.stwrap{position:relative;width:34px;height:36px;font-size:32px;line-height:36px}
.stbg{position:absolute;left:0;top:0;color:var(--sw);width:34px;overflow:hidden}
.stfill{position:absolute;left:0;top:0;color:#FFC46D;width:34px;overflow:hidden;white-space:nowrap}
.stwrap .hit{position:absolute;top:0;height:100%;width:50%}
.stwrap .hit.l{left:0}
.stwrap .hit.r{right:0}
.rvscore{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}
.anonrow{display:flex;align-items:center;gap:10px;margin:12px 0}
.anonrow input{width:18px;height:18px}
#guide{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.gwrap{max-width:520px;margin:0 auto;padding:28px 22px 48px}
.gt{margin-bottom:20px}
.gt b{display:block;font-size:19px}
.gt span{color:var(--muted);font-size:12.5px}
.glist{margin-top:6px}
.gitem{display:flex;align-items:center;gap:12px;background:var(--panel);

.gn{font-size:14.5px;font-weight:600;margin-bottom:3px}
.gok{display:inline-block;margin-left:8px;font-size:11px;font-weight:400;

  border-radius:6px;padding:1px 7px}
#drawer{position:fixed;inset:0;z-index:55}
.dmask{position:absolute;inset:0;background:var(--mask)}
.dpanel{position:absolute;top:0;left:0;bottom:0;width:80%;max-width:340px;

.dhead{padding:0 16px 12px;display:flex;justify-content:space-between;align-items:center}
.citem{padding:13px 16px;border-bottom:1px solid var(--line);transition:.12s}
.citem.act{background:var(--chip)}
.citem .cn{font-size:14.5px;margin-bottom:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.citem .cd{font-size:11.5px;color:var(--muted2)}
.mbtn{background:var(--chip);border:1px solid var(--ghost-bd);color:var(--ghost-fg);

#dlg{position:fixed;inset:0;background:var(--mask);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:24px}
.dbox{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);
  border-radius:18px;padding:20px;max-height:calc(100vh - 48px);
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.dbox.fix{display:flex;flex-direction:column;overflow:hidden}
.nscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  margin:2px -6px 0;padding:0 6px}
.nfoot{flex:0 0 auto;padding-top:14px}
.dtitle{font-size:15px;font-weight:600;margin-bottom:14px}
#redeem,#sup{position:fixed;inset:0;background:var(--bg);z-index:58;
  display:flex;flex-direction:column}
#ban{position:fixed;inset:0;background:var(--bg);z-index:70;display:none;
  align-items:center;justify-content:center;padding:30px}
#ban.on{display:flex}
.banbox{max-width:420px;width:100%;text-align:center}
.banbox .bt{font-size:19px;font-weight:700;margin-bottom:10px}

.sup-top{display:flex;align-items:center;gap:10px;

.sup-bar input{flex:1;background:var(--inp);border:1px solid var(--ghost-bd);

.smsg.me{background:var(--accent);color:#fff;margin-left:auto}

/* ---------------- 异步网络 ---------------- */
let _httpSeq = 0;
const _httpWait = {};
function httpReq(method, url, headersObj, bodyStr){
  return new Promise(function(res){
    if(!native || !native.httpAsync){
      res(Native.http(method, url, JSON.stringify(headersObj||{}), bodyStr||""));
      return;
    }
    const id = "h" + (++_httpSeq);
    let done = false;
    let timer = null;
    function finish(x){
      if(done) return;
      done = true;
      if(timer) clearTimeout(timer);
      delete _httpWait[id];
      res(x);
    }
    timer = setTimeout(function(){ finish("ERR:Timeout"); }, 40000);
    _httpWait[id] = finish;
    native.httpAsync(id, method, url, JSON.stringify(headersObj||{}), bodyStr||"");
  });
}
window.MR_onHttp = function(id, text){
  const f = _httpWait[id];
  if(f) f(text);
};

function rpc(fn, args){
  return httpReq("POST", SB_URL + "/rest/v1/rpc/" + fn,
    { "apikey": SB_KEY, "Authorization": BEARER + SB_KEY, "Content-Type": "application/json" },
    JSON.stringify(args || {})
  ).then(function(raw){
    if(raw && String(raw).indexOf("ERR:") === 0) return { __err: String(raw) };
    const v = (raw === null || raw === undefined) ? "" : String(raw).trim();
    // 空响应 = 数据库里 RETURNS void 的接口，调用就是成功的（以前返回 null 会被误判为失败）
    if(v === "") return { ok: true };
    try {
      const o = JSON.parse(v);
      if(o && typeof o === "object" && !Array.isArray(o) &&
         (o.message !== undefined || o.error !== undefined || o.code !== undefined) &&
         o.ok === undefined && o.points === undefined && o.id === undefined && o.username === undefined){
        return { __err: String(o.message || o.error || o.code) };
      }
      return o;
    } catch(e){ return { __err: "parse:" + v.slice(0,120) }; }
  });

/* 完整日期时间：2026-09-24 12:17 */
function fmtDT(ts){
  if(!ts) return "";
  const d = new Date(ts);
  if(isNaN(d.getTime())) return "";
  const p = x => (x < 10 ? "0" : "") + x;
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) +
         " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function fmtTime(ts){
  if(!ts) return "";
  const d = new Date(ts), n = new Date();
  const p = x=>(x<10?"0":"")+x;
  if(d.toDateString() === n.toDateString()) return p(d.getHours())+":"+p(d.getMinutes());
  return (d.getMonth()+1)+"/"+d.getDate();
}

  return (permSafe()[0] ? "live" : "off");
}

  try{
    const o = JSON.parse(native.permSnapshot());
    return [!!o.a11y, !!o.overlay, !!o.notif, !!o.battery, !!o.file, !!o.install];
  }catch(e){ return [false,false,false,false,false,false,false]; }

const Auth = {
  mode:"reg",
  tab(m){
    this.mode = m;
    el("t-reg").textContent = tb("reg");
    el("t-login").textContent = tb("login");
    el("t-reg").className = m==="reg" ? "act" : "";
    el("t-login").className = m==="login" ? "act" : "";
    el("a-pwd2-wrap").className = m==="reg" ? "" : "hide";
    el("a-go").textContent = m==="reg" ? tb("reg") : tb("login");
    el("a-msg").textContent = "";
  },
  msg(x){ el("a-msg").textContent = x || ""; },
  busy:false,
  go(){
    const u = el("a-user").value.trim();
    const p = el("a-pwd").value;
    if(this.busy) return;
    if(!u){ return this.msg(tb("need_user")); }
    if(p.length < 4){ return this.msg(tb("pwd_short")); }
    const self = this;
    const done = function(){ self.busy = false; };
    this.busy = true;
    if(this.mode === "reg"){
      if(p !== el("a-pwd2").value){ this.busy = false; return this.msg(tb("pwd_diff")); }
      this.msg(tb("regging"));
      const salt = rnd(32);
      rpc("mrclaw_register", { p_user: u, p_salt: salt, p_hash: Native.hash(salt + p) })
        .then(function(r){
          done();
          if(r && r.__err){ return self.msg(tb("reg_fail") + String(r.__err).slice(0, 110)); }
          if(r === "EXISTS"){ return self.msg(tb("user_exists")); }
          if(r !== "OK"){ return self.msg(tb("reg_fail") + JSON.stringify(r).slice(0, 110)); }
          self.enter(u);
        });
    } else {
      this.msg(tb("logining"));
      rpc("mrclaw_salt", { p_user: u }).then(function(salt){
        if(salt && salt.__err){ done(); return self.msg(tb("net_err") + String(salt.__err).slice(0, 110)); }
        if(!salt || typeof salt !== "string"){ done(); return self.msg(tb("no_user")); }
        rpc("mrclaw_login", { p_user: u, p_hash: Native.hash(salt + p) }).then(function(ok){
          done();
          if(ok && ok.__err){ return self.msg(tb("net_err") + String(ok.__err).slice(0, 110)); }
          if(ok === true) self.enter(u);
          else self.msg(tb("bad_pwd"));
        });
      });
    }
  },
  enter(u){
    S.user = { name: u, t: nowMs() };
    LS.set("mrclaw_user", S.user);
    loadUserData();
    rpc("mrclaw_touch", { p_user: u });
    Cloud.pull(u);
    Acc.refresh();
    try{ Admin.check(); Notice.load(); SupUnread.load(); }catch(e){}
    el("auth").classList.add("hide");
    el("app").classList.remove("hide");
    App.tab("chat");
  },
  logout(){
    S.user = null; LS.del("mrclaw_user");
    loadUserData();
    el("app").classList.add("hide");
    el("auth").classList.remove("hide");
    el("a-pwd").value = ""; el("a-pwd2").value = "";
    this.tab("login");
  }
};

  },

  tap(i){ if(this._block && Date.now() - this._block < 700) return; this.pick(i); },
  add(){ Chat.newConv(); this.close(); },
  pay(){ this.close(); Show.openPay(); },
  pick(i){ const c = S.convs[i]; if(!c) return; S.cur = c.id; saveConvs(); Chat.render(); this.close(); },
  async action(i){
    const c = S.convs[i]; if(!c) return;
    this._block = Date.now();
    const v = await uiSheet(c.title || t("new_chat"), [
      { label: t("rename"), value: "rename" },

    ]);

  open(){

      h += "<span class='qbtn' onclick='Quick.run(" + i + ")'>" + esc(LANG === "en" ? q.en : q.zh) + "</span>";
    });

    p.innerHTML = h;
    p.classList.remove("hide");
  },
  close(){ const p = el("quick-panel"); if(p) p.classList.add("hide"); },
  run(i){
    const q = QUICK[i]; if(!q) return;
    if(!scriptOk()){ Native.toast(LANG === "en" ? "Please update the app first" : "请先更新安装包（需 v1.1.0+）"); return; }
    const nm = LANG === "en" ? q.en : q.zh;

      const sub = function(o){
        if(typeof o === "string") return (txt == null ? o : o.replace(/\{\{1\}\}/g, String(txt)));
        if(Array.isArray(o)) return o.map(sub);
        if(o && typeof o === "object"){ const r = {}; for(const k in o){ r[k] = sub(o[k]); } return r; }
        return o;
      };
      Quick.close();
      Macro.runSteps(nm, [{ n:"run_script", a: JSON.stringify({ note: nm, steps: sub(q.steps), done: true }) }]);
    };
    if(q.ask){
      uiAsk((LANG === "en" ? "Input: " : "") + q.ask, "").then(function(v){ if(v === null) return; go(String(v || "").trim()); });
      return;
    }
    go(null);

/* ===== 脚本记忆：同一任务第二次直接本地跑，不调用大模型 ===== */
const ScriptMem = {
  KEY: "mrclaw_scriptmem_v1",
  norm(s){ return String(s || "").toLowerCase().replace(/\s+/g, "").replace(/[，。！？,.!?、；;：:""''（）()【】\[\]]/g, ""); },
  list(){ try{ const v = LS.get(this.KEY); return Array.isArray(v) ? v : []; }catch(e){ return []; } },
  put(l){ try{ LS.set(this.KEY, l.slice(0, 40)); }catch(e){} },
  find(q){
    const n = this.norm(q);
    if(!n || n.length < 4) return null;
    const l = this.list();
    for(let i = 0; i < l.length; i++){ if(this.norm(l[i].q) === n) return l[i]; }
    return null;
  },
  remember(q, steps, name){
    try{
      const n = this.norm(q);
      if(!n || !steps || !steps.length) return;
      let l = this.list().filter(function(x){ return ScriptMem.norm(x.q) !== n; });
      l.unshift({ q: String(q).slice(0, 80), n: String(name || "").slice(0, 24), steps: steps, ts: Date.now() });
      this.put(l);
    }catch(e){}
  }
};
const Macro = {
  KEY: "mrclaw_macros_v1",
  rec: false,
  replaying: false,
  buf: [],
  lastRun: [],
  all(){ try{ const v = LS.get(this.KEY); return Array.isArray(v) ? v : []; }catch(e){ return []; } },
  put(list){ LS.set(this.KEY, list); },
  byId(id){ const l = this.all(); for(let i=0;i<l.length;i++){ if(l[i].id===id) return l[i]; } return null; },
  add(name, steps){ const l = this.all(); l.unshift({ id: "m" + Date.now(), name: name, steps: steps, ts: Date.now() }); this.put(l); },
  del(id){ this.put(this.all().filter(function(m){ return m.id !== id; })); },
  rename(id, name){ const l = this.all(); for(let i=0;i<l.length;i++){ if(l[i].id===id) l[i].name = name; } this.put(l); },
  startRun(){ this.lastRun = []; },
  capture(name, argsJson){
    if(!name || name === "screen" || this.replaying) return;
    if(!this.rec && !Chat._taskActive) return;
    const s = { n: name, a: (argsJson || "{}") };
    this.lastRun.push(s);

  },
  toggleRec(){
    this.rec = !this.rec;
    if(this.rec){ this.buf = []; }

                          : (LANG === "en" ? "Stopped" : "已停止录制"));

  },
  saveLast(){
    const steps = this.buf.length ? this.buf.slice() : this.lastRun.slice();
    if(!steps.length){ Native.toast(LANG === "en" ? "Nothing to save yet" : "还没有可保存的步骤"); return; }
    const d = new Date();
    const def = (LANG === "en" ? "Macro " : "宏 ") + (d.getMonth() + 1) + "-" + d.getDate() + " " +
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    uiAsk(LANG === "en" ? "Macro name" : "宏名称", def).then(function(name){

      Native.toast(LANG === "en" ? "Saved" : "已保存");

  run(id){
    const m = this.byId(id);
    if(!m) return;
    this.close();
    this.runSteps(m.name, m.steps);
  },
  runSteps(name, steps){
    if(!steps || !steps.length) return;
    if(Chat.busy){ Native.toast(LANG === "en" ? "Busy, try again later" : "正在忙，稍后再试"); return; }
    this.replaying = true; Chat.busy = true; Chat._pcancel = false;
    const c = Chat.cur();
    if(!c){ this.replaying = false; Chat.busy = false; return; }
    const bubble = { role: "assistant", content: "▶ " + name, _steps: [] };
    c.msgs.push(bubble); saveConvs(); Chat.render();
    Chat.agentBar(true, "▶ " + name);
    let i = 0;
    const self = this;
    const next = function(){
      if(i >= steps.length){
        self.replaying = false; Chat.busy = false;
        Chat.agentBar(false); saveConvs(); Chat.render();
        Overlay.flash(t("done_t"), "ok", 2000);
        return;
      }
      const s = steps[i++];
      bubble._steps.push(Chat.toolDesc(s.n, s.a));
      bubble.content = "▶ " + name + "\n" + bubble._steps.map(function(x){ return "· " + x; }).join("\n");
      Chat.paint(bubble);
      Chat.callTool(s.n, s.a, function(){ setTimeout(next, 200); });
    };
    next();
  },
  open(){
    const p = el("macro-panel");

  },
  paint(){

      box.innerHTML = "<div class='muted mp-empty'>" +

        "<button class='btn mini' onclick=\"Macro.run('" + m.id + "')\">▶</button>" +
        "<button class='btn ghost mini' onclick=\"Macro.doRename('" + m.id + "')\">✎</button>" +
        "<button class='btn ghost mini danger' onclick=\"Macro.doDel('" + m.id + "')\">🗑</button>" +
        "</div></div>";
    }).join("");
  },
  doRename(id){
    const m = this.byId(id);
    if(!m) return;
    uiAsk(LANG === "en" ? "Macro name" : "宏名称", m.name).then(function(v){

};

  async send(){
    if(!S.user) return this.openLoginGate();
    if(this.busy || this.sending) return;
    const ta = el("ta");
    const text = ta.value.trim();
    if(!text) return;
    this.sending = true;
    this._pcancel = false;
    const self = this;
    const keep = function(){ self.sending = false; };
    if(Acc.banned()){ keep(); Show.ban(); return; }
    const useOwn = (Acc.data.mode === "own");
    if(useOwn && !S.cfg.apiKey && !(S.cfg.provider==="custom" && S.cfg.base)){ keep(); Guide.key(); return; }
    if(native && Mode.on() && !Perm.done()){
      S.cfg.permAsked = true; saveCfg(); keep(); Guide.perm(); return;
    }
    if(!useOwn){
      const st = await Acc.fetch();
      this.sending = false;
      if(Acc.banned()){ Show.ban(); return; }
      if(!st && !Acc.data.ready){ Native.toast(t("save_failed")); return; }
      if(Acc.data.points <= 0){ Show.out(); return; }
    }
    this.sending = false;
    if(this.busy) return;
    const atts = Attach.take();
    const c = this.cur();
    c.msgs.push({ role:"user", content: text, attach: atts });
    try{ Mem.scan(text).forEach(function(x){ Mem.autoAdd(x); }); }catch(e){}
    if(c.title === t("new_chat")){ c.title = text.slice(0,14); }
    c.t = nowMs();
    ta.value = ""; ta.style.height = "auto";
    saveConvs(); this.render();

    if(!useOwn){
      if(Acc.data.points <= 0){ Show.out(); return; }
      const taskOn = !!(native && Mode.on() && Perm.done());
      if(taskOn){
        this._taskText = text;
        let memo = null;
        try{ memo = ScriptMem.find(text); }catch(e){}
        if(memo && memo.steps && memo.steps.length && scriptOk()){
          Overlay.on(LANG === "en" ? "Reusing saved script (no AI)" : "复用上次脚本（不调 AI）", "run", true);
          Macro.runSteps(memo.n || text.slice(0, 14), [{ n:"run_script", a: JSON.stringify({ note: memo.n || text.slice(0, 20), steps: memo.steps, done: true }) }]);
          return;
        }
        this.busy = true; this.syncSendBtn();
        const pb = { role:"assistant", content:"", _agent:true, _steps:[], _think:[], _running:true };
        c.msgs.push(pb);
        this.agentBar(true);
        Overlay.on(t("running").replace("● ", ""), "run", true);
        this.render();
        this.pointsAgent(c, pb, atts);
      } else {
        this.sendPoints(c);
      }
      return;
    }

    const url = this.endpoint();
    if(!url){ Native.toast(LANG==="en" ? "Please configure the endpoint" : "请先配置接口地址"); App.tab("me"); return; }
    const headers = JSON.stringify({
      "Content-Type": "application/json",
      "Authorization": BEARER + S.cfg.apiKey
    });
    const body = JSON.stringify({
      model: S.cfg.model || providerById(S.cfg.provider).model,
      messages: this.apiMsgs(c, null, atts),
      stream: true,
      temperature: parseFloat(S.cfg.temp) || 0.7
    });

    this.busy = true;
    this.syncSendBtn();
    const useAgent = !!(native && Mode.on() && Perm.done());
    const bubble = { role:"assistant", content:"" };
    if(useAgent){ bubble._agent = true; bubble._steps = []; bubble._running = true; }
    else { bubble._stream = true; }
    c.msgs.push(bubble);
    if(useAgent) this.agentBar(true, t("running").replace("● ","") + "…");
    if(useAgent) Overlay.on(t("running").replace("● ",""), "run", true);
    this.render();

    if(useAgent){ this.agentRun(bubble, url, headers, body); return; }
    this.streamId = "s"+nowMs();
    if(!Native.stream(this.streamId, url, headers, body)){ this.fallbackFetch(url, headers, body); }
  },
  /* -------- 组装请求消息（支持图片） -------- */
  apiMsgs(c, bubble, atts){
    const model = S.cfg.model || providerById(S.cfg.provider).model;
    const vision = /vl|vision|4v|omni|glm-4v|gpt-4/i.test(String(model));
    const hist = c.msgs.filter(function(x){ return x !== bubble && x.role !== "system"; }).slice(-10); // 精简上下文，降低 token
    const out = [{ role:"system", content: this.systemText() }];
    hist.forEach(function(x, i){
      const last = (i === hist.length - 1);
      if(x.role === "user" && last && atts && atts.length){
        const imgs = atts.filter(function(a){ return Attach.isImg(a) && a.url; });
        if(vision && imgs.length){
          const parts = [];
          if(x.content) parts.push({ type:"text", text: x.content });
          imgs.forEach(function(a){ parts.push({ type:"image_url", image_url:{ url:a.url } }); });
          out.push({ role:"user", content: parts });
          return;
        }
        const extra = atts.map(function(a){ return "[附件] " + (a.name || "") + " " + a.url; }).join("\n");
        out.push({ role:"user", content: (x.content ? x.content + "\n\n" : "") + extra });
        return;
      }
      out.push({ role: x.role, content: x.content });
    });
    return out;
  },
  /* -------- 钻石模式：走服务端代理，Key 不下发 -------- */
  sendPoints(c){
    this.busy = true; this.syncSendBtn();
    const last = c.msgs[c.msgs.length - 1];
    const atts = (last && last.attach) ? last.attach : [];
    if(atts.some(function(a){ return Attach.isImg(a); })) Native.toast(t("no_vision"));
    const bubble = { role:"assistant", content: t("thinking"), _pts:true };
    c.msgs.push(bubble); this.render();
    const msgs = this.apiMsgs(c, bubble, atts);
    rpc("mrclaw_ai_start", {
      p_user: S.user.name,
      p_body: { model:"deepseek-chat", messages: msgs, stream:false, max_tokens: 1024 }
    }).then(function(st){
      if(!st || st.__err){ Chat.ptsFail(bubble, (st && st.__err) || "net"); return; }
      if(st.err === "no_points"){ Chat.ptsEnd(bubble, true); return; }
      if(st.err === "banned"){ Show.ban(); Chat.ptsEnd(bubble, false); return; }
      if(st.err){ Chat.ptsFail(bubble, st.err); return; }
      if(st.model){ bubble._model = st.model; Chat.paint(bubble); }
      Chat.pollPts(bubble, st.id, 0);
    });
  },
  pollPts(bubble, id, n){
    if(n > 100){ this.ptsFail(bubble, "timeout"); return; }
    setTimeout(function(){
      rpc("mrclaw_ai_poll", { p_user: S.user.name, p_id: id }).then(function(p){
        if(!p || p.__err || !p.done){ Chat.pollPts(bubble, id, n + 1); return; }
        let full = Chat.extract(p.body);
        try{ const sp = Chat.splitThink(full); if(sp.think){ bubble._think = [sp.think]; } if(sp.ans){ full = sp.ans; } }catch(e){}
        if(typeof p.used === "number"){ bubble._cost = p.used; bubble._bal = p.points; }
        if(typeof p.points === "number"){ Acc.data.points = p.points; Acc.paint(); }
        Chat.busy = false;
        Chat.reveal(bubble, full, function(){ saveConvs(); Chat.render(); Chat.afterReply(); try{ SpeakAuto.say(full); }catch(e){} if(Acc.data.points <= 0) Show.out(); });
      });
    }, 150);
  },
  reveal(bubble, full, done){
    const text = String(full == null ? "" : full);
    const box = el("msgs");
    const nodes = box ? box.querySelectorAll(".msg.a") : null;
    const n = nodes && nodes[nodes.length - 1];
    if(!n || text.length < 2){ bubble.content = text; if(done) done(); return; }
    n.classList.add("streaming");
    const total = text.length;
    const dur = Math.max(500, Math.min(2400, total * 10));
    const t0 = nowMs();
    const step = function(){
      const p = Math.min(1, (nowMs() - t0) / dur);
      const cut = Math.floor(total * p);
      n.innerHTML = linkify(esc(text.slice(0, cut))) + (p < 1 ? "<span class='caret'></span>" : "");
      const cw = el("content"); if(cw) cw.scrollTop = cw.scrollHeight;
      if(p < 1){ requestAnimationFrame(step); }
      else { n.classList.remove("streaming"); bubble.content = text; if(done) done(); }
    };
    requestAnimationFrame(step);
  },
  slimMsgs(msgs){
    // 只保留最近 3 条工具结果原文，更早的长结果（如读屏）截断，避免上下文膨胀（又慢又费 token）
    let kept = 0;
    for(let i = msgs.length - 1; i >= 0; i--){
      const m = msgs[i];
      if(m.role !== "tool") continue;
      kept++;
      if(kept > 3 && m.content && m.content.length > 220){
        m.content = m.content.slice(0, 220) + "…（已省略）";
      }
    }
  },
  ptsEnd(bubble, dialog){
    bubble.role = "system";
    bubble.content = t("pts_empty");
    this.busy = false; saveConvs(); Chat.render();
    if(dialog) Show.out();
  },
  /* 新对话第一次回复后，让 AI 取一个恰当的标题 */
  autoTitle(c){
    try{
      if(!c || !S.user || c._titled) return;
      const um = (c.msgs || []).filter(function(m){ return m.role === "user" && m.content; });
      const am = (c.msgs || []).filter(function(m){ return m.role === "assistant" && m.content; });
      if(um.length !== 1 || !am.length) return;
      c._titled = true;
      const q = String(um[0].content || "").slice(0, 60).replace(/\s+/g, " ");
      const a = String(am[0].content || "").slice(0, 80).replace(/\s+/g, " ");
      const body = { model: "deepseek-chat", max_tokens: 24, stream: false, messages: [{ role: "user", content: (LANG === "en"
        ? "Give a short title (max 6 words, no quotes, no punctuation) for this chat. Output ONLY the title.\nUser: " + q + "\nAI: " + a
        : "为下面这段对话取一个恰当的标题：不超过 12 个字，不要标点、不要引号，只输出标题本身。\n用户：" + q + "\nAI：" + a) }] };
      rpc("mrclaw_ai_start", { p_user: S.user.name, p_body: body }).then(function(st){
        if(!st || st.__err || st.err) return;
        Chat.pollAgent(st.id, function(pp){
          let o = {}; try{ o = JSON.parse(pp.body || "{}"); }catch(e){}
          const m = o.choices && o.choices[0] && o.choices[0].message;
          let ttl = String((m && m.content) || "").trim().replace(/^["\u300c\u300e\uff02]+|[,\uff0c\u3002.!\uff01?\uff1f"'\u300d\u300f\uff02]+$/g, "").replace(/\n/g, " ").slice(0, 16);
          if(ttl){
            c.title = ttl; saveConvs();
            if(S.cur === c.id){ try{ App.title(ttl); Chat.render(); }catch(e){} }
          }
        }, function(){});
      });
    }catch(e){}
  },
  afterReply(){
    if(!S.user) return;
    try{ Chat.autoTitle(Chat.cur()); }catch(e){}
    rpc("mrclaw_bump", { p_user: S.user.name }).then(function(st){
      if(!st || st.__err || typeof st.count !== "number") return;
      if(st.reviewed && !S.cfg.reviewed){ S.cfg.reviewed = true; saveCfg(); }
      if(st.count > 5 && !st.reviewed && !S.cfg.reviewed && !S.cfg.reviewAsked){
        S.cfg.reviewAsked = true; saveCfg();
        setTimeout(function(){ Review.open(false); }, 900);
      }
    });
  },
  ptsFail(bubble, err){
    bubble.role = "system";
    bubble.content = t("exec_fail") + String(err).slice(0, 200);
    this.busy = false; saveConvs(); Chat.render();
  },
  toolDesc(name, argsJson){

    if(name === "write_file") return (en ? "Write file: " : "写入文件：") + (a.path || "");

  },
  look(cb){
    if(!native || !native.screenshot){
      cb(LANG === "en" ? "(this version cannot see the screen)" : "（当前版本不支持看屏幕）");
      return;
    }
    let shot = "";
    try{ shot = String(native.screenshot() || ""); }catch(e){ shot = ""; }
    if(!shot || shot.length < 100){
      cb(LANG === "en" ? "(screenshot failed; make sure screen capture is allowed)" : "（截图失败：请确认无障碍服务已开启并允许截屏）");
      return;
    }
    const body = {
      model: "vision", max_tokens: 500, stream: false,
      messages: [{ role: "user", content: [
        { type: "text", text: (LANG === "en"
          ? "This is the current phone screen. Briefly list ALL tappable icons/buttons with position (e.g. 'top-right magnifier = search'), then the main text, then which element likely matches the goal."
          : "这是安卓手机当前屏幕。请简要列出：①所有可点的图标/按钮（带位置，例如“右上角放大镜=搜索”“右侧爱心=点赞”）；②主要文字；③用户最可能要点哪个元素。不要多余解释。") },
        { type: "image_url", image_url: { url: "data:image/jpeg;base64," + shot } }
      ] }]
    };
    rpc("mrclaw_ai_start", { p_user: S.user.name, p_body: body }).then(function(st){
      if(!st || st.__err || st.err){ cb(LANG === "en" ? "(vision failed)" : "（视觉识别失败）"); return; }
      Chat.pollAgent(st.id, function(pp){
        let o = {}; try{ o = JSON.parse(pp.body || "{}"); }catch(e){}
        const m = o.choices && o.choices[0] && o.choices[0].message;
        if(typeof pp.points === "number"){ Acc.data.points = pp.points; Acc.paint(); }
        cb((m && m.content) ? m.content : (LANG === "en" ? "(nothing recognized)" : "（没有识别到内容）"));
      }, function(e){ cb(LANG === "en" ? "(vision failed)" : "（视觉识别失败）"); });
    });
  },
  callTool(name, argsJson, cb){
    let a = {};
    try{ a = JSON.parse(argsJson || "{}") || {}; }catch(e){ a = {}; }
    try{ Macro.capture(name, argsJson); }catch(e){}
    if(name === "remember"){
      const okSaved = Mem.autoAdd(a.text || a.content || "", true);
      if(okSaved){
        try{
          const c = Chat.cur();
          if(c){
            c.msgs.push({ role:"system", content: t("mem_auto_saved") + "「" +
              String(a.text || "").slice(0, 80) + "」\n" + t("mem_auto_hint") });
            saveConvs(); Chat.render();
          }
        }catch(e){}
      }
      cb(okSaved ? (LANG === "en" ? "Saved to long-term memory." : "已存入长期记忆。")
                 : (LANG === "en" ? "Already in memory." : "这条已经在记忆里了。"));
      return;
    }
    if(name === "get_time"){ cb(WebTools.time()); return; }
    if(name === "weather"){ WebTools.weather(a.city || a.name || "", cb); return; }
    if(name === "fetch_url"){ WebTools.fetchUrl(a.url || a.link || "", a.max, cb); return; }
    if(name === "make_file"){ WebTools.makeFile(a.name || a.filename, a.content != null ? a.content : a.text, cb); return; }
    if(name === "send_image"){ WebTools.sendImage(a.source || a.url || a.src, a.caption || a.text, cb); return; }
    if(name === "look"){ Chat.look(cb); return; }
    if(native && native.a11yDetail){
      let st = "off";
      try{ st = String(native.a11yDetail()); }catch(e){}
      if(st === "granted" && !Chat._a11yWarned){
        Chat._a11yWarned = true;
        Native.toast(t("a11y_connecting"));
      }
    }
    if(!native || !native.toolAsync){
      try{ Upd.noBridge(); }catch(e){}
      cb(t("need_new_apk"));
      return;
    }
    const id = "tl" + (++_toolSeq);
    _toolWait[id] = cb;
    native.toolAsync(id, name, argsJson || "{}", !!S.cfg.autonomy);
  },
  pollAgent(id, ok, err, n){
    n = n || 0;
    if(n > 120){ err("timeout"); return; }
    setTimeout(function(){
      rpc("mrclaw_ai_poll", { p_user: S.user.name, p_id: id }).then(function(pp){
        if(!pp || pp.__err || !pp.done){ Chat.pollAgent(id, ok, err, n + 1); return; }
        ok(pp);
      });
    }, 150);
  },
  pointsAgent(c, bubble, atts){
    const self = this;
    const msgs = this.apiMsgs(c, bubble, atts);
    let step = 0, guard = 0;
    const steps = bubble._steps;
    bubble._think = [];
    bubble._t0 = Date.now(); bubble._tools = 0;
    Chat._taskActive = true; try{ Macro.startRun(); }catch(e){}
    const finish = function(txt, state){
      bubble._running = false; bubble._state = state || "done";
      bubble._t1 = Date.now();
      const _sp = Chat.splitThink(txt || "");
      if(_sp.think){ bubble._think = (bubble._think || []).concat([_sp.think]); }
      const _ans = _sp.think ? _sp.ans : (txt || "");
      bubble.content = (steps.length ? steps.map(function(x){ return "· " + x; }).join("\n") + "\n\n" : "") + _ans;
      self.busy = false; self.agentBar(false); saveConvs(); Chat.render();
      Chat._taskActive = false;
      if(state === "done") Overlay.flash(t("done_t"), "ok", 2600);
      else if(state === "stop") Overlay.flash(t("stop_t"), "warn", 2600);
      else Overlay.flash(t("err_t"), "bad", 3200);
      self.afterReply();
      SpeakAuto.say(txt);
    };
    const tick = function(){
      if(self._pcancel){ finish(t("stop_t"), "stop"); return; }
      step++; guard++;
      // 不硬停：达到很高的安全阈值时先问用户是否继续（正常情况下会一直做到模型不再调用工具为止）
      if(step > 300 || guard > 600){
        const msg = (LANG === "en")
          ? ("Task is still unfinished after " + step + " steps. Continue?")
          : ("任务还没做完（已执行 " + step + " 步），要继续吗？");
        self.busy = false;
        uiAsk(msg, null, { input:false }).then(function(ok){
          if(ok === true){ self.busy = true; step = 0; guard = 0; tick(); }
          else { finish(t("stop_t"), "stop"); }
        });
        return;
      }
      if(step === 1) msgs.push({ role: "system", content: "需要实时或准确信息时，直接调用工具拿真实数据，禁止让用户自己去别处查：\n· 天气 → weather 工具\n· 今天日期/时间 → get_time 工具\n· 其他实时信息（汇率、股价、新闻、百科等）→ fetch_url 工具抓取对应网页/接口\n拿到结果后用自然语言回答。" });
      rpc("mrclaw_ai_start", { p_user: S.user.name, p_body: {
        model: "deepseek-chat", messages: msgs, tools: toolsForNative(),
        tool_choice: "auto", stream: false, max_tokens: 1024 } }).then(function(st){
        if(!st || st.__err){ finish(t("exec_fail") + String((st && st.__err) || "").slice(0, 150), "err"); return; }
        if(st.err === "no_points"){ Show.out(); finish(t("pts_empty"), "err"); return; }
        if(st.err === "banned"){ Show.ban(); finish("", "err"); return; }
        if(st.err){ finish(t("exec_fail") + st.err, "err"); return; }
        if(st.model){ bubble._model = st.model; self.paint(bubble); }
        self.pollAgent(st.id, function(pp){
          let m = null;
          try{
            const o = JSON.parse(pp.body || "{}");
            m = o.choices && o.choices[0] && o.choices[0].message;
            const rc = m && m.reasoning_content;
            if(rc){ Chat.addThink(bubble, "think", rc); }
            if(m && m.content && m.tool_calls && m.tool_calls.length){
              const _c = Chat.splitThink(String(m.content));
              Chat.addThink(bubble, "think", _c.think ? _c.think : String(m.content));
            }
            if(bubble._think && bubble._think.length){ self.paint(bubble); }
          }catch(e){}
          if(typeof pp.points === "number"){ Acc.data.points = pp.points; Acc.paint(); }
          if(pp.used){ bubble._cost = (bubble._cost || 0) + pp.used; bubble._bal = pp.points; }
          if(m && m.tool_calls && m.tool_calls.length){
            msgs.push(m);
            let i = 0;
            const next = function(){
              if(self._pcancel){ finish(t("stop_t"), "stop"); return; }
              if(i >= m.tool_calls.length){ guard++; tick(); return; }
              const tc = m.tool_calls[i++];
              const fn = tc.function || {};
              const desc = self.toolDesc(fn.name, fn.arguments);
              steps.push(desc);
              bubble._tools = (bubble._tools || 0) + 1;
              Chat.addThink(bubble, "tool", desc);
              bubble.content = steps.map(function(x){ return "· " + x; }).join("\n");
              self.paint(bubble);
              Overlay.on(desc, "run", true);
              guard++;
              self.callTool(fn.name, fn.arguments, function(res){
                const sres = String(res);
                msgs.push({ role: "tool", tool_call_id: tc.id || ("c" + i),
                            content: sres.slice(0, 2000) });
                Chat.slimMsgs(msgs);
                let fa = {};
                try{ fa = JSON.parse(fn.arguments || "{}") || {}; }catch(e){}
                const _st = JSON.stringify(fa.steps || []);
                const _verified = /waitText|ifText|scrollFind/.test(_st);
                // 一步完成：脚本一次成功 + 有验证步骤 + 模型标记 done -> 直接结束（否则继续，绝不谎报完成）
                if(fn.name === "run_script" && fa.done === true && i >= m.tool_calls.length && sres.indexOf("✗") < 0 && _verified){
                  try{ ScriptMem.remember(Chat._taskText || "", fa.steps, fa.note); }catch(e){}
                  const say = (m.content && String(m.content).trim()) ? String(m.content).trim()
                             : (LANG === "en" ? "Done." : "已完成。");
                  finish(say, "done");
                  return;
                }
                if(fn.name === "run_script" && fa.done === true && (!_verified || sres.indexOf("✗") >= 0)){
                  msgs.push({ role: "system", content: (LANG === "en"
                    ? "Your script did NOT verify success. Read the failures and FIX the script, then run again. Do not claim it is done."
                    : "你的脚本没有通过验证（缺少验证步骤或有✗失败），请读日志修正脚本并重跑；现在不要宣称已完成。") });
                }
                next();
              });
            };
            next();
          } else {
            const txt = (m && m.content) ? m.content : "";
            if(!txt && !steps.length){
              finish(LANG === "en" ? "The model returned nothing." : "模型没有返回内容，请再试一次。", "err");
              return;
            }
            finish(txt, "done");
          }
        }, function(e){ finish(t("exec_fail") + e, "err"); });
      });
    };
    tick();
  },
  agentRun(bubble, url, headers, body){
    const c = this.cur();
    try{ bubble._model = S.cfg.model || (providerById(S.cfg.provider) || {}).model; }catch(e){}
    const hist = c.msgs.filter(function(x){ return x !== bubble && x.role !== "system"; }).slice(-12)
      .map(function(x){
        let txt = x.content || "";
        if(x.attach && x.attach.length){
          txt += (txt ? "\n\n" : "") + x.attach.map(function(a){
            return "[附件] " + (a.name || "") + " " + a.url;
          }).join("\n");
        }
        return { role:x.role, content: txt };
      });
    native.agent(JSON.stringify({
      url: url, headers: headers,
      model: S.cfg.model || providerById(S.cfg.provider).model,
      temp: parseFloat(S.cfg.temp) || 0.7,
      system: this.systemText(), history: hist, autonomy: !!S.cfg.autonomy
    }));
  },
  fallbackFetch(url, headers, body){
    const c = this.cur();
    const b = Object.assign({}, JSON.parse(body), { stream:false });
    const raw = Native.http("POST", url, headers, JSON.stringify(b));
    this.onDone(this.streamId, this.extract(raw));
  },
  extract(raw){
    try{
      const o = JSON.parse(raw);
      if(o.choices && o.choices.length) return o.choices[0].message.content || "";
      return raw.slice(0,300);
    }catch(e){ return String(raw).slice(0,300); }
  },
  onChunk(id, piece){
    if(id !== Chat.streamId) return;
    const c = Chat.cur(); if(!c) return;
    const last = c.msgs[c.msgs.length-1];
    if(last && last._stream){
      last.content += piece;
      const box = el("msgs");
      if(box){
        const nodes = box.querySelectorAll(".msg.a");
        const n = nodes[nodes.length-1];
        if(n){ n.classList.add("streaming"); n.innerHTML = linkify(esc(last.content)) + "<span class='caret'></span>"; }
        el("content").scrollTop = el("content").scrollHeight;
      }
    }
  },
  onDone(id, full){
    if(id !== Chat.streamId) return;
    const c = Chat.cur(); if(!c) return;
    const last = c.msgs[c.msgs.length-1];
    if(last && last._stream){ last.content = full || last.content; delete last._stream; }
    Chat.busy = false; saveConvs(); Chat.render();
    Chat.afterReply();
  },
  onError(id, err){
    if(id !== Chat.streamId) return;
    const c = Chat.cur(); if(!c) return;
    const last = c.msgs[c.msgs.length-1];
    if(last && last._stream){
      last.role = "system";
      const ep = Chat.endpoint();
      last.content = t("exec_fail") + String(err).slice(0,300) +
        (ep ? ("\n" + t("will_call") + " " + ep) : "") +
        ("\n" + t("fix_hint"));
      delete last._stream;
    }
    Chat.busy = false; saveConvs(); Chat.render();
  },
  agentBar(on, text){
    const b = el("agentbar");
    if(on){ el("agenttxt").textContent = text || (t("running").replace("● ","") + "…"); b.classList.remove("hide"); }
    else b.classList.add("hide");
  },
  stopAgent(){
    Chat._pcancel = true;
    if(native && native.agentStop){
      native.agentStop();
      el("agenttxt").textContent = t("stopping");
      Native.toast(t("stop_req"));
      Overlay.on(t("stopping"), "warn", false);
    }
  },
  paint(b){
    const box = el("msgs"); if(!box) return;
    const nodes = box.querySelectorAll(".msg.a");
    const n = nodes[nodes.length-1];
    if(n) n.innerHTML = Chat.aHeadBody(b);
    el("content").scrollTop = el("content").scrollHeight;
  },
  agentEvent(s){
    let o = {};
    try{ o = JSON.parse(s); }catch(e){ return; }
    const c = this.cur(); if(!c) return;
    const b = c.msgs[c.msgs.length-1];
    if(!b || !b._steps) return;
    if(o.type === "run"){
      Chat._taskActive = true; try{ Macro.startRun(); }catch(e){}
      if(o.model) b._model = o.model;
      if(!b._think) b._think = [];
      b._running = true; this.agentBar(true); this.paint(b);
      Overlay.on(t("running").replace("● ", ""), "run", true);
      return;
    }
    if(o.type === "tool"){
      try{ Macro.capture(o.name, o.arguments || "{}"); }catch(e){}
      try{ if(!b._think) b._think = []; b._think.push("▶ " + (o.name || "") + " " + String(o.arguments || "").slice(0, 60)); this.paint(b); }catch(e){}
      return;
    }
    if(o.type === "status"){
      b._steps.push(o.text);
      try{ if(!b._think) b._think = []; b._think.push(String(o.text)); }catch(e){}
      b.content = b._steps.map(x=>"· " + x).join("\n");
      this.paint(b);
      Overlay.on(o.text, "run", true);
      return;
    }
    if(o.type === "text"){
      b.content = (b._steps.length ? b._steps.map(x=>"· " + x).join("\n") + "\n\n" : "") + o.text;
      this.paint(b); return;
    }
    if(o.type === "err"){
      b._running = false; b._state = "err";
      b.content = String(o.text).slice(0,300);
      this.busy = false; this.agentBar(false); saveConvs(); Chat.render();
      Chat._taskActive = false;
      Overlay.flash(t("err_t"), "bad", 3200); return;
    }
    if(o.type === "stop"){
      b._running = false; b._state = "stop";
      Chat._taskActive = false;
      this.busy = false; this.agentBar(false); saveConvs(); Chat.render();
      Overlay.flash(t("stop_t"), "warn", 2600); return;
    }
    if(o.type === "done"){
      b._running = false; b._state = "done";
      Chat._taskActive = false;
      this.busy = false; this.agentBar(false); saveConvs(); Chat.render();
      Overlay.flash(t("done_t"), "ok", 2600);
      try{ SpeakAuto.say(b.content); }catch(e){}
    }
  }
};

  async pickShare(){
    const acts = [{ label: t("share_none"), value: "none" }];
    if(S.mems.length) acts.push({ label: t("share_pick_mem"), value: "mem" });
    const on = Skill.all().filter(function(s){ return s.on; });
    if(on.length) acts.push({ label: t("share_pick_skill"), value: "skill" });
    const c = Chat.cur();
    if(c && c.msgs.length) acts.push({ label: t("share_pick_chat"), value: "chat" });
    if(acts.length === 1) return null;
    const v = await uiSheet(t("share_title"), acts);
    if(v === null) return false;
    if(v === "none") return null;
    if(v === "mem"){
      const i = await uiSheet(t("share_pick_mem"), S.mems.map(function(m, k){
        return { label: String(m.text).slice(0, 18), value: String(k) };
      }));
      if(i === null) return false;
      return { kind: "memory", text: S.mems[parseInt(i, 10)].text };
    }
    if(v === "skill"){
      const i = await uiSheet(t("share_pick_skill"), on.map(function(s){
        return { label: Skill.name(s), value: s.id };
      }));
      if(i === null) return false;
      const s = Skill.all().filter(function(x){ return x.id === i; })[0];
      return { kind: "skill", name: Skill.name(s), text: Skill.prompt(s) };
    }
    if(v === "chat"){
      const last = c.msgs[c.msgs.length - 1];
      return { kind: "chat", text: String(last.content || "").slice(0, 300) };
    }
    return null;

    S.tasks.unshift({ id:"t"+nowMs(), name:String(name).trim(), desc:String(desc),
      kind: when.trim() ? "cron" : "manual", when: when.trim() });
    saveTasks(); this.render();
  },
  async del(i){
    if(await uiAsk(t("task_del_q", S.tasks[i].name), null, { input:false }) !== true) return;

      (LANG==="en" ? "\nBreak it into steps and start." : "\n请拆解为步骤并开始执行。");
    Chat.syncSendBtn();
  }
};

      const custom = (S.skills || []).filter(function(s){ return s && s.builtin === false && s.name; });
      S.skills = SKILL_CATALOG.map(function(s){
        return { id:s.id, cat:s.cat, icon:s.icon, zh:s.zh, en:s.en, prompt:s.prompt,
                 builtin:true, on: SKILL_DEFAULT_ON.indexOf(s.id) >= 0 };
      }).concat(custom);
      saveSkills();
    }
    return S.skills;
  },
  name(s){
    const a = (LANG === "en" && s.en) ? s.en : s.zh;
    return a ? a[0] : (s.name || "");
  },
  desc(s){
    const a = (LANG === "en" && s.en) ? s.en : s.zh;
    return a ? a[1] : (s.desc || "");
  },
  prompt(s){ return s.prompt || ""; },
  catName(id){
    const c = SKILL_CATS.filter(function(x){ return x.id === id; })[0];
    return c ? (LANG === "en" ? c.en : c.zh) : id;
  },
  filter: "all", q: "",
  list(){
    const q = String(this.q || "").trim().toLowerCase();
    return this.all().filter(function(s){
      if(Skill.filter !== "all" && s.cat !== Skill.filter) return false;
      if(!q) return true;
      return (Skill.name(s) + " " + Skill.desc(s) + " " + Skill.prompt(s)).toLowerCase().indexOf(q) >= 0;
    });
  },
  render(){
    App.title(t("skill_title"));
    App.topBtn(t("new"));
    let h = "<div class='skbar'><input class='inp' placeholder='" + esc(t("skill_search")) +
      "' value='" + esc(this.q) + "' oninput='Skill.q=this.value;Skill.paint()'></div>";
    h += "<div class='cats'>" + SKILL_CATS.map(function(c){
      const n = c.id === "all" ? Skill.all().length
        : Skill.all().filter(function(s){ return s.cat === c.id; }).length;
      if(!n) return "";
      return "<button class='cat" + (Skill.filter === c.id ? " act" : "") +
        "' onclick=\"Skill.filter='" + c.id + "';Skill.paint()\">" +
        Skill.catName(c.id) + " <i>" + n + "</i></button>";
    }).join("") + "</div>";
    h += "<div id='sk-list'></div>";
    App.content(h);
  },
  paint(){
    const box = el("sk-list");
    if(!box) return;
    const a = this.list();
    if(!a.length){ box.innerHTML = "<div class='empty'>" + t("skill_none") + "</div>"; return; }
    box.innerHTML = a.map(function(s){
      const i = Skill.all().indexOf(s);
      return "<div class='scard' onclick='Skill.detail(" + i + ")'>" +
        "<div class='sic'>" + esc(s.icon || "🧩") + "</div>" +
        "<div class='stx'><div class='sn'>" + esc(Skill.name(s)) +
          (s.builtin ? "" : "<span class='tagmini'>" + t("skill_custom") + "</span>") + "</div>" +
          "<div class='sd'>" + esc(Skill.desc(s)) + "</div></div>" +
        "<div class='sw " + (s.on ? "on" : "") + "' onclick=\"event.stopPropagation();Skill.toggle(" + i + ")\"><i></i></div>" +
      "</div>";
    }).join("");
  },
  toggle(i){
    const a = this.all();
    a[i].on = !a[i].on;
    saveSkills(); this.paint(); Cloud.push(true);
  },
  async detail(i){
    const s = this.all()[i];
    if(!s) return;
    const act = await uiSheet(Skill.name(s), [
      { label: s.on ? t("skill_disable") : t("skill_enable"), value: "toggle" },
      { label: t("skill_send"), value: "run" },
      { label: t("del"), value: "del", danger: true }
    ]);
    if(act === "toggle"){ s.on = !s.on; saveSkills(); this.paint(); }
    else if(act === "run"){
      App.tab("chat");
      el("ta").value = (LANG === "en" ? "[Skill] " : "【技能】") + Skill.name(s) + "\n";
      Chat.syncSendBtn();
    } else if(act === "del"){
      if(s.builtin){ Native.toast(t("skill_no_del")); return; }
      const ok = await uiAsk(t("skill_del_q"), null, { input:false });
      if(ok !== true) return;
      S.skills.splice(i, 1); saveSkills(); this.paint();

    if(pr === null) return;

      on.map(function(s){ return "- " + Skill.name(s) + "：" + Skill.prompt(s); }).join("\n");
  }

/* ================= 记忆 ================= */
const Mem = {
  render(){
    App.title(t("mem_title"));
    App.topBtn(t("add"));
    let h = "<div class='hd'>" + t("mem_hint") + "</div>";
    if(!S.mems.length) h += "<div class='empty'>" + t("mem_empty") + "</div>";
    S.mems.forEach(function(x,i){
      h += "<div class='item'><p>" + esc(x.text) + "</p>" +
        "<div style='display:flex;gap:8px;margin-top:10px'>" +
        "<button class='btn mini ghost' onclick='Mem.edit(" + i + ")'>" + t("edit") + "</button>" +
        "<button class='btn mini danger' onclick='Mem.del(" + i + ")'>" + t("del") + "</button></div></div>";
    });
    App.content(h);
  },
  /* 自动记忆：去重后写入长期记忆 */
  autoAdd(text, quiet){
    let v = String(text == null ? "" : text).trim();
    v = v.replace(/^[，,。.、；;：:\s]+/, "").replace(/[。.，,；;\s]+$/, "");
    if(v.length < 2) return false;
    const dup = S.mems.some(function(m){
      const a = String(m.text || "").trim();
      return a === v || (a.length > 3 && v.length > 3 && (a.indexOf(v) >= 0 || v.indexOf(a) >= 0));
    });
    if(dup) return false;
    S.mems.unshift({ id: "m" + nowMs(), text: v, auto: true, t: nowMs() });
    if(S.mems.length > 300) S.mems = S.mems.slice(0, 300);
    saveMems();
    if(!quiet){
      try{
        const c = Chat.cur();
        if(c){
          c.msgs.push({ role: "system", content: t("mem_auto_saved") + "「" +
            v.slice(0, 80) + "」\n" + t("mem_auto_hint") });
          saveConvs(); Chat.render();
        } else {
          Native.toast(t("mem_auto_saved") + v.slice(0, 24));
        }
      }catch(e){}
    }
    return true;
  },
  /* 关键词扫描：含「记住 / 永远 / 都 / 以后 / 下次 / 我喜欢 …」等的句子自动摘取 */
  scan(text){
    const s = String(text == null ? "" : text);
    if(!s.trim()) return [];
    const TR = ["记住了","记住","记牢","记一下","记下","记着","记得","别忘了","别忘记","别忘","千万别忘",
                "永远记住","永远不要","永远别","永远都","以后都","以后不要","以后别","下次要","下次不要",
                "以后要","我喜欢","我不喜欢","我爱吃","我讨厌","我习惯","我的名字叫","我的名字是","我叫",
                "我的生日","我住在","我在做","我的工作是","我是做","我的手机","我的邮箱"];
    const out = [];
    s.split(/[。！？!?；;\n]+/).forEach(function(seg){
      const line = seg.trim();
      if(!line || line.length < 3) return;
      let hit = false;
      for(let i = 0; i < TR.length; i++){ if(line.indexOf(TR[i]) >= 0){ hit = true; break; } }
      if(!hit) return;
      let v = line;
      v = v.replace(/^(请你|请|帮我|帮忙|麻烦|拜托|你要|你需要|我想让你|我想请你)/, "").trim();
      v = v.replace(/^(记住|记住了|记牢|记一下|记下|记着|记得|别忘了|别忘记|永远记住)/, "").trim();
      v = v.replace(/[吧啊呀哦哟啦]$/, "").trim();
      if(v.length >= 3 && v.length <= 200) out.push(v);
    });
    const seen = {}, res = [];
    out.forEach(function(x){ if(!seen[x]){ seen[x] = 1; res.push(x); } });
    return res.slice(0, 3);
  },
  async create(){
    const x = await uiAsk(t("mem_what_q"), "");
    if(x === null || !String(x).trim()) return;
    S.mems.unshift({ id:"m"+nowMs(), text:String(x).trim() });
    saveMems(); this.render();
  },
  async edit(i){
    const x = await uiAsk(t("mem_edit_q"), S.mems[i].text);
    if(x === null) return;
    S.mems[i].text = String(x); saveMems(); this.render();
  },
  async del(i){
    if(await uiAsk(t("mem_del_q"), null, { input:false }) !== true) return;
    S.mems.splice(i,1); saveMems(); this.render();
  }
};

/* ================= 更新 ================= */
const Upd = {
  info:null, list:[], i:0, _tryNext:null, last:0,
  async check(manual){
    if(!native){ if(manual) Native.toast(t("mobile_only")); return; }
    Upd.last = Date.now();
    if(manual) Native.toast(t("upd_checking"));
    httpReq("GET", "https://mrstudiogame.github.io/mrstudio/mrclaw/web.json", {}, "").then(function(raw){
      let hot = false;
      try{
        if(raw && String(raw).indexOf("ERR:") !== 0){
          const j = JSON.parse(raw);
          const cur = (native.webVersion ? native.webVersion() : "0");
          if(j && j.apkUrl) Upd._apkUrl = j.apkUrl;
          // 只有发布端明确标记「必须换安装包」时才提示重装
          if(j && j.minApk && native.versionCode && native.versionCode() < j.minApk){
            Upd.needApk(t("need_new_apk"));
          }
          // 安装包缺少本网页层需要的原生能力时，才提示重装；否则一律静默热更新
          if(!capOk()){
            Upd.needApk(t("need_new_apk"));
          }
          const needHot = (j && j.webCode) ? (WEB_CODE < Number(j.webCode))
                                           : (j && j.web && cmpVer(j.web, cur) > 0);
          if(needHot){
            hot = true;
            if(manual) Native.toast(t("upd_found", j.web));
            Upd.webApply(j);
          }
        }
      }catch(e){}
      if(!hot && manual) Native.toast(t("upd_latest", webVer()));
    });
  },
  webApply(j){
    const urls = [j.url].concat(j.mirrors || []).filter(Boolean);
    let k = 0;
    const b = el("updbar");
    b.classList.remove("hide");
    b.innerHTML = "<span id='upd-txt'>" + t("web_updating") + "</span>";
    this._tryNext = function(){
      if(k >= urls.length){ b.innerHTML = "<span>" + t("web_fail") + "</span>"; return; }
      const u = urls[k]; k++;
      native.webUpdate(u, j.web);
    };
    this._tryNext();
  },
  checkApk(manual){
    // 普通更新只走热更新；仅当功能依赖新安装包时才提示升级
    if(manual) Native.toast(t("upd_latest", webVer()));
  },
  needApk(msg){
    if(Upd._apkShown) return;
    Upd._apkShown = true;
    const url = Upd._apkUrl || (native && native.updateUrl ? "https://mrstudiogame.github.io/mrstudio/mrclaw/MRClaw.apk" : "");
    const b = el("updbar");
    b.classList.remove("hide");
    b.innerHTML = "<span id='upd-txt'>" + esc(msg || t("need_new_apk")) + "</span>" +
      "<button class='btn mini' onclick='Upd.installApk()'>" + t("install_now") + "</button>";
  },
  noBridge(){
    if(Upd._nbShown) return;
    Upd._nbShown = true;
    Upd.needApk(t("need_new_apk"));
    uiSheet(t("need_new_apk_title"), [
      { label: t("upgrade_now"), value: "up" },
      { label: t("use_own_key"), value: "own" },
      { label: t("later"), value: "later" }
    ]).then(function(v){
      if(v === "up"){ Upd.installApk(); }
      else if(v === "own"){
        if(!S.cfg.apiKey){ Guide.key(); }
        else { Acc.mode(); Native.toast(t("mode_to_key")); }
      }
    });
  },

/* 原生能力等级：优先问安装包自报（caps()），老安装包则按方法探测 */
function capLevel(){
  try{
    if(!native) return 0;
    if(typeof native.caps === "function"){
      const v = parseInt(String(native.caps()).replace(/[^0-9]/g, ""), 10);
      if(!isNaN(v) && v > 0) return v;
    }
    let lv = 0;
    if(typeof native.http === "function") lv = 6;
    if(typeof native.httpAsync === "function") lv = Math.max(lv, 7);
    if(typeof native.toolAsync === "function") lv = Math.max(lv, 8);
    if(typeof native.uploadPicked === "function") lv = Math.max(lv, 8);
    if(typeof native.pickFile === "function") lv = Math.max(lv, 8);
    return lv;
  }catch(e){ return 0; }
}
function capOk(){ return capLevel() >= NEED_CAP; }

function cmpVer(a, b){
  const pa = String(a || "0").split("."), pb = String(b || "0").split(".");
  for(let i = 0; i < 3; i++){
    const x = parseInt(pa[i] || "0", 10) || 0, y = parseInt(pb[i] || "0", 10) || 0;
    if(x > y) return 1;
    if(x < y) return -1;
  }
  return 0;
}
