<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>DeepSeek 余额查询 - 官方下载</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(160deg,#f5f7fa,#e8eef7);color:#1f2328;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:32px 20px;text-align:center}
.logo{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(31,111,235,.35);margin:0 auto 18px}
h1{font-size:24px;margin-bottom:6px}
.sub{color:#656d76;font-size:14px;margin-bottom:26px}
.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:16px}
.ver{font-size:15px;color:#656d76;margin-bottom:10px}
.ver b{color:#1f6feb;font-size:18px}
.note{font-size:13px;color:#656d76;line-height:1.7;margin-bottom:16px;word-break:break-word}
.btn{display:block;background:#1f6feb;color:#fff;text-decoration:none;font-size:18px;font-weight:bold;padding:14px;border-radius:12px;box-shadow:0 4px 14px rgba(31,111,235,.35)}
.bonus{background:linear-gradient(90deg,#fff3cd,#ffd75e);border:2px solid #f5a623;color:#7a4d00;font-size:17px;font-weight:bold;padding:14px 10px;border-radius:12px;margin-bottom:16px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,.5)}50%{box-shadow:0 0 0 8px rgba(245,166,35,0)}}
.btn:active{background:#1958c4}
.size{font-size:12px;color:#9aa4b0;margin-top:8px}
.feat{text-align:left;font-size:14px;line-height:2;color:#1f2328}
.feat b{color:#1f6feb}
footer{color:#a0a8b0;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <svg class="logo" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#0d47a1"/></linearGradient></defs><rect width="96" height="96" rx="21" fill="url(#g)"/><circle cx="48" cy="52" r="29" fill="#ffd75e" stroke="#96661 2" stroke-width="2"/><text x="48" y="60" font-size="34" font-weight="bold" text-anchor="middle" fill="#0b2e60" font-family="Arial">¥</text></svg>
  <h1>DeepSeek 余额查询</h1>
  <div class="sub">安卓版 · 多 Key 管理 · 一键查余额</div>

  <div class="bonus">🎁 新用户第一次添加 API Key 可获得 <b>3元 API 余额</b>！</div>

  <div class="card">
    <div class="ver">最新版本：<b id="ver">加载中…</b></div>
    <div class="note" id="note"></div>
    <a class="btn" id="dl" href="#">⬇ 下载 APK</a>
    <div class="size" id="size"></div>
  </div>

  <div class="card feat">
    <b>✓</b> 添加/删除多个 Key<br>
    <b>✓</b> 查询剩余余额，随时刷新<br>
    <b>✓</b> 一键复制 Key<br>
    <b>✓</b> 自动更新，永不过时
  </div>
  <footer>MR工作室制作</footer>
</div>
<script>
fetch('version.json?v=' + Date.now()).then(r => r.json()).then(v => {
  document.getElementById('ver').textContent = 'v' + v.versionName;
  document.getElementById('note').textContent = v.note || '';
  document.getElementById('dl').href = v.url + '?v=' + v.versionCode;
  document.getElementById('size').textContent = v.size ? (v.size / 1024).toFixed(0) + ' KB' : '';
}).catch(() => { document.getElementById('ver').textContent = '获取失败，请刷新'; });
</script>
</body>
</html>
