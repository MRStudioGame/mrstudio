<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>DeepSeek 公益API 管理端</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f7fa; color: #1f2328; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  header h1 { font-size: 20px; flex: 1; }
  .btn { background: #1f6feb; color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  .btn:disabled { background: #9db8e8; }
  .btn.gray { background: #656d76; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { background: #fff; border-radius: 12px; padding: 12px 18px; flex: 1; min-width: 120px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .stat b { display: block; font-size: 22px; color: #1f6feb; }
  .stat span { font-size: 12px; color: #656d76; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .card .dev { font-weight: bold; font-family: Consolas, monospace; }
  .card .time { font-size: 12px; color: #656d76; margin-left: auto; }
  .keyrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; border-top: 1px dashed #eaeef2; }
  .keyrow .mask { font-family: Consolas, monospace; font-size: 13px; color: #1f2328; word-break: break-all; }
  .keyrow .bal { font-size: 12px; color: #1f6feb; font-weight: bold; }
  .keyrow .bal.neg { color: #d1242f; }
  .keyrow .bal.na { color: #9aa4b0; }
  .copy { background: #eef4ff; color: #1f6feb; border: 0; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .copy:hover { background: #dde9ff; }
  .copyall { margin-top: 8px; }
  .empty { text-align: center; color: #9aa4b0; padding: 40px 0; }
  footer { text-align: center; color: #a0a8b0; font-size: 12px; padding: 18px 0 8px; }

  /* 九键数字键盘解锁 */
  #login { max-width: 320px; margin: 60px auto; background: #fff; border-radius: 16px; padding: 26px 22px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  #login h2 { font-size: 18px; margin-bottom: 6px; }
  #login .sub { font-size: 12px; color: #9aa4b0; margin-bottom: 18px; }
  .dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 22px; min-height: 18px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #c9d1d9; }
  .dots i.on { background: #1f6feb; border-color: #1f6feb; }
  .dots i.err { background: #d1242f; border-color: #d1242f; }
  #login.shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(8px)} }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pad button { height: 58px; font-size: 22px; border: 0; border-radius: 14px; background: #f0f3f7; color: #1f2328; cursor: pointer; }
  .pad button:active { background: #dde4ec; }
  .pad button.fn { font-size: 15px; color: #656d76; background: #f6f8fa; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1f2328; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: .95; }
  .badge { font-size: 11px; border-radius: 6px; padding: 2px 8px; }
  .badge.ok { background: #e6f4ea; color: #1a7f37; }
  .badge.bad { background: #fdecec; color: #d1242f; }
  .badge.unknown { background: #f0f2f5; color: #9aa4b0; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login" hidden>
    <h2>🔑 DeepSeek 公益API 管理端</h2>
    <div class="sub">请输入解锁密码</div>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
  </div>
  <div id="app" hidden>
    <header>
      <h1>💰 DeepSeek 公益API 管理端 <span style="font-size:11px;color:#9aa4b0">v3</span></h1>
      <span id="lastUpdate" style="font-size:12px;color:#656d76"></span>
      <button class="btn gray" id="annBtn">公告管理</button>
      <button class="btn" id="refreshBtn">刷新</button>
    </header>
    <div class="stats">
      <div class="stat"><b id="sUsers">0</b><span>使用用户</span></div>
      <div class="stat"><b id="sKeys">0</b><span>Key 总数</span></div>
      <div class="stat"><b id="sNeg">0</b><span>欠费/异常 Key</span></div>
      <div class="stat"><b id="sTotal">¥0</b><span>可用余额合计</span></div>
    </div>
    <div id="annPanel" class="card" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <b>📢 公告管理</b>
        <button class="btn" id="annAdd">＋ 添加公告</button>
      </div>
      <div id="annList"></div>
    </div>
    <div id="list"><div class="empty">加载中…</div></div>
    <footer>MR工作室制作</footer>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const ADMIN_PIN = "201301";
const SUPABASE_URL = "https://mfrmsmbazofjzdpuxdod.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mcm1zbWJhem9manpkcHV4ZG9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDAxMTEsImV4cCI6MjEwMjM3NjExMX0.1VQ4V6XnR6LBGT7-3joS6Hju2twRCgrBWW9hIjX-gRY";
const TABLE = "dsb_reports";

function $(id) { return document.getElementById(id); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }

function mask(k) { return k && k.length > 9 ? k.slice(0, 5) + "…" + k.slice(-4) : k; }

function copyText(txt, tip) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => toast(tip || "已复制")).catch(() => fallbackCopy(txt, tip));
  } else { fallbackCopy(txt, tip); }
}
function fallbackCopy(txt, tip) {
  const ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast(tip || "已复制"); } catch (e) { toast("复制失败"); }
  document.body.removeChild(ta);
}

async function fetchRows() {
  const url = SUPABASE_URL + "/rest/v1/" + TABLE + "?select=device_id,keys,updated_at&order=updated_at.desc";
  const resp = await fetch(url, { headers: { apikey: SUPABASE_KEY, "Authorization": "Bea" + "rer " + SUPABASE_KEY } });
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  return resp.json();
}

async function supa(method, path, body) {
  const opt = { method: method, headers: { apikey: SUPABASE_KEY, "Authorization": "Bea" + "rer " + SUPABASE_KEY, "Content-Type": "application/json", Prefer: "return=minimal" } };
  if (body !== undefined) opt.body = JSON.stringify(body);
  const resp = await fetch(SUPABASE_URL + path, opt);
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  return resp;
}

/* ---------- 公告管理 ---------- */
let annItems = [];

async function loadAnnouncements() {
  try {
    const resp = await fetch(SUPABASE_URL + "/rest/v1/dsb_announcements?select=id,title,content,sort,enabled,builtin&order=builtin.desc,sort.asc", { headers: { apikey: SUPABASE_KEY, "Authorization": "Bea" + "rer " + SUPABASE_KEY } });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    annItems = await resp.json();
    renderAnnouncements();
  } catch (e) {
    $("annList").innerHTML = '<div class="empty">加载失败：' + e.message + '</div>';
  }
}

function renderAnnouncements() {
  const list = $("annList");
  if (!annItems.length) { list.innerHTML = '<div class="empty">暂无公告</div>'; return; }
  list.innerHTML = annItems.map((a, i) => {
    const id = a.id;
    return '<div style="border:1px solid #eaeef2;border-radius:10px;padding:10px;margin-bottom:10px">' +
      '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">' +
        (a.builtin ? '<span style="font-size:12px;color:#f5a623;font-weight:bold">⭐ 内置公告（永远第一个）</span>' : '<button class="copy" onclick="annMove(' + i + ',-1)">↑</button>' + '<button class="copy" onclick="annMove(' + i + ',1)">↓</button>' + '<span style="font-size:12px;color:#9aa4b0">ID ' + id + ' · 排序 ' + a.sort + '</span>') +
        '<label style="font-size:12px;margin-left:auto">启用 <input type="checkbox" ' + (a.enabled ? 'checked' : '') + ' onchange="annSave(' + i + ',this.checked)"></label>' +
      '</div>' +
      '<input id="at' + id + '" style="width:100%;padding:6px;border:1px solid #d0d7de;border-radius:6px;margin-bottom:6px" value="' + (a.title || '').replace(/"/g, '&quot;') + '" placeholder="标题">' +
      '<textarea id="ac' + id + '" rows="2" style="width:100%;padding:6px;border:1px solid #d0d7de;border-radius:6px;margin-bottom:6px" placeholder="公告内容">' + (a.content || '') + '</textarea>' +
      '<button class="copy" onclick="annPreview(' + i + ')">👁 预览</button> ' +
      '<button class="copy" onclick="annSave(' + i + ')">保存</button> ' +
      '<button class="copy" style="color:#d1242f;background:#fdecec" onclick="annDel(' + i + ')">删除</button>' +
    '</div>';
  }).join("");
}

async function annMove(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= annItems.length) return;
  const a = annItems[i], b = annItems[j];
  try {
    await supa("PATCH", "/rest/v1/dsb_announcements?id=eq." + a.id, { sort: b.sort });
    await supa("PATCH", "/rest/v1/dsb_announcements?id=eq." + b.id, { sort: a.sort });
    toast("顺序已调整");
    loadAnnouncements();
  } catch (e) { toast("操作失败：" + e.message); }
}

async function annSave(i, enabledOnly) {
  const a = annItems[i];
  const body = {};
  if (enabledOnly !== undefined) { body.enabled = enabledOnly; }
  else {
    body.title = $("at" + a.id).value;
    body.content = $("ac" + a.id).value;
    body.enabled = a.enabled;
  }
  try {
    await supa("PATCH", "/rest/v1/dsb_announcements?id=eq." + a.id, body);
    toast("已保存");
    loadAnnouncements();
  } catch (e) { toast("保存失败：" + e.message); }
}

async function annDel(i) {
  const a = annItems[i];
  if (!confirm("确定删除这条公告？")) return;
  try {
    await supa("DELETE", "/rest/v1/dsb_announcements?id=eq." + a.id);
    toast("已删除");
    loadAnnouncements();
  } catch (e) { toast("删除失败：" + e.message); }
}

$("annAdd").onclick = async function () {
  try {
    const max = annItems.reduce((m, x) => Math.max(m, x.sort || 0), 0);
    await supa("POST", "/rest/v1/dsb_announcements", { title: "新公告", content: "公告内容", sort: max + 10, enabled: true });
    toast("已添加，请编辑内容");
    loadAnnouncements();
  } catch (e) { toast("添加失败：" + e.message); }
};

$("annBtn").onclick = function () {
  const p = $("annPanel");
  p.hidden = !p.hidden;
  if (!p.hidden) loadAnnouncements();
};

function annPreview(i) {
  const a = annItems[i];
  document.getElementById('pvTitle').textContent = a.title || '公告';
  document.getElementById('pvContent').textContent = a.content || '';
  document.getElementById('pvGuide').hidden = !a.builtin;
  document.getElementById('pvMask').style.display = 'flex';
}

function render(rows) {
  const list = $("list");
  if (!rows || rows.length === 0) { list.innerHTML = '<div class="empty">还没有任何用户上报数据</div>'; return; }
  let users = 0, keysTotal = 0, neg = 0, sum = 0;
  const cards = rows.map(r => {
    const dev = r.device_id || "unknown";
    const ks = Array.isArray(r.keys) ? r.keys : [];
    users++; keysTotal += ks.length;
    let keyHtml = "";
    ks.forEach(k => {
      const key = k.key || "";
      const total = parseFloat(k.total);
      const hasBal = !isNaN(total);
      const avail = k.available === true;
      let balHtml = '<span class="bal na">余额未知</span>';
      if (hasBal) {
        const cur = k.currency || "CNY";
        const sign = total < 0 ? "neg" : "";
        if (total < 0) neg++;
        else if (avail) sum += total;
        balHtml = '<span class="bal ' + sign + '">' + (k.currency === "USD" ? "$" : "¥") + (Number.isFinite(total) ? total.toFixed(2) : total) + '</span>';
        balHtml += avail ? ' <span class="badge ok">可用</span>' : ' <span class="badge bad">不可用</span>';
      } else {
        balHtml += ' <span class="badge unknown">未查询</span>';
      }
      keyHtml += '<div class="keyrow"><span class="mask" title="' + key.replace(/"/g, "&quot;") + '">' + key + '</span>' + balHtml +
        '<button class="copy" onclick="copyText(\'' + key.replace(/\\/g, "\\\\").replace(/'/g, "\\'") + '\',\'已复制 Key\')">复制Key</button></div>';
    });
    const time = r.updated_at ? new Date(r.updated_at).toLocaleString("zh-CN", { hour12: false }) : "--";
    return '<div class="card"><div class="head"><span class="dev">📱 ' + mask(dev) + '</span>' +
      '<span class="time">' + time + '</span></div>' + keyHtml +
      '<button class="copy copyall" onclick="copyText(\'' + ks.map(x => x.key).join("\\n").replace(/\\/g, "\\\\").replace(/'/g, "\\'") + '\',\'已复制全部 Key\')">复制全部 Key</button></div>';
  }).join("");
  list.innerHTML = cards;
  $("sUsers").textContent = users;
  $("sKeys").textContent = keysTotal;
  $("sNeg").textContent = neg;
  $("sTotal").textContent = "¥" + sum.toFixed(2);
  $("lastUpdate").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
}

async function load() {
  const btn = $("refreshBtn"); btn.disabled = true; btn.textContent = "刷新中…";
  try {
    render(await fetchRows());
    toast("已刷新");
  } catch (e) {
    // 失败自动重试一次（可能是网络抖动）
    try {
      await new Promise(r => setTimeout(r, 1500));
      render(await fetchRows());
      toast("已刷新（重试成功）");
    } catch (e2) {
      let msg = e2.message || "未知错误";
      if (msg.indexOf("HTTP") === 0) {
        msg += "（服务器拒绝了请求）";
      } else {
        msg += "（网络或DNS问题，请按 Ctrl+F5 强制刷新，或换 Chrome/Edge 浏览器）";
      }
      $("list").innerHTML = '<div class="empty">加载失败：' + msg + '</div>';
    }
  }
  btn.disabled = false; btn.textContent = "刷新";
}

/* ---------- 九键数字键盘解锁 ---------- */
let pin = "";
const PIN_LEN = 6;
const dotsEl = $("dots");
const padEl = $("pad");
for (let i = 0; i < PIN_LEN; i++) dotsEl.innerHTML += "<i></i>";

const keys = ["1","2","3","4","5","6","7","8","9","清除","0","删除"];
padEl.innerHTML = keys.map(k => '<button data-k="' + k + '">' + (k === "删除" ? "⌫" : k) + '</button>').join("");

function renderDots(err) {
  const items = dotsEl.children;
  for (let i = 0; i < PIN_LEN; i++) {
    items[i].className = i < pin.length ? "on" : (err ? "err" : "");
  }
}
function fail() {
  $("login").classList.remove("shake");
  void $("login").offsetWidth;
  $("login").classList.add("shake");
  renderDots(true);
  setTimeout(() => { pin = ""; renderDots(false); }, 350);
}
padEl.addEventListener("click", e => {
  const k = e.target.dataset.k;
  if (!k) return;
  if (k === "清除") { pin = ""; renderDots(false); return; }
  if (k === "删除") { pin = pin.slice(0, -1); renderDots(false); return; }
  if (pin.length >= PIN_LEN) return;
  pin += k;
  renderDots(false);
  if (pin.length === PIN_LEN) {
    if (pin === ADMIN_PIN) {
      sessionStorage.setItem("dsbPin", "1");
      $("login").hidden = true;
      $("app").hidden = false;
      load();
    } else {
      toast("密码错误");
      fail();
    }
  }
});

$("refreshBtn").onclick = load;

if (sessionStorage.getItem("dsbPin") === "1") {
  $("login").hidden = true; $("app").hidden = false; load();
} else {
  $("login").hidden = false;
}
setInterval(() => { if (!$("app").hidden) load(); }, 15000);
</script>
<div id="pvMask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:98;align-items:center;justify-content:center;padding:24px">
  <div style="background:#fff;border-radius:16px;max-width:340px;width:100%;padding:16px 18px 12px;box-shadow:0 8px 30px rgba(0,0,0,.2)">
    <div style="display:flex;align-items:center"><span style="cursor:pointer;color:#656d76;font-size:20px;padding-right:10px" onclick="document.getElementById('pvMask').style.display='none'">✕</span><b id="pvTitle" style="font-size:16px;color:#1f2328">公告</b></div>
    <p id="pvContent" style="font-size:14px;color:#1f2328;line-height:1.7;margin:10px 0;white-space:pre-wrap"></p>
    <div id="pvGuide" hidden style="background:#eef4ff;border-radius:10px;padding:10px 12px;font-size:13px;color:#1f2328;line-height:1.6;margin-bottom:10px"><b style="color:#1958c4">📖 添加教程</b><br>1. 点右上角「＋ 添加」<br>2. 粘贴 DeepSeek API Key（sk- 开头）<br>3. 添加后自动查询余额<br><br>🎁 新用户添加第一个 Key 即可获得 3 元 API 余额！</div>
    <button style="width:100%;background:#1f6feb;color:#fff;border:0;border-radius:10px;padding:10px;font-size:14px;font-weight:bold;cursor:pointer" onclick="document.getElementById('pvMask').style.display='none'">知道了</button>
  </div>
</div>
</body>
</html>
