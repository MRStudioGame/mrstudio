<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E1116">
<title>MRClaw 管理端</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0E1116;color:#E7ECF3;
  font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
a{color:#4C8BFF}
.hide{display:none!important}
button,input{font:inherit;color:inherit;outline:none;border:none;background:none}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:20px;margin:0}
.sub{color:#6E7A8C;font-size:12px;letter-spacing:2px}
.btn{background:#2F6BFF;color:#fff;border-radius:10px;padding:9px 16px;font-weight:600;
  cursor:pointer;white-space:nowrap}
.btn:active{opacity:.85}
.btn.g{background:#1B2029;border:1px solid #2A313D;color:#C9D3E0}
.btn.d{background:#2A1519;color:#FF7A8A;border:1px solid #40202A}
.btn.s{padding:6px 11px;font-size:12.5px;border-radius:8px}
.inp{background:#0F1319;border:1px solid #2A313D;border-radius:10px;padding:11px 13px;width:100%}
.card{background:#151A21;border:1px solid #232A34;border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{background:#151A21;border:1px solid #232A34;border-radius:16px;padding:16px}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{color:#7C8798;font-size:12.5px}
.u{border-bottom:1px solid #1F242C;padding:14px 0}
.u:last-child{border-bottom:none}
.u .top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.name{font-weight:600;font-size:15px}
.tag{display:inline-block;background:#1B2230;border:1px solid #26364F;color:#8FB4FF;
  border-radius:7px;padding:2px 8px;font-size:11.5px;margin-left:6px}
.tag.on{background:#12251A;border-color:#1E4630;color:#6BE39B}
.key{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;word-break:break-all;
  background:#0F1319;border:1px solid #2A313D;border-radius:10px;padding:9px 11px;margin-top:9px}
.meta{color:#7C8798;font-size:12px;margin-top:6px}
.sw{width:44px;height:25px;border-radius:13px;background:#2A313D;position:relative;
  flex:0 0 44px;cursor:pointer;transition:.2s}
.sw.on{background:#2F6BFF}
.sw i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:#fff;transition:.2s}
.sw.on i{left:22px}
#gate{max-width:340px;margin:18vh auto;padding:0 20px;text-align:center}
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);
  background:#243044;border:1px solid #33507F;color:#CFE0FF;padding:10px 16px;
  border-radius:12px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;bottom:48px}
.empty{text-align:center;color:#5D6A7C;padding:40px 0}
.mbtn{background:#1A212B;border:1px solid #2A313D;color:#C9D3E0;border-radius:10px;
  width:36px;height:36px;flex:0 0 36px;font-size:16px;display:none}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;
  background:#FF3B4E;color:#fff;font-size:11px;font-weight:700;text-align:center;
  padding:0 5px;margin-left:6px;box-shadow:0 0 0 2px #151A21}
.chatwrap{display:grid;grid-template-columns:290px 1fr;gap:14px;height:calc(100vh - 300px);
  min-height:420px}
#pane-back{display:none}
.conv{background:#151A21;border:1px solid #232A34;border-radius:16px;overflow-y:auto}
.cv{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid #1F242C;cursor:pointer}
.cv:hover{background:#1A212B}
.cv.act{background:#1D2A44}
.cv .av{width:36px;height:36px;border-radius:50%;background:#243044;color:#8FB4FF;
  display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 36px}
.cv .bt{flex:1;min-width:0}
.cv .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv .pv{font-size:12px;color:#7C8798;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv .rt{text-align:right;font-size:11px;color:#7C8798}
.pane{background:#151A21;border:1px solid #232A34;border-radius:16px;display:flex;
  flex-direction:column;min-width:0}
.panehead{padding:12px 16px;border-bottom:1px solid #1F242C;display:flex;
  align-items:center;justify-content:space-between;gap:10px}
.msgs{flex:1;overflow-y:auto;padding:14px}
.sendbar{display:flex;gap:8px;padding:12px;border-top:1px solid #1F242C}
.sendbar input{flex:1}
.smsg{max-width:74%;padding:10px 13px;border-radius:14px;margin:7px 0;
  white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.smsg.me{background:#2F6BFF;color:#fff;margin-left:auto}
.smsg.op{background:#1A2028;border:1px solid #262E39}
.smsg .meta{margin-top:4px}
.offbadge{display:inline-flex;align-items:center;gap:3px;margin-left:6px;
  background:linear-gradient(135deg,#2F6BFF,#39C6F0);color:#fff;font-size:10.5px;
  font-weight:700;line-height:1.55;padding:1px 8px;border-radius:999px;
  border:1px solid rgba(255,255,255,.28);vertical-align:2px;letter-spacing:.4px;
  box-shadow:0 1px 6px rgba(47,107,255,.35);white-space:nowrap}
#sup{position:fixed;inset:0;background:rgba(6,9,13,.72);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:18px}
.supbox{width:100%;max-width:620px;max-height:86vh;display:flex;flex-direction:column;
  background:#151A21;border:1px solid #232A34;border-radius:18px;padding:16px}
.suplist{flex:1;overflow-y:auto;min-height:200px;max-height:60vh;padding:8px 2px;margin:10px 0}
.smsg{max-width:78%;padding:10px 13px;border-radius:14px;margin:6px 0;
  white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.smsg .meta{margin-top:4px}
.smsg.me{background:#2F6BFF;color:#fff;margin-left:auto}
.smsg.op{background:#1A2028;border:1px solid #262E39}
.att{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.att img{max-width:180px;max-height:180px;border-radius:10px;display:block}
.att a{font-size:12px;color:#8FB4FF;border:1px solid #26364F;background:#1A2230;
  border-radius:9px;padding:5px 9px;text-decoration:none}

/* ===== 手机自适应 ===== */
@media (max-width: 860px){
  body{font-size:15px}
  .wrap{padding:12px 12px 40px}
  h1{font-size:19px}
  .sub{font-size:11px;letter-spacing:1.5px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:13px}
  .stat b{font-size:22px}
  .card{padding:13px;margin:10px 0;border-radius:14px}
  .row{gap:8px;flex-wrap:wrap}
  #tabs, #logtabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;
    padding-bottom:4px}
  #tabs .btn, #logtabs .btn{flex:0 0 auto}
  input{font-size:16px}
  .btn{padding:9px 14px;font-size:14px}
  .btn.s{padding:8px 12px}
  .chatwrap{display:block;height:auto;min-height:0}
  .chatwrap .pane{display:none}
  .chatwrap.showchat .conv{display:none}
  .chatwrap.showchat .pane{display:flex;height:calc(100vh - 240px);min-height:380px}
  #pane-back{display:inline-flex}
  .conv{max-height:calc(100vh - 240px)}
  .cv{padding:11px 12px}
  .msgs{padding:10px}
  .smsg{max-width:88%}
  .sendbar{padding:10px;gap:6px}
  .sendbar .btn.s{padding:8px 12px}
  .suplist{max-height:52vh}
  #sup{width:100%}
  .u{padding:12px 0}
  .u .top{gap:8px}
  .key{font-size:12px}
}
</style>
</head>
<body>

<div id="gate">
  <div style="font-size:22px;font-weight:700">MRClaw 管理端</div>
  <div class="sub" style="margin:6px 0 22px">MR STUDIO</div>
  <input id="pw" class="inp" type="password" placeholder="访问密码"
         onkeydown="if(event.key==='Enter')Gate.go()">
  <div style="height:12px"></div>
  <button class="btn" style="width:100%" onclick="Gate.go()">进入</button>
  <div id="gmsg" class="meta" style="margin-top:12px"></div>
</div>

<div id="main" class="hide">
  <div class="wrap">
    <div class="row" style="justify-content:space-between">
      <div><h1>MRClaw 管理端</h1><div class="sub">MR STUDIO</div></div>
      <div class="row">
        <button class="btn g s" onclick="Panel.load()">刷新</button>
        <button class="btn g s" onclick="Gate.out()">退出</button>
      </div>
    </div>

    <div class="row" id="tabs" style="gap:8px;margin:14px 0 4px">
      <button class="btn s" id="tab-users" onclick="Panel.tab('users')">用户管理</button>
      <button class="btn g s" id="tab-sup" onclick="Panel.tab('sup')">客服消息
        <span id="sup-badge" class="badge hide">0</span></button>
      <button class="btn g s" id="tab-log" onclick="Panel.tab('log')">记录
        <span id="log-badge" class="badge hide">0</span></button>
      <button class="btn g s" id="tab-ops" onclick="Panel.tab('ops')">运营</button>
      <button class="btn g s" id="tab-rev" onclick="Panel.tab('rev')">帖子审核
        <span id="rev-badge" class="badge hide">0</span></button>
      <button class="btn g s" id="tab-posts" onclick="Panel.tab('posts')">帖子管理</button>
    </div>

    <div class="stats" id="stats"></div>

    <div id="view-users">
    <div class="card">
      <div class="row">
        <input id="q" class="inp" style="flex:1;min-width:160px" placeholder="搜索用户名 / 厂商 / 模型"
               oninput="Panel.render()">
        <label class="meta" style="display:flex;gap:6px;align-items:center;white-space:nowrap">
          <input type="checkbox" id="auto" checked onchange="Panel.auto()"> 自动刷新 30s
        </label>
      </div>
      <div class="meta" id="upd"></div>
    </div>

    <div class="card" id="list"><div class="empty">加载中…</div></div>
    </div>

    <div id="view-log" class="hide">
      <div class="row" id="logtabs" style="gap:8px;margin:12px 0 4px;flex-wrap:wrap">
        <button class="btn s" data-k="subs" onclick="Panel.log('subs')">订阅邮箱</button>
        <button class="btn g s" data-k="codes" onclick="Panel.log('codes')">兑换记录</button>
        <button class="btn g s" data-k="points" onclick="Panel.log('points')">积分变动</button>
        <button class="btn g s" data-k="ban" onclick="Panel.log('ban')">封禁记录</button>
        <button class="btn g s" data-k="register" onclick="Panel.log('register')">新注册</button>
      </div>
      <div class="card" id="loglist"><div class="empty">加载中…</div></div>
    </div>

    <div id="view-rev" class="hide">
      <div class="row" id="revtabs" style="gap:8px;margin:12px 0 4px;flex-wrap:wrap">
        <button class="btn s" onclick="Panel.rev('pending')">待处理</button>
        <button class="btn g s" onclick="Panel.rev('handled')">已处理</button>
      </div>
      <div class="card" id="revlist"><div class="empty">加载中…</div></div>
    </div>

    <div id="view-posts" class="hide">
      <div class="row" style="gap:8px;margin:12px 0 4px;flex-wrap:wrap">
        <button class="btn s" onclick="Panel.posts('all')">全部</button>
        <button class="btn g s" onclick="Panel.posts('pinned')">已置顶</button>
        <button class="btn g s" onclick="Panel.posts('removed')">已下架</button>
      </div>
      <div class="card" id="postlist"><div class="empty">加载中…</div></div>
    </div>

    <div id="view-ops" class="hide">
      <div class="card">
        <h3 style="margin:0 0 12px">广播设置</h3>
        <div class="meta">广播内容（软件顶部滚动显示）</div>
        <textarea id="bc-text" class="inp" style="height:80px;margin-top:6px" placeholder="例如：注册送 30 万积分，欢迎体验 MRClaw！"></textarea>
        <div class="row" style="margin-top:10px;flex-wrap:wrap">
          <label class="meta" style="flex:1;min-width:160px">速度（60=正常，越大越快）
            <input id="bc-speed" class="inp" type="number" value="60"></label>
        </div>
        <div class="row" style="margin-top:10px;flex-wrap:wrap">
          <label class="meta" style="flex:1;min-width:200px">开始时间（可空）
            <input id="bc-start" class="inp" type="datetime-local"></label>
          <label class="meta" style="flex:1;min-width:200px">结束时间（可空）
            <input id="bc-end" class="inp" type="datetime-local"></label>
        </div>
        <div class="row" style="margin-top:12px;justify-content:space-between">
          <label class="meta"><input type="checkbox" id="bc-on"> 开启广播</label>
          <div class="row">
            <button class="btn g s" onclick="Panel.opsLoad()">重新读取</button>
            <button class="btn s" onclick="Panel.bcSave()">保存广播</button>
          </div>
        </div>
        <div class="meta" id="bc-state" style="margin-top:8px"></div>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h3 style="margin:0">用户评价</h3>
          <span class="meta" id="rv-stat"></span>
        </div>
        <div id="rv-list" style="margin-top:12px"><div class="empty">加载中…</div></div>
      </div>
    </div>

    <div id="view-sup" class="hide">
      <div class="chatwrap">
        <div class="conv" id="conv"><div class="empty">加载中…</div></div>
        <div class="pane">
          <div class="panehead"><button class="mbtn" id="pane-back" onclick="Panel.backConv()">←</button>
            <b id="pane-title">选择一个会话</b>
            <span class="meta" id="pane-sub"></span></div>
          <div class="msgs" id="pane-msgs"><div class="empty">左侧选择用户开始聊天</div></div>
          <div id="pan-chips" class="row hide"></div>
          <div class="sendbar">
            <input type="file" id="pan-file" multiple style="display:none"
                   onchange="Panel.supPick(event)">
            <button class="btn g s" onclick="document.getElementById('pan-file').click()">＋</button>
            <input id="pane-in" placeholder="输入消息…"
                   onkeydown="if(event.key==='Enter')Panel.supSend()">
            <button class="btn s" onclick="Panel.supSend()">发送</button>
          </div>
        </div>
      </div>
    </div>

    <div class="meta" style="text-align:center;padding:16px">MRClaw · MR工作室制作</div>
  </div>
</div>

<div id="sup" class="hide">
  <div class="supbox">
    <div class="row" style="justify-content:space-between">
      <b id="sup-title">客服会话</b>
      <button class="btn g s" onclick="Panel.supClose()">关闭</button>
    </div>
    <div id="sup-list" class="suplist"></div>
    <div id="sup-chips" class="row hide"></div>
    <div class="row">
      <input id="sup-in" class="inp" style="flex:1" placeholder="回复用户…"
             onkeydown="if(event.key==='Enter')Panel.supSend()">
      <input type="file" id="sup-file" multiple style="display:none" onchange="Panel.supPick(event)">
      <button class="btn g s" onclick="document.getElementById('sup-file').click()">📎</button>
      <button class="btn s" onclick="Panel.supSend()">发送</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SB_URL = "https://mfrmsmbazofjzdpuxdod.supabase.co";
const BEARER = String.fromCharCode(66,101,97,114,101,114) + " ";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mcm1zbWJhem9manpkcHV4ZG9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDAxMTEsImV4cCI6MjEwMjM3NjExMX0.1VQ4V6XnR6LBGT7-3joS6Hju2twRCgrBWW9hIjX-gRY";

const PASS = "2013";
const AUTO_KEY = "mrclaw_admin_auto";

let DATA = [];

async function rpc(fn, args){
  const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY,
               "Content-Type": "application/json" },
    body: JSON.stringify(args || {})
  });
  const t = await r.text();
  try { return JSON.parse(t); } catch(e){ return { __err: t.slice(0,200) }; }
}

function toast(m){
  const t = document.getElementById("toast");
  t.textContent = m; t.className = "on";
  clearTimeout(t._h); t._h = setTimeout(()=>{ t.className = ""; }, 1400);
}

const Gate = {
  go(){
    const v = document.getElementById("pw").value;
    if(v !== PASS){
      document.getElementById("gmsg").textContent = "密码错误";
      return;
    }
    sessionStorage.setItem("mrclaw_admin_ok", "1");
    this.open();
  },
  open(){
    document.getElementById("gate").classList.add("hide");
    document.getElementById("main").classList.remove("hide");
    Panel.load();
    Panel.auto();
  },
  out(){
    sessionStorage.removeItem("mrclaw_admin_ok");
    location.reload();
  }
};

const Panel = {
  timer: null,
  async load(){
    document.getElementById("upd").textContent = "更新中…";
    const [list, stats] = await Promise.all([
      rpc("mrclaw_admin_list"),
      rpc("mrclaw_admin_stats")
    ]);
    if(list && list.__err){
      document.getElementById("list").innerHTML = "<div class='empty'>读取失败：" +
        String(list.__err).replace(/[<>]/g,"") + "</div>";
      document.getElementById("upd").textContent = "";
      return;
    }
    DATA = Array.isArray(list) ? list : [];
    const inbox = await rpc("mrclaw_support_inbox");
    Panel._inbox = {};
    if(Array.isArray(inbox)) inbox.forEach(function(x){ Panel._inbox[x.username] = x; });

    let subs = [];
    try{ const r0 = await rpc("mrclaw_subs_list"); if(Array.isArray(r0)) subs = r0; }catch(e){}
    Panel._subsN = subs.length;
    try{
      const reps = await rpc("mrclaw_reports_list");
      if(Array.isArray(reps)) Panel.revBadge(reps.filter(function(x){ return x.status === "pending"; }).length);
    }catch(e){}
    const seenAt = localStorage.getItem("mrclaw_subs_seen");
    let nSub = 0;
    subs.forEach(function(s){ if(!seenAt || new Date(s.created_at) > new Date(seenAt)) nSub++; });

    this.stats(stats);
    const seen = Panel.seen();
    let un = 0;
    Object.keys(Panel._inbox).forEach(function(k){ if(Panel.unread(Panel._inbox[k], seen)) un++; });
    Panel.badge(un);
    if(Panel.tabView === "log") Panel.logBadge(0);
    else Panel.logBadge(nSub);
    if(Panel.tabView === "sup") Panel.convs();
    else if(Panel.tabView === "log") Panel.log(Panel.logKind);
    this.render();
    document.getElementById("upd").textContent = "最后更新 " + new Date().toLocaleTimeString();
    Panel.auto();
  },
  auto(){
    if(this.timer){ clearInterval(this.timer); this.timer = null; }
    if(document.getElementById("auto").checked){
      this.timer = setInterval(()=>Panel.load(), 30000);
    }
  },
  stats(s){
    s = (s && !s.__err) ? s : {};
    const box = document.getElementById("stats");
    const bans = DATA.filter(banned).length;
    const sups = Object.keys(this._inbox || {}).length;
    box.innerHTML =
      cell(s.users||0, "注册用户") +
      cell(s.with_key||0, "已填 Key") +
      cell(s.autonomy||0, "已开独自操控") +
      cell(Panel._subsN || 0, "订阅邮箱") +
      cell(bans, "封禁中") +
      cell(sups, "客服会话");
    function cell(v,k){ return "<div class='stat'><b>" + v + "</b><span>" + k + "</span></div>"; }
  },
  render(){
    const q = document.getElementById("q").value.trim().toLowerCase();
    const list = DATA.filter(u=>{
      if(!q) return true;
      return [u.username, u.provider, u.model, u.device].join(" ").toLowerCase().indexOf(q) >= 0;
    });
    const box = document.getElementById("list");
    if(!list.length){ box.innerHTML = "<div class='empty'>没有数据</div>"; return; }
    box.innerHTML = list.map((u,i)=>this.card(u, DATA.indexOf(u))).join("");
  },
  card(u, idx){
    const key = u.api_key || "";
    const shown = key ? (this._show && this._show[idx] ? key : key.slice(0,6) + "••••••••" + key.slice(-4)) : "未填写";
    return "<div class='u'>" +
      "<div class='top'>" +
        "<div class='name'>" + esc(u.username) +
          (u.autonomy ? "<span class='tag on'>独自操控</span>" : "") +
          ((u.api_key) ? "<span class='tag'>已配 Key</span>" : "") +
          (Panel._inbox && Panel._inbox[u.username] ? "<span class='tag'>客服 " + Panel._inbox[u.username].total + "</span>" : "") +
        "</div>" +
        "<div class='row'>" +
          "<span class='meta'>独自操控</span>" +
          "<div class='sw " + (u.autonomy?"on":"") + "' onclick='Panel.toggle(" + idx + ")'><i></i></div>" +
        "</div>" +
      "</div>" +
      "<div class='key'>" + esc(shown) + "</div>" +
      "<div class='row' style='margin-top:9px'>" +
        "<button class='btn g s' onclick='Panel.copy(" + idx + ")'>复制 Key</button>" +

  async supPick(ev){
    const files = Array.prototype.slice.call(ev.target.files || []);
    ev.target.value = "";
    if(!files.length) return;
    window._supAttach = window._supAttach || [];
    for(const f of files){
      if(f.size > 9 * 1024 * 1024){ toast(f.name + " 超过 9MB"); continue; }
      const b64 = await new Promise(function(res){
        const fr = new FileReader();
        fr.onload = function(){ res(String(fr.result).split(",")[1] || ""); };
        fr.readAsDataURL(f);
      });
      const safe = f.name.replace(/[^\w.\-]/g, "_").slice(-40);
      const path = "admin/" + Date.now() + "_" + Math.random().toString(16).slice(2, 8) + "_" + safe;
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for(let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
      const up = await fetch(SB_URL + "/storage/v1/object/mrclaw/" + path, {
        method: "POST",
        headers: { "apikey": SB_KEY, "Authorization": "Bea" + "rer " + SB_KEY,
                   "Content-Type": f.type || "application/octet-stream", "x-upsert": "true" },
        body: bytes
      });
      if(!up.ok){ toast("上传失败 " + f.name); continue; }
      window._supAttach.push({ url: SB_URL + "/storage/v1/object/public/mrclaw/" + path,
                               name: f.name, mime: f.type || "", size: f.size,
                               type: (f.type || "").indexOf("image") === 0 ? "image" : "file" });
    }
    Panel.supChips();
  },
  supClose(){ }
};

function attachHtml(list){
  if(!list || !list.length) return "";
  return "<div class='att'>" + list.map(function(a){
    const isImg = String(a.mime || "").indexOf("image") === 0 ||
                  /\.(png|jpe?g|gif|webp|bmp)$/i.test(a.name || "");
    return isImg
      ? "<a href='" + esc(a.url) + "' target='_blank'><img src='" + esc(a.url) + "'></a>"
      : "<a href='" + esc(a.url) + "' target='_blank'>📄 " + esc(a.name || "file") + "</a>";
  }).join("") + "</div>";
}

function banned(u){
  return !!u.ban_until && new Date(u.ban_until).getTime() > Date.now();
}
function banLabel(u){
  if(!u.ban_until) return "";
  const ms = new Date(u.ban_until).getTime() - Date.now();
  if(ms > 3.0e9) return "永久";
  return Math.max(1, Math.ceil(ms / 86400000)) + " 天（至 " + new Date(u.ban_until).toLocaleString("zh-CN", {hour12:false}) + "）";
}

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
/* 官方标识（管理员账号） */
function offBadge(n){ return String(n || "") === "龙岗" ? "<span class='offbadge'>✓ 官方</span>" : ""; }

function fmt(t){
  if(!t) return "-";
  try{ return new Date(t).toLocaleString("zh-CN", {hour12:false}); }catch(e){ return t; }
}

(function boot(){
  if(sessionStorage.getItem("mrclaw_admin_ok") === "1") Gate.open();
  else document.getElementById("pw").focus();
})();
</script>
